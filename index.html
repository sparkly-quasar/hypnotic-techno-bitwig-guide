ype":"p","indent":false,"html":"The <strong>index<\/strong> (sometimes called position) is the knob that chooses which frame plays. Turn it, and the tone changes as you move through the stack."},{"type":"pre","text":"frame:   1 ........ 16 ........ 32 ........ 48 ........ 64\ntone:  smooth   ->   brighter  ->  hollow  ->  gritty  ->  harsh\n                         ^\n                   index knob points here"},{"type":"p","indent":false,"html":"<strong>Why this matters for hypnotic sound:<\/strong> if an LFO slowly moves the index back and forth, the sound's tone keeps shifting while the note stays the same. That's the \"morph\" the tutorial talks about. Movement in tone, not pitch, is exactly what this genre runs on."},{"type":"h4","text":"1a. Set up the track and synth"},{"type":"ol","start":1,"items":["Select the SPARE track (or add an Instrument Track named LEAD).","Open the Browser, find <strong>Polymer<\/strong>, drag it onto the track.","Polymer has an oscillator section on its left side with a selector for the oscillator type. Click it and choose <strong>Wavetable<\/strong>.","A wavetable name appears in that section. Click it to browse and load a different one. Pick something that sounds gritty or buzzy when you play a note. Smooth, sine-like tables won't give the phaser anything to work on.","Find the <strong>Index<\/strong> knob in the oscillator section. Hold a note and turn it slowly by hand, all the way across. Listen to the tone change. Do this before adding any LFO, so you know what the LFO is about to automate.","Set Index somewhere in the middle of its range. That's your base value. The LFO will swing above and below it."]},{"type":"h4","text":"1b. Add the LFO and route it to Index"},{"type":"p","indent":false,"html":"This is the same move as Part 4, now inside Polymer."},{"type":"ol","start":1,"items":["Find the <strong>Modulators icon in Polymer's bottom-left corner<\/strong>. Click it. The Modulators pane opens.","Click <strong>+<\/strong> in the Modulators pane. In the Popup Browser, choose <strong>LFO<\/strong>.","Set up the LFO before routing it:"]},{"type":"p","indent":true,"html":"Turn <strong>sync on<\/strong> (so the rate shows note values like 1 bar or 4 bars)"},{"type":"p","indent":true,"html":"Choose a slow value, around <strong>4 bars or 8 bars<\/strong> per cycle"},{"type":"p","indent":true,"html":"Leave the shape as sine for now"},{"type":"ol","start":4,"items":["Click the LFO's <strong>routing button<\/strong> (dot with arrow). It flashes, and Polymer's knobs turn blue.","<strong>Click and drag up<\/strong> on the <strong>Index<\/strong> knob. Small drag first, about a quarter of the knob's travel. A ring appears around Index.","Click the routing button again to stop routing.","Hold a note and listen. The tone should drift slowly and smoothly. Watch the Index ring: a small indicator moves around inside it, showing where the LFO is right now."]},{"type":"p","indent":false,"html":"<strong>Too much?<\/strong> If it sounds like a sweep effect, re-arm and drag to make the ring smaller. The tutorial calls for slow and \"not so much.\""},{"type":"p","indent":false,"html":"<strong>Nothing happening?<\/strong> Check Part 4's troubleshooting table. The usual culprit is dragging without the routing button flashing, which just moves the knob."},{"type":"p","indent":false,"html":"<strong>Hearing a jump or click once per cycle?<\/strong> Some wavetables have big tonal changes between frames. Reduce the amount, or load a different wavetable."},{"type":"h4","text":"1c. Add the arpeggiator"},{"type":"p","indent":false,"html":"The arpeggiator turns a held chord into a repeating pattern of single notes. It goes before the synth because it changes the notes, not the sound."},{"type":"ol","start":1,"items":["Open the Browser, find <strong>Arpeggiator<\/strong> (under Note FX).","Drag it onto the track <strong>to the left of Polymer<\/strong>. Notes must pass through it first.","Set its rate to <strong>1/16<\/strong>. Try <strong>1/12<\/strong> later for a triplet feel against the straight kick.","Choose a pattern mode. The tutorial uses \"play order,\" which plays notes in the order you pressed them. If Bitwig offers an as-played option, use that. Otherwise <strong>Up<\/strong> is fine.","Hold two or three notes of your chord and listen."]},{"type":"h4","text":"1d. Add grit"},{"type":"p","indent":false,"html":"Drag <strong>Distortion<\/strong> or <strong>Saturator<\/strong> to the right of Polymer. Start with modest drive. The phaser needs harmonics to work on, and this adds them."},{"type":"p","indent":false,"html":"Your chain now reads, left to right: <strong>Arpeggiator &gt; Polymer (LFO on Index) &gt; Distortion<\/strong>."},{"type":"p","indent":false,"html":"<strong>What it should sound like at this point:<\/strong> a fast, buzzy arpeggio whose tone drifts slowly over a few bars. That's correct. It won't sound hypnotic yet. This is the raw material; the phaser, filters, and tiny room in Steps 2 to 4 are what transform it."},{"type":"p","indent":false,"html":"If it's too busy, three things to try:"},{"type":"p","indent":true,"html":"Arpeggiator rate to <strong>1/12<\/strong> or <strong>1/8<\/strong>"},{"type":"p","indent":true,"html":"Hold <strong>two notes<\/strong> instead of three, so the pattern is shorter"},{"type":"p","indent":true,"html":"Shorten the notes with the Arpeggiator's gate or length control, or with Polymer's amp envelope decay, for a tighter, pluckier sound"},{"type":"h4","text":"1e. Optional: a second, plainer oscillator"},{"type":"p","indent":false,"html":"Skip this on your first pass. Come back once Steps 2 through 4 are working."},{"type":"p","indent":false,"html":"The tutorial layers a simple second oscillator against the wavetable. Two oscillators slightly out of tune with each other drift in and out of phase, which creates movement on its own. (This is the same beating effect Part 15.3 uses for its pads.)"},{"type":"ol","start":1,"items":["Right-click Polymer's header and look for an option to wrap it in an <strong>Instrument Layer<\/strong>. Alternatively, add an Instrument Layer from the Browser and drag Polymer into it.","Inside the Instrument Layer, add a second layer with a new Polymer (or Polysynth) set to a plain <strong>saw<\/strong> oscillator.","Detune the second layer slightly, a few cents. Its fine tune control will be in the oscillator section.","Balance the two layers' volumes so the wavetable stays dominant."]},{"type":"p","indent":false,"html":"Here layering side by side is exactly what you want: two sound sources playing together. (Effects, by contrast, must be in the <em>same<\/em> layer as the sound they process. See Part 0, point 7.)"}]},{"title":"Step 2: The phaser, three ways","blocks":[{"type":"p","indent":false,"html":"Ableton's Phaser-Flanger bundles three modes. In Bitwig they are separate devices. Try each, then pick one or stack two."},{"type":"p","indent":false,"html":"<strong>A. Plain phasing.<\/strong> Drag <strong>Phaser+<\/strong> onto the track, to the <strong>right of the Saturator<\/strong> (or Distortion). Chain so far: <strong>Arpeggiator &gt; Polymer &gt; Saturator &gt; Phaser+<\/strong>."},{"type":"p","indent":false,"html":"What Phaser+ has, per Bitwig's documentation: <strong>Character<\/strong> modes (GS, EHx, MX, MF), <strong>Color<\/strong> (starting tone), <strong>FB<\/strong> (feedback), <strong>Speed<\/strong> (its internal LFOs), <strong>Depth<\/strong>, <strong>Mix<\/strong>, a <strong>Modulation Curve<\/strong> choice, and a <strong>Manual Override<\/strong> mode. It has no tempo-sync button and no stage or notch count, which is where it differs from the Ableton phaser in the tutorial."},{"type":"p","indent":false,"html":"<em>Quick version (not synced):<\/em> leave Phaser+ as it is and turn <strong>Speed<\/strong> down very low. You get slow phasing straight away."},{"type":"p","indent":false,"html":"<em>Synced version, as the tutorial does it:<\/em>"},{"type":"ol","start":1,"items":["Turn on <strong>Manual Override<\/strong>. Phaser+'s internal LFOs switch off, and the <strong>Speed<\/strong> knob is replaced by a <strong>Mod<\/strong> knob. Mod is now the phaser's sweep position, and it stays still until something moves it.","Open Phaser+'s <strong>Modulators pane<\/strong> (icon in its bottom-left corner), click <strong>+<\/strong>, choose <strong>LFO<\/strong>.","On the LFO, turn <strong>sync on<\/strong> and choose a slow value: <strong>2 bars<\/strong> or <strong>4 bars<\/strong> per cycle.","By hand, set <strong>Mod<\/strong> about a quarter of the way up.","Click the LFO's routing button, then <strong>drag up on Mod<\/strong> about half the knob's travel. Stop routing."]},{"type":"p","indent":false,"html":"<em>Then, either version:<\/em>"},{"type":"p","indent":true,"html":"<strong>FB<\/strong> around 40 to 50 percent, so the sweep is clearly audible"},{"type":"p","indent":true,"html":"Try each <strong>Character<\/strong> mode and keep the one whose sweep sounds cleanest and simplest. This is how you get close to the tutorial's \"fewer notches\""},{"type":"p","indent":true,"html":"Use <strong>Color<\/strong> to move where the sweep starts, lower for darker and higher for brighter"},{"type":"p","indent":false,"html":"<strong>B. Phaser as an oscillator.<\/strong> Push the modulation fast, into the tens of times per second. At those speeds the phaser stops sounding like a sweep and starts adding new overtones and implied rhythms."},{"type":"p","indent":true,"html":"Without Manual Override: turn <strong>Speed<\/strong> up high and listen"},{"type":"p","indent":true,"html":"With Manual Override: set the LFO's sync off and raise its rate in Hz, starting around 8 Hz and going up"},{"type":"p","indent":true,"html":"For true audio-rate modulation, build it in an <strong>FX Grid<\/strong> with the Phaser+ module, which accepts a stereo signal directly"},{"type":"p","indent":false,"html":"<strong>C. The doubler.<\/strong> A short modulated delay, which produces the Doppler-style pitch wobble."},{"type":"p","indent":true,"html":"<strong>Flanger+<\/strong>, or <strong>Delay<\/strong> with very short time"},{"type":"p","indent":true,"html":"Slow LFO on delay time, then shrink the time until it smears"},{"type":"p","indent":false,"html":"<strong>Order:<\/strong> phaser before filters. When you reach Step 3, the Filter+ devices go to the right of Phaser+: <strong>Arpeggiator &gt; Polymer &gt; Saturator &gt; Phaser+ &gt; Filter+ &gt; Filter+<\/strong>. The filters then clean up and shape the movement rather than the phaser smearing an already-filtered signal."}]},{"title":"Step 3: Stacked moving filters","blocks":[{"type":"p","indent":false,"html":"The tutorial uses a third-party Ableton filter. In Bitwig, chain two <strong>Filter+<\/strong> devices to the right of Phaser+, each with its own LFO <strong>routed to its own Cutoff<\/strong>."},{"type":"p","indent":false,"html":"An LFO that isn't routed to anything does nothing. Adding it only creates the source; the routing (the ring on a knob) is what connects it to the sound."},{"type":"p","indent":false,"html":"<strong>Filter+ 1: fast rhythmic wah<\/strong> (the tutorial's key move)"},{"type":"p","indent":true,"html":"Mode <strong>low-pass<\/strong>. By hand: Cutoff about halfway, Resonance about a quarter."},{"type":"p","indent":true,"html":"LFO: sync <strong>on<\/strong>, rate <strong>1/16<\/strong>"},{"type":"p","indent":true,"html":"Route to <strong>Cutoff<\/strong>, drag up about a quarter"},{"type":"p","indent":true,"html":"Does: a \"wah\" on every 16th note"},{"type":"h4","text":"Filter+ 2: slower swell"},{"type":"p","indent":true,"html":"Mode <strong>band-pass<\/strong>. By hand: Cutoff about halfway, Resonance about a fifth."},{"type":"p","indent":true,"html":"LFO: sync <strong>on<\/strong>, rate <strong>1 bar<\/strong>"},{"type":"p","indent":true,"html":"Route to <strong>Cutoff<\/strong>, drag up about a third"},{"type":"p","indent":true,"html":"Does: a slower swell that drifts against the fast one"},{"type":"h4","text":"Filter+ 3 (optional): long thinning"},{"type":"p","indent":true,"html":"Mode <strong>high-pass<\/strong>. By hand: Cutoff low, about a fifth. Resonance at default."},{"type":"p","indent":true,"html":"LFO: sync <strong>off<\/strong>, rate <strong>0.07 Hz<\/strong>"},{"type":"p","indent":true,"html":"Route to <strong>Cutoff<\/strong>, drag up a small amount"},{"type":"p","indent":true,"html":"Does: long, slow thinning and thickening"},{"type":"p","indent":false,"html":"<strong>How to add each one<\/strong>, same steps as Drill 1:"},{"type":"ol","start":1,"items":["Drag Filter+ onto the track, to the right of the previous device.","Set the mode, Cutoff, and Resonance by hand.","Open that Filter+'s Modulators pane (bottom-left icon), <strong>+<\/strong>, <strong>LFO<\/strong>.","Set the LFO's sync and rate.","Click the LFO's routing button, drag on <strong>Cutoff<\/strong>, stop routing."]},{"type":"p","indent":false,"html":"Add Filter+ 1 and listen before adding Filter+ 2. If the fast movement is too choppy, reduce its drag; if it's inaudible, increase it."},{"type":"p","indent":false,"html":"<strong>Optional: modulate the modulator (the \"destroy the filter\" move).<\/strong> This makes Filter+ 1's fast movement speed up and slow down over time."},{"type":"ol","start":1,"items":["On Filter+ 1's LFO, turn <strong>sync off<\/strong> and set the rate to about <strong>8.8 Hz<\/strong>, roughly the same speed as 1/16 at 132 BPM. (A synced rate jumps between note values when modulated; an unsynced one glides.)","In the same Modulators pane, add a <strong>second LFO<\/strong>: sync off, rate <strong>0.05 Hz<\/strong> (one cycle every 20 seconds).","Route the second LFO to the <strong>first LFO's Rate knob<\/strong> with a small upward drag."]},{"type":"p","indent":false,"html":"You should hear the fast filter flutter gradually quicken and relax."},{"type":"p","indent":false,"html":"<strong>Tension with the template:<\/strong> the template favors slow, subtle, free-running motion. This tutorial argues for fast synced filter motion layered over slow motion. Both are valid. Test it on this voice and check whether it sits with the Perc A phasing or fights it."}]},{"title":"Step 4: Tiny room, then delay","blocks":[{"type":"ol","start":1,"items":["<strong>Small room. Convolution<\/strong> with a short small-room impulse response, or <strong>Reverb<\/strong> with size and decay near minimum. Goal is proximity, not space.","<strong>Delay.<\/strong> Turn up this track's send to <strong>FILTERED DELAY<\/strong>, or use a third-party delay (the tutorial uses a Valhalla plugin at about -12 dB; Valhalla runs in Bitwig as a VST).","Map an LFO to delay time, then try one on reverb decay."]}]},{"title":"Step 5: Edit by subtraction","blocks":[{"type":"p","indent":true,"html":"A/B the reverb against the delay. Often only one survives."},{"type":"p","indent":true,"html":"Try no time effects at all, just phasing. A dry phased signal is a strong starting point for the mix."}]},{"title":"Step 6: Fitting it into the mix","blocks":[{"type":"p","indent":false,"html":"A rich, moving voice like this one easily swamps the drums. The drums aren't too quiet; the voice is covering the frequencies they live in. This is called masking, and raising the drums' volume doesn't fix it."},{"type":"p","indent":false,"html":"<strong>Diagnose first.<\/strong> Mute the lead. If the kick and hats sound right with it muted, the problem is masking. Put any gain you added to the hats back where it was."},{"type":"p","indent":false,"html":"Then, one at a time, listening after each:"},{"type":"ol","start":1,"items":["<strong>Turn the lead down<\/strong> with its mixer fader until the kick feels punchy again, then nudge it back up just until the voice feels present. Fix by lowering the loud thing, not raising everything else.","<strong>Clear space for the kick.<\/strong> Add <strong>EQ+<\/strong> at the end of the chain. Low cut (high-pass) at <strong>400 to 500 Hz<\/strong>, higher than the template's 300 Hz, because this voice is atmosphere rather than bass. The kick's punch lives below that.","<strong>Clear space for the hats.<\/strong> In that same EQ+, add a gentle high shelf cut, a few dB down from around <strong>7 to 8 kHz<\/strong>. Hats live up there, and the voice's distortion and resonance put a lot of energy in that range.","<strong>Duck it with the kick.<\/strong> Add <strong>Tool<\/strong> at the very end. Add an <strong>Audio Sidechain<\/strong> modulator, source <strong>KICK<\/strong>, and drag <strong>down<\/strong> on Tool's Gain a small amount, a few dB. Set its <strong>Fall<\/strong> shorter than the rumble's (around 100 ms) so the voice comes straight back. The kick gets a small window to punch through on every beat.","<strong>Push it back in space.<\/strong> Treat it as atmosphere: a little wider, more reverb send, less of its dry signal. Keep the kick and hats dry and centred. Drums in front, atmosphere behind.","<strong>If it's still dense:<\/strong> reduce the Saturator drive or the Filter+ resonance slightly. Both add loud peaks."]},{"type":"p","indent":false,"html":"Check the master meter throughout. If it's near the top, everything is getting squashed together, which makes masking worse."}]},{"title":"Variation","blocks":[{"type":"p","indent":false,"html":"Swap Polymer for <strong>Sampler<\/strong> in granular playback mode with a texture or field recording. Keep the entire effects chain."}]},{"title":"Fit in the template","blocks":[{"type":"p","indent":false,"html":"High-pass at 300 Hz so it stays clear of the rumble. Enters around bar 97 or 129 in the arrangement, in place of or alongside the chord stab."}]}]},{"title":"Part 8: Arrangement","blocks":[{"type":"p","indent":false,"html":"Eight minutes at 132 BPM is 264 bars. Bitwig's timeline starts at <strong>bar 1<\/strong>, so the track runs from bar 1 to the start of bar 265."},{"type":"p","indent":false,"html":"<strong>Placing cue markers.<\/strong> Add a labelled marker at each bar in the table so you can see the structure while working. In the Arrangement, right-click the ruler along the top at the bar you want and look for the option to add a cue marker. Double-click a marker to rename it."},{"type":"table","rows":[["<strong>Bar<\/strong>","<strong>Event<\/strong>"],["1","Kick, rumble, hats. Mix-in."],["33","Perc A enters, filtered down, opens over 16 bars"],["65","Atmos fades in"],["97","Perc B enters. First chord stab."],["129","Chord settles into its 8-bar cycle"],["161","Peak. Everything present."],["193","Drum bus filter sweep. This is the breakdown, not a removal."],["225","Elements strip out one at a time"],["257","Kick, rumble, hats. Mix-out."],["265","End"]],"header":true},{"type":"p","indent":false,"html":"No drops. Change one element every 16 to 32 bars. The 32-bar intro and outro exist so the track is mixable."},{"type":"p","indent":false,"html":"This table is the skeleton. Part 13 covers how to make the space between these events feel alive, and how to actually get from a loop to a finished arrangement."}],"subs":[]},{"title":"Part 9: Verification","blocks":[{"type":"p","indent":false,"html":"Run these before calling anything finished."},{"type":"p","indent":true,"html":"<strong>Mono check.<\/strong> Collapse to mono. If the low end thins, check that Tool's Width on RUMBLE (and on any other low-end layer from Part 14) is all the way down."},{"type":"p","indent":true,"html":"<strong>Bypass test.<\/strong> Bypass RUMBLE for four bars. Un-bypassing should sound like something was added, not like something got muddier. If it sounds cleaner without it, it's too loud."},{"type":"p","indent":true,"html":"<strong>Phone speaker.<\/strong> The pulse should survive with no low end at all. If not, more saturation on the KICK, not the rumble."},{"type":"p","indent":true,"html":"<strong>Rumble buildup.<\/strong> Solo out the kick, watch the spectrum between hits. Accumulating low energy between kicks is why hypnotic mixes sound huge in headphones and thin in a room."},{"type":"p","indent":true,"html":"<strong>One owner for the sub.<\/strong> If you've added a bass, tom rumble, or noise sub from Part 14, solo the low-end tracks together. Only one should carry the content below about 100 Hz."},{"type":"p","indent":true,"html":"<strong>Headroom.<\/strong> With just kick and rumble, the master meter should have plenty of room left."},{"type":"p","indent":true,"html":"<strong>Predictability.<\/strong> Play 24 bars with no automation. If you can predict what comes next, your loop lengths are too aligned."},{"type":"p","indent":false,"html":"Part 11 adds a second verification pass for the mastered file."}],"subs":[]},{"title":"Part 10: Saving as a template","blocks":[{"type":"p","indent":false,"html":"<strong>File &gt; Save As Template.<\/strong> It then appears in the dashboard when you create a new project."},{"type":"p","indent":false,"html":"Save with all channels present but no MIDI. The device chains, routing, modulator assignments, groove, and cue markers are the template. The notes are the song."},{"type":"p","indent":false,"html":"Save the master chain from Part 11 in the template too, but leave every device bypassed. An active clipper and limiter will quietly flatter every sketch you start, and you'll stop hearing the mix."},{"type":"p","indent":false,"html":"<strong>Saving a single sound as a preset<\/strong> (a template is a whole project; a preset is one device or container). Click the narrow <strong>vertical name strip<\/strong> on the left edge of the outermost container, check that the highlight runs around the entire device out to its right edge, then right-click that same strip and choose <strong>Save as Preset<\/strong>. Saving from an inner device saves only that piece. When you load the preset later, nested containers open collapsed, so click into each one before deciding something is missing. Part 12 has the full story from the Rubby Wubby build, and Part 14.7 uses the same move for a portable rumble kick."}],"subs":[]},{"title":"Part 11: Mastering and output level","blocks":[{"type":"p","indent":false,"html":"<strong>Skip this until you're preparing a release.<\/strong> Nothing here is needed to write, and an active master chain will flatter your sketches."},{"type":"p","indent":false,"html":"Device names and parameters below were checked against Bitwig's user guide in October 2026."}],"subs":[{"title":"Why the exports are quiet","blocks":[{"type":"p","indent":false,"html":"Bitwig's Export Audio dialog has <strong>no normalize option<\/strong>. Its four settings are Real-time, Dither, Pre-fader, and Open target folder when done. Whatever the master bus puts out is exactly what lands in the file. The quiet export is therefore a mixing fact, not an export setting, and three of the causes are in this template."},{"type":"table","rows":[["<strong>Where<\/strong>","<strong>What<\/strong>","<strong>Roughly<\/strong>"],["Part 1","6 dB of master headroom, with no step that ever recovered it","6 dB"],["HATS","Drum Machine's container fader defaults to <strong>-10 dB<\/strong>; the chains inside it default to 0 dB <em>relative to that<\/em>","up to 10 dB on that track"],["Master","No limiter, so the kick's single loudest peak sets the ceiling for everything else","usually the biggest one"]],"header":true},{"type":"p","indent":false,"html":"Check any other container device in the project (FX Layer, Instrument Layer, Drum Machine) for the same default. It's a deliberate headroom choice by Bitwig, not a bug, and it's invisible once the device is collapsed."},{"type":"p","indent":false,"html":"<strong>Also confirm Pre-fader is unticked<\/strong> in the export dialog. It ignores all mixer volume automation and exists for exporting stems. If it's on, your export is not what you were listening to."}]},{"title":"Peak level and loudness are not the same thing","blocks":[{"type":"p","indent":false,"html":"A file can peak at -0.1 dBFS and still sound quiet. Peak is the single loudest instant. Loudness is sustained energy over time, measured in LUFS. Hypnotic techno is sparse, so the gap between the two is unusually wide: the kick transient is high, and the average energy of everything else is low. That gap is the whole problem, and the fix is to reduce the gap, not to turn the master up."}]},{"title":"Mastering is two jobs, and the first one matters more","blocks":[{"type":"ol","start":1,"items":["<strong>Mix-stage control.<\/strong> Getting peaks under control at the source so the master chain has something even to work with. For this genre, this is most of the work.","<strong>Master-stage loudness.<\/strong> A clipper, a little glue, a limiter, and a meter, applied to a mix that's already balanced."]},{"type":"p","indent":false,"html":"If you find yourself pushing the limiter hard, the answer is upstream, not a different limiter."}]},{"title":"Step 0: get a meter","blocks":[{"type":"p","indent":false,"html":"Bitwig's Analysis category contains <strong>Oscilloscope<\/strong> and <strong>Spectrum<\/strong> only. There is no native LUFS meter, and nothing in version 6 or 6.1 added one (6 was automation editing, automation clips, clip aliases, project-wide key signature and new tools; 6.1 was the Sampler overhaul plus a Tuner). Don't go hunting for a device that doesn't exist."},{"type":"p","indent":false,"html":"Install a free third-party meter as a VST. <strong>Youlean Loudness Meter<\/strong> (free version) or <strong>dpMeter<\/strong> are the usual choices. You need integrated LUFS and true peak, not just a peak meter. Put it at the very end of the master chain, after everything, where it only reads and processes nothing."}]},{"title":"Release targets","blocks":[{"type":"table","rows":[["<strong>Target<\/strong>","<strong>Value<\/strong>","<strong>Note<\/strong>"],["True peak ceiling","<strong>-1.0 dBTP<\/strong>","Headroom for lossy encoding and D/A conversion"],["Integrated loudness","<strong>-9 to -8 LUFS<\/strong>","Club-facing techno convention, not a standard"],["Limiter gain reduction","<strong>1 to 3 dB<\/strong> on the loudest sections","More than that means fix the mix"],["","24-bit WAV, no dither;","Bitwig's Dither option adds a small amount of"],["","",""],["","",""],["Export format","16-bit WAV with dither if a distributor asks","noise so lower-resolution exports match the high-resolution internal signal"]],"header":true},{"type":"p","indent":false,"html":"Be skeptical of the loudness number. Most streaming services normalize playback to roughly -14 LUFS, so a very loud master simply gets turned down, and you've traded dynamics for nothing. Mastering louder than -8 buys you volume on unnormalized platforms (Bandcamp, SoundCloud in some contexts, a DJ's own files) and costs you everywhere else. For a hypnotic track whose effect depends on space and subtlety, the quieter end of that range is a defensible artistic choice, not a compromise. Pick the number on purpose."},{"type":"p","indent":false,"html":"<strong>One caveat on the Peak Limiter.<\/strong> Bitwig's user guide describes it only as a limiter with peak level, gain, and release controls. Assume it has no true-peak detection unless you find a control saying otherwise. A non-true-peak limiter set to -1.0 can still produce inter-sample peaks above that. So set the Ceiling to about <strong>-1.5 dB<\/strong>, read the actual true peak on your meter, and adjust until the meter says -1.0 dBTP. Do not compensate by setting the ceiling far lower; that just makes a quiet file."}]},{"title":"Gain staging, which has to happen first","blocks":[{"type":"p","indent":false,"html":"Every threshold below is an absolute level, so none of them mean anything until the signal arriving at them is predictable. Numbers from another project do not transfer."},{"type":"p","indent":false,"html":"With the <strong>entire master chain bypassed<\/strong>, the mix should peak around <strong>-6 dBFS<\/strong> at its loudest point, which is bar 161 in the Part 8 arrangement. Adjust with group faders rather than moving every channel. Note the actual peak reading you end up with; the clipper settings below are expressed relative to it."}]},{"title":"The master chain","blocks":[{"type":"p","indent":false,"html":"Left to right on the Master track:"},{"type":"table","rows":[["<strong>Position<\/strong>","<strong>Device<\/strong>","<strong>Job<\/strong>"],["1","<strong>EQ+<\/strong>","Corrective only. High-pass at 20 to 25 Hz."],["2","<strong>Over<\/strong>","The clipper. Does most of the loudness work."],["3","<strong>Compressor+<\/strong>","Glue, 1 to 2 dB. Often removable."],["4","<strong>Tilt<\/strong> or <strong>EQ+<\/strong>","Broad tonal move, optional."],["5","<strong>Peak Limiter<\/strong>","Catches the last 1 to 2 dB. Ceiling."],["","",""],["","",""],["","",""],["6","<strong>Loudness meter<\/strong> (VST)","Reads only. No processing."]],"header":true},{"type":"h4","text":"1. EQ+ (corrective)"},{"type":"p","indent":false,"html":"One band: high-pass at 20 to 25 Hz. Subsonic energy you can't hear still consumes headroom, and your rumble chain puts a lot of content very low. Nothing else here. Tonal decisions go at position 4, after the dynamics, so you're shaping what you'll actually hear."},{"type":"h4","text":"2. Over, the device that does the real work"},{"type":"p","indent":false,"html":"<strong>Over<\/strong> is Bitwig's anti-aliased clipper. A clipper flattens the very tops of the loudest peaks (mostly the kick's click), which lets everything else come up in level. Its controls, per the user guide:"},{"type":"p","indent":true,"html":"<strong>Threshold<\/strong>, the base level above which clipping is applied (or, in <strong>Delta<\/strong> mode, the level above which signal is heard)"},{"type":"p","indent":true,"html":"<strong>Multiband Blend<\/strong>, mixing clipping of the entire incoming signal at 0 percent with multiband clipping at 100 percent, with an optional <strong>Multiband Tilt<\/strong>"},{"type":"p","indent":true,"html":"<strong>Knee<\/strong>, which increases the width of transitions and generally softens clipping"},{"type":"p","indent":true,"html":"A <strong>Wet FX<\/strong> chain for processing only the wet signal, plus <strong>Wet Gain<\/strong> and <strong>Mix<\/strong>"},{"type":"p","indent":true,"html":"<strong>PCM Clipping<\/strong>, which provides digital flatlining at the PCM Threshold"},{"type":"p","indent":false,"html":"<strong>Before you start:<\/strong> leave <strong>PCM Clipping off<\/strong> and <strong>Multiband Blend at 0 percent<\/strong>. PCM Clipping is a second, separate hard clip inside the same device, and running two clipping stages at once makes it impossible to tell what you're hearing. Leave <strong>Knee<\/strong> alone until the threshold is set."},{"type":"h4","text":"Setting the Threshold"},{"type":"p","indent":false,"html":"There is no universal number, because Threshold is absolute and depends entirely on how hot the signal reaching it is. The target is not a threshold value, it is <strong>2 to 4 dB shaved off the kick transient<\/strong>. Up to 6 dB is defensible in this genre if it really is only the transient. Past that the kick loses its front edge."},{"type":"ol","start":1,"items":["Gain stage first (above). Note your peak reading with Over bypassed. Call it <strong>P<\/strong>. If you did step 0 properly, P is around -6 dBFS.","Set <strong>Threshold<\/strong> to roughly <strong>P minus 1 dB<\/strong>, so about -7 dBFS. Almost nothing should be happening yet.","Lower it in <strong>0.5 dB steps<\/strong>, watching the master peak meter. Each step should pull the peak reading down slightly.","Stop when the peak reading has dropped <strong>2 to 3 dB<\/strong> below P. For a mix peaking at -6 dBFS, that usually lands Threshold somewhere around <strong>-9 to -8 dBFS<\/strong>. Treat that as a sanity check on your own number, not as the setting."]},{"type":"p","indent":false,"html":"Then confirm by ear, which matters more than the meter:"},{"type":"ol","start":5,"items":["Turn <strong>Delta<\/strong> on. You should hear the kick's click and transient edge, and very little else. If you can hear the kick's body, pitch, or tail, you have gone too far. If you can hear hats or percussion, much too far.","Turn Delta off. The kick should feel tighter and the mix should feel like it has more room. Not duller.","Only now, if the result sounds brittle, raise <strong>Knee<\/strong> slightly."]},{"type":"h4","text":"Multiband Blend, in numbers"},{"type":"p","indent":false,"html":"The knob runs 0 to 100 percent. At 0 the whole signal is clipped together as one; at 100 each band is clipped independently."},{"type":"h4","text":"Start at 0 percent and usually leave it there."},{"type":"p","indent":true,"html":"Raise it only if clipping the kick is audibly dragging the rest of the mix down with it, which you will hear as hats and percussion dipping on every kick."},{"type":"p","indent":true,"html":"If you do raise it, <strong>20 to 40 percent<\/strong> is the useful range. Past about 50 percent on a master bus it starts to sound processed, and the kick loses weight because the low band is being clipped in isolation."},{"type":"h4","text":"Clip at the source too, not just here"},{"type":"p","indent":false,"html":"This is the single biggest lever in the whole part. Put a clipper or a Saturator on the <strong>KICK<\/strong> track itself and take 2 to 3 dB off the transient there, before it ever reaches the master. The master clipper then only has to catch what's left. Part 14.7's glue step (soft clipping kick and rumble together) is the same move."},{"type":"p","indent":false,"html":"Splitting 5 dB of clipping across two stages is far less audible than asking one device for 5 dB. If the master Over is having to work hard, this is the fix, not a lower threshold."},{"type":"h4","text":"Where the low end moves under you"},{"type":"p","indent":false,"html":"LFO 4 sweeps RUMBLE's low-pass on a 77-second cycle, so the level arriving at Over is not constant. Set the threshold during the densest part of the arrangement, then play a couple of minutes elsewhere and confirm the clipper is not sitting idle for long stretches."},{"type":"h4","text":"A last check"},{"type":"p","indent":false,"html":"Bypass Over and match levels before judging it. A clipper always makes things louder, and louder always sounds better for about three seconds."},{"type":"h4","text":"3. Compressor+ for glue"},{"type":"p","indent":false,"html":"<strong>Finding the controls.<\/strong> Both of the controls below are on <strong>Compressor+<\/strong>, not on <strong>Compressor<\/strong>, which is a separate device. And the Character control is a chooser that <strong>displays its current value rather than the word \"Character,\"<\/strong> so what you are looking for on screen is a small dropdown currently reading <strong>Vanilla<\/strong>. If the device is narrow, widen it; the Inspector Panel on the left always shows the full parameter list, and there is an Expanded Device View showing a display for each of the four bands."},{"type":"p","indent":true,"html":"<strong>Character<\/strong> offers six styles: Vanilla (the default), Smooth, Over, Glue, Resist, Smash. <strong>Glue<\/strong> is documented as slow to engage and quick to release, for good transient preservation on the mix buss. Use that one."},{"type":"p","indent":true,"html":"<strong>1 to 2 dB<\/strong> of gain reduction, no more."},{"type":"p","indent":true,"html":"<strong>Learn Make-up Gain<\/strong> is a small <strong>L<\/strong> button beside the <strong>Make-up<\/strong> label in the output section, not a menu item. It listens to the incoming device level for 15 seconds and roughly matches that level at the output, then stops on its own (or click it again to stop early). This is what makes an honest bypass test possible, instead of being fooled by the louder version always sounding better."},{"type":"p","indent":true,"html":"<strong>If the lows pump:<\/strong> Compressor+ always analyses the signal in four bands (lows red, lo-mids yellow, hi-mids green, highs purple), and each band has an <strong>Intensity Offset<\/strong> and a <strong>Timing Offset<\/strong>. Positive Intensity means stronger compression for that band, negative backs it off; positive Timing means longer times. Give the low band a positive Timing Offset so the kick and rumble are not chewed by fast gain changes. These per-band controls are always available in the Inspector Panel. This replaces reaching for a separate multiband device."},{"type":"p","indent":true,"html":"<strong>Wet / Dry Mix<\/strong> is there if you would rather do parallel compression than a light touch."},{"type":"p","indent":false,"html":"Then be willing to delete it. On a sparse mix that has already been clipped, this stage frequently does nothing you can hear. Engage Learn Make-up Gain, bypass, and listen. If you cannot tell, take it out. A device that survives only because it is hard to prove it is not helping is not earning its place."},{"type":"h4","text":"4. Tilt or EQ+ (tonal)"},{"type":"p","indent":false,"html":"Broad moves only, half a dB to a dB. <strong>Tilt<\/strong> is the quickest way to brighten or darken the whole spectrum without choosing frequencies. Use EQ+ with wide shelves if you want more control. If you need more than about 2 dB anywhere, go back to the mix."},{"type":"h4","text":"5. Peak Limiter"},{"type":"p","indent":true,"html":"<strong>Ceiling<\/strong> around <strong>-1.5 dB<\/strong> to start, then adjust against your meter's true peak reading until it reports -1.0 dBTP."},{"type":"p","indent":true,"html":"Bring the input gain up slowly until the meter shows your target integrated loudness."},{"type":"p","indent":true,"html":"<strong>1 to 3 dB<\/strong> of gain reduction on the loudest section. If it needs more, go back to Over or to the mix."},{"type":"p","indent":true,"html":"Release: start moderate. Too fast adds distortion on the low end, too slow makes the whole mix duck behind the kick. Your Part 2 rumble already ducks on every beat, so a slow limiter release stacks a second pump on top of the one you designed."},{"type":"h4","text":"6. The meter"},{"type":"p","indent":false,"html":"Last, reading only. Nothing after it."}]},{"title":"Order of operations","blocks":[{"type":"p","indent":false,"html":"Do not start at the master."},{"type":"ol","start":1,"items":["<strong>Finish the mix.<\/strong> Part 9's checks all pass.","<strong>Recover the hidden attenuation.<\/strong> Drum Machine container fader, any other containers.","<strong>Clip the kick at source.<\/strong> 2 to 3 dB off the transient on the KICK track.","<strong>Gain stage into the master.<\/strong> Chain bypassed, mix peaking around <strong>-6 dBFS<\/strong> at bar 161.","<strong>Remove the 6 dB of writing headroom<\/strong> from the master fader (set it back to 0 dB). It has served its purpose.","<strong>Over.<\/strong> PCM Clipping off, Multiband Blend 0, then set Threshold by the procedure above.","<strong>Compressor+.<\/strong> Glue, 1 to 2 dB, Learn Make-up, bypass test.","<strong>Tilt or EQ+.<\/strong> Small.","<strong>Peak Limiter.<\/strong> Ceiling, then input gain to target.","<strong>Measure over the whole arrangement<\/strong>, not a loop.","<strong>Export, then meter the exported file<\/strong>, not the project."]}]},{"title":"The thing in this template that will catch you out","blocks":[{"type":"p","indent":false,"html":"Two of your own modulators move low-end energy over long timescales:"},{"type":"p","indent":true,"html":"<strong>LFO 4<\/strong> sweeps RUMBLE's low-pass between roughly 170 and 230 Hz on a 77-second cycle"},{"type":"p","indent":true,"html":"The <strong>Audio Sidechain<\/strong> moves Tool's Gain on RUMBLE on every kick"},{"type":"p","indent":false,"html":"So the energy arriving at your master is not constant, and a limiter dialled in during one part of that cycle will behave differently in another."},{"type":"p","indent":false,"html":"Practical consequence: measure <strong>integrated<\/strong> LUFS across the full 264 bars, never across a 16-bar loop. Then watch the <strong>short-term<\/strong> reading at two points about 40 seconds apart. If they differ by more than about 1 LU, decide whether that's the slow drift you designed or an accident of where the LFO happened to be. Either answer is fine. Not knowing which is not."}]},{"title":"Reference tracks","blocks":[{"type":"p","indent":false,"html":"Pull two or three released tracks in the genre into a Bitwig project alongside your own. Match their loudness to yours with the meter before comparing, because the louder of any two things sounds better. Then A/B."},{"type":"p","indent":false,"html":"The gap is almost never \"overall loudness.\" It's usually low-end balance or high-frequency presence, and the reference will tell you which within about a minute. This is faster and more honest than any target number."}]},{"title":"Verification, in addition to Part 9","blocks":[{"type":"p","indent":true,"html":"<strong>Meter the exported file<\/strong>, not the project. Integrated LUFS and true peak."},{"type":"p","indent":true,"html":"<strong>Mono check again<\/strong>, after the master chain. Clipping and limiting can shift the stereo image, and your rumble depends on mono low end."},{"type":"p","indent":true,"html":"<strong>Bypass the entire master chain<\/strong> and level-match before judging. Un-bypassing should sound more finished, not merely louder. If the only difference is level, the chain is doing nothing but costing you dynamics."},{"type":"p","indent":true,"html":"<strong>Phone speaker test on the exported file.<\/strong> The Part 9 version of this test was on the project; the file is what people get."},{"type":"p","indent":true,"html":"<strong>Listen to the full eight minutes once<\/strong>, at a moderate level, start to finish. Long-form pumping and slow-cycle problems only show up in real time."}]},{"title":"What not to do","blocks":[{"type":"p","indent":true,"html":"Don't push the Peak Limiter past about 3 dB of gain reduction. That's a mix problem wearing a limiter costume."},{"type":"p","indent":true,"html":"Don't stack a second limiter after the first."},{"type":"p","indent":true,"html":"Don't master into the 6 dB headroom and then remove it afterwards. Remove it first, then master."},{"type":"p","indent":true,"html":"Don't run Over's PCM Clipping alongside its main Threshold while you're dialling in. Two clipping stages at once make it impossible to hear what either is doing."},{"type":"p","indent":true,"html":"Don't chase a LUFS number at the cost of the track. Streaming normalizes; your ears don't un-hear a crushed mix."},{"type":"p","indent":true,"html":"Don't judge any of this on a 16-bar loop."}]},{"title":"If you send it out instead","blocks":[{"type":"p","indent":false,"html":"If you'd rather have someone else master it for release, which is a reasonable choice for a first release:"},{"type":"p","indent":true,"html":"Export with the <strong>master chain bypassed entirely<\/strong>"},{"type":"p","indent":true,"html":"Peaking around <strong>-6 dBFS<\/strong>"},{"type":"p","indent":true,"html":"<strong>24-bit WAV, no dither<\/strong>, project sample rate"},{"type":"p","indent":true,"html":"Full arrangement with a bar of silence either side"},{"type":"p","indent":true,"html":"Keep the project file and send a note about the sidechain and the slow LFOs, since both will look like problems to someone who doesn't know they're intentional"}]}]},{"title":"Part 12: Sound palette","blocks":[{"type":"p","indent":false,"html":"Recipes for the sounds that come up again and again in hypnotic techno, built from Bitwig's own devices. Each one lists what it is, a starting chain, and where it sits. Every chain reads left to right, and every modulator uses the same routing move from Part 4. Low-end sounds (rumbles, subs, basslines) have their own part, Part 14."},{"type":"p","indent":false,"html":"Treat the numbers as starting points. The point of each recipe is the idea behind it, which you can then push wherever your ears go. Build each new sound on the SPARE track or a fresh instrument track."}],"subs":[{"title":"12.1 Four principles that apply to every recipe","blocks":[{"type":"p","indent":false,"html":"<strong>1. Harmonics first.<\/strong> A filter, phaser, or EQ can only move frequencies that already exist. If a source is thin (a sine, a short woodblock), put <strong>Saturator<\/strong> or <strong>Distortion<\/strong> right after it, before anything that sweeps."},{"type":"p","indent":false,"html":"<em>How saturation creates harmonics.<\/em> A pure sine is one frequency. Push it through something that bends or clips the waveform and the output is no longer a pure sine. That bent shape is mathematically the same as the original plus new sine waves at whole-number multiples of it: feed in 100 Hz and you get energy at 200, 300, 400 Hz and up. Your ear hears these as the sound getting richer and brighter, not as new notes."},{"type":"p","indent":true,"html":"<strong>Even harmonics<\/strong> (2x, 4x) sound warm and full. Gentle, tube-style saturation leans this way."},{"type":"p","indent":true,"html":"<strong>Odd harmonics<\/strong> (3x, 5x) sound harsher and more aggressive. Hard clipping and transistor-style distortion lean this way."},{"type":"p","indent":false,"html":"Saturator's modes and curves are different bend shapes, which give different mixes of the two."},{"type":"p","indent":false,"html":"<strong>2. Movement in tone, not pitch.<\/strong> This genre runs on sounds whose colour changes while the notes stay put: filter cutoff, wavetable index, phaser position, delay mix, width. (Part 15 adds the counterpoint: small, unquantized pitch movement is also a core hypnotic tool, used sparingly.)"},{"type":"p","indent":false,"html":"<strong>3. Parallel for anything wild.<\/strong> A device that sounds great but takes over everything (Treemonster, a vocoder, heavy distortion) goes on its <strong>own layer inside an FX Layer<\/strong> rather than in the main chain. The layer's volume then becomes a blend knob, so you choose how much of its character you want."},{"type":"p","indent":false,"html":"<strong>4. Watch your feedback.<\/strong> Delays, Filter+'s FB FX section, Phaser+'s FB, and reverbs all feed signal back into themselves. Stack two or three of them with saturation in the loop and the sound can sustain forever after you stop playback. See \"Sound keeps playing after I stop\" in Troubleshooting."}]},{"title":"12.2 The wub (rhythmic resonant texture)","blocks":[{"type":"p","indent":false,"html":"Learned the hard way on the Rubby Wubby build. There are <strong>two different mechanisms<\/strong> that produce a wub, and knowing which one you're using is the whole game."},{"type":"h4","text":"Road A: the filter wub"},{"type":"p","indent":true,"html":"What moves: a resonant filter's cutoff"},{"type":"p","indent":true,"html":"Main device: Filter+, low-pass, resonance up"},{"type":"p","indent":true,"html":"Character: smooth, vocal, \"wow\""},{"type":"p","indent":true,"html":"Control: full. You set the rhythm and depth."},{"type":"p","indent":true,"html":"Goes wrong as: thin, if the source lacks harmonics"},{"type":"h4","text":"Road B: the ring-mod wub"},{"type":"p","indent":true,"html":"What moves: the pitch of a sine wave being multiplied with your sound"},{"type":"p","indent":true,"html":"Main device: Treemonster"},{"type":"p","indent":true,"html":"Character: textured, metallic, unstable, liquid"},{"type":"p","indent":true,"html":"Control: partial. The motion follows whatever pitch Treemonster detects."},{"type":"p","indent":true,"html":"Goes wrong as: muffled and \"underwater,\" or chaotic"},{"type":"p","indent":false,"html":"The best version usually uses <strong>both<\/strong>: Road A as the steerable backbone, Road B blended in on a parallel layer for texture."},{"type":"h4","text":"Road A: the filter wub"},{"type":"ol","start":1,"items":["<strong>Source.<\/strong> Polymer on a saw or a gritty wavetable, or keep a percussive sample (the woodblock works) in Sampler. A sample's natural attack gives you rhythm for free.","<strong>Saturator<\/strong> straight after it. Drive up a fair amount. This gives the filter harmonics to sweep through.","<strong>Filter+<\/strong>, low-pass. Set <strong>Cutoff<\/strong> fairly low by hand, about a quarter up.","Turn up <strong>Resonance<\/strong> to a third or halfway. On Filter+ the big knob is Cutoff; Resonance is the <strong>smaller knob beside it<\/strong>. Sweep the Cutoff by hand: you should hear an obvious vowel-like \"wow.\" If you don't, raise Resonance until you do. Go slowly past halfway, since high resonance at a low cutoff gets loud and whistly fast.","<strong>Make it rhythmic.<\/strong> Two options:"]},{"type":"p","indent":true,"html":"<strong>LFO<\/strong>, sync on, 1/8 or 1/16, routed up to Cutoff. Even, repeating wub. Try different shapes; a ramp sounds very different from a sine."},{"type":"p","indent":true,"html":"<strong>Steps<\/strong> modulator (Drill 5 in Part 4), routed to Cutoff. Draw an actual rhythm: two low steps, one high, a gap. Set its step count to something odd like <strong>7<\/strong> so it drifts against the 4-bar loops, the same trick as Perc A."},{"type":"ol","start":6,"items":["<strong>Delay+<\/strong> after the filter for echoes of the wub, then optionally a second <strong>Filter+<\/strong> with a slow, unsynced LFO for long-scale drift."]},{"type":"p","indent":false,"html":"Listen after step 5 before adding anything. If it already wubs the way you want, everything after is seasoning."},{"type":"h4","text":"Road B: Treemonster, and why it wubs"},{"type":"p","indent":false,"html":"Treemonster is a <strong>ring modulator<\/strong>. It multiplies your audio by a sine wave, and the sine's pitch is set by pitch detection on the incoming sound. Its controls, per Bitwig's user guide:"},{"type":"p","indent":true,"html":"<strong>Threshold:<\/strong> pitch is only detected above this level. Too low and it tracks noise and decaying tails, adding random wobble. Raise it for steadier tracking."},{"type":"p","indent":true,"html":"<strong>Low-pass / high-pass<\/strong> (in the display): limit the range the pitch detector listens to. Narrowing it changes what it locks onto."},{"type":"p","indent":true,"html":"<strong>Pitch:<\/strong> offsets the sine's tuning. Changes the interval, so the result sounds more or less hollow."},{"type":"p","indent":true,"html":"<strong>Speed:<\/strong> how fast the sine glides to follow the detected pitch. <strong>Slow = bloopy, sliding, liquid. Fast = tight and steppy.<\/strong> This is the main wub control."},{"type":"p","indent":true,"html":"<strong>Ring:<\/strong> 0 percent is a plain sine; higher is more harmonically complex. Sets how much of the source's own character survives."},{"type":"p","indent":true,"html":"<strong>Mix:<\/strong> dry/wet. Your first blend control."},{"type":"p","indent":false,"html":"On a short percussive sound, the detected pitch jumps around on every hit, and the sine slides after it. Those slides are what you hear as the wub. Ring modulation also produces <strong>inharmonic<\/strong> tones (sum and difference frequencies that are not whole-number multiples of the original), which is where the metallic, textured quality comes from. Saturation, by contrast, only adds harmonic, musically related tones, which is why Saturator alone gives a smoother wub and can't reproduce Treemonster's texture."},{"type":"h4","text":"The combined build (recommended)"},{"type":"pre","text":"Rubby Wubby (outer container)\n└─ Sampler or Polymer\n└─ FX Layer\n   ├─ Layer \"WUB\": Saturator > Filter+ (res up, Steps on cutoff) > Delay+ > Filter+ (slow LFO)\n   ├─ Layer \"TEXTURE\": Treemonster (Speed slow, Mix high)\n   └─ Layer \"CLICK\" (optional): EQ+ high-pass ~2 kHz, volume low"},{"type":"p","indent":false,"html":"The Sampler and the FX Layer sit <strong>in the same row, one after the other<\/strong>, so the FX Layer receives the sound. Inside the FX Layer, the three layers play side by side, each getting a copy."},{"type":"p","indent":false,"html":"The <strong>WUB<\/strong> layer gives you control. The <strong>TEXTURE<\/strong> layer volume is the \"how much Treemonster\" knob. The <strong>CLICK<\/strong> layer passes the raw source with only its top end, which restores the attack if the result gets murky."},{"type":"p","indent":false,"html":"<strong>Keep the nesting shallow.<\/strong> One FX Layer, with each layer a single straight chain. An FX Layer inside an FX Layer with one layer each does nothing except add another Mix and Wet Gain that can be set wrong."},{"type":"h4","text":"When it sounds \"underwater\""},{"type":"p","indent":false,"html":"Underwater means the top end is gone, the attacks are smeared, or both. Diagnose before fixing:"},{"type":"ol","start":1,"items":["Loop the sound. Mute any dry/click layer so you hear only the processed chain.","Bypass devices one at a time with their power buttons, starting from the end. When the sound snaps clear, you've found a culprit. Leave it off and keep checking, since there may be more than one.","Usual suspects, in order:"]},{"type":"p","indent":true,"html":"<strong>Vocoder-style spectral devices.<\/strong> To-Da-Choppa, with its Modulator/Carrier and 80 bands, resynthesizes the sound through narrow bands and produces a hollow, submerged, talking-through-a-pipe quality."},{"type":"p","indent":true,"html":"<strong>Ring modulators.<\/strong> Treemonster replaces your harmonics with sum and difference tones."},{"type":"p","indent":true,"html":"<strong>Low-passes stacked in series.<\/strong> Two Filter+ low-passes around 1 kHz plus an EQ+ rolling off the top remove most of the high end before anything else happens."},{"type":"p","indent":true,"html":"<strong>Delays and reverbs before the pitch-tracking device<\/strong>, which feed it a smeared signal."},{"type":"p","indent":false,"html":"Then the fixes, gentlest first:"},{"type":"p","indent":true,"html":"Move the culprit to a <strong>parallel layer<\/strong> with a blend volume, instead of removing it."},{"type":"p","indent":true,"html":"<strong>Lower its Mix<\/strong>."},{"type":"p","indent":true,"html":"For Treemonster: raise <strong>Threshold<\/strong>, adjust <strong>Speed<\/strong>, lower <strong>Ring<\/strong>."},{"type":"p","indent":true,"html":"Add the <strong>CLICK<\/strong> layer above."},{"type":"p","indent":true,"html":"<strong>Transient Control<\/strong> after the chain, attack up, to rebuild smeared fronts."},{"type":"p","indent":true,"html":"Last, at the end of the chain, <strong>EQ+<\/strong>: dip a few dB around <strong>200 to 500 Hz<\/strong> and a gentle high shelf from <strong>4 to 5 kHz<\/strong>. EQ last, so boosts don't get smeared by later effects."},{"type":"h4","text":"Or lean into it: making it liquid"},{"type":"p","indent":false,"html":"Muffled and liquid are close relatives. The difference is <strong>motion and highlights<\/strong>. Static darkness sounds like a blanket over a speaker; the same darkness with glide, a moving resonant peak, and a bit of glint on top sounds like water."},{"type":"ol","start":1,"items":["<strong>Resonance<\/strong> up on a Filter+ that already has an LFO on cutoff. The sliding peak is the single strongest liquid cue.","<strong>Treemonster Speed slow.<\/strong> Lean into the glide.","<strong>Doppler smear.<\/strong> A very short delay time with a small LFO on the time knob, or <strong>Flanger+<\/strong>. Pitch wobbles as the delay stretches and squashes.","<strong>Glint.<\/strong> Keep the CLICK layer, quieter, maybe with a slow LFO on its volume so highlights come and go.","<strong>Unrelated LFO rates.<\/strong> Two filter LFOs in Hz at unrelated speeds (for example 0.17 Hz and 0.43 Hz) make the resonant peaks slide past each other and never land in the same place twice."]},{"type":"h4","text":"Where it sits"},{"type":"p","indent":false,"html":"High-pass at 300 Hz like the other melodic elements, or higher (400 to 500 Hz) if it's dense. If it competes with the kick, add the kick-triggered Tool ducking from Part 7, Step 6. In the arrangement it works as a Perc B alternative, or as a mid-track texture entering around bar 97."},{"type":"h4","text":"Saving it"},{"type":"p","indent":false,"html":"See Part 10. Save from the outer container's vertical name strip, not from an inner device, and test by loading it on a fresh track and clicking into every container."}]},{"title":"12.3 Dub chord stab","blocks":[{"type":"p","indent":false,"html":"Built in Part 6 as CHORD. The additions worth knowing:"},{"type":"p","indent":true,"html":"<strong>The stab should be short; the delay is the sound.<\/strong> Keep the amp decay brief and let the ping-pong delay carry it."},{"type":"p","indent":true,"html":"<strong>Filter the repeats, not just the stab.<\/strong> Most of the dub character comes from echoes that get darker with each repeat. Delay+'s EQ section does this; its FB FX slot lets you put a Filter+ inside the feedback loop for repeats that darken progressively. Push that idea to full feedback and you get the looper in 12.13."},{"type":"p","indent":true,"html":"<strong>LFO 2<\/strong> (Part 5) on the delay's Mix makes the echo bed breathe."},{"type":"p","indent":true,"html":"<strong>Throws.<\/strong> Automate CHORD's send to FILTERED DELAY up for single stabs, so one hit echoes much longer than the rest. One throw every 32 bars is plenty."}]},{"title":"12.4 Drone or pad bed","blocks":[{"type":"p","indent":false,"html":"The thing underneath everything that you only notice when it's gone."},{"type":"ol","start":1,"items":["<strong>Polymer<\/strong> with a soft wavetable, or two detuned saws. Very slow attack and release.","<strong>LFO on wavetable Index<\/strong>, sync off, around <strong>0.03 Hz<\/strong>.","<strong>Filter+<\/strong> low-pass, low resonance, with a second unsynced LFO at an unrelated rate (around <strong>0.07 Hz<\/strong>).","<strong>Chorus+<\/strong> or <strong>Tool<\/strong> with Width up, for wideness.","Heavy send to REVERB LONG."]},{"type":"p","indent":false,"html":"One note or a fifth (root plus 7 semitones), held for 32 bars or more. High-pass at 300 Hz. Bring it in with its filter rather than its fader (see Part 13)."},{"type":"p","indent":false,"html":"<strong>Alternative sources:<\/strong> a field recording or long sample in Sampler, stretched far beyond its natural length, gives organic texture no synth will. Or the beating-sine pads in Part 15.3, which drone without any notes at all."}]},{"title":"12.5 Rolling toms and low percussion","blocks":[{"type":"p","indent":false,"html":"The tribal, circular feel in a lot of hypnotic techno."},{"type":"ol","start":1,"items":["<strong>Sampler<\/strong> with a tom, or a synthesized tom from Bitwig's drum synths in a Drum Machine.","Pitch two or three toms to notes in your key. Root, fifth (plus 7 semitones), and octave (plus 12) are safe.","Pattern in <strong>5 or 7 sixteenth-note loops<\/strong>, set the same way as Perc B, so it rolls against the 4-bar grid.","<strong>Steps<\/strong> modulator on pitch or on a band-pass Filter+ cutoff, small amount, so repeated hits vary.","Short room reverb. Low cut around <strong>80 to 100 Hz<\/strong> so it never fights the kick."]},{"type":"p","indent":false,"html":"These toms sit <em>above<\/em> the kick. To make toms the low end itself, pitched way down and rumbling, see the tom rumble in Part 14.6. For written tom patterns, see Part 16."}]},{"title":"12.6 Metallic percussion and bells","blocks":[{"type":"p","indent":false,"html":"Good for Perc B, which the template says should be metallic."},{"type":"p","indent":true,"html":"<strong>FM route: FM-4<\/strong> or <strong>Phase-4<\/strong> with a short percussive envelope. Inharmonic ratios (not 1:2 or 1:3) give bell and metal tones."},{"type":"p","indent":true,"html":"<strong>Ring-mod route:<\/strong> a short click or rim sample into <strong>Ring-Mod<\/strong> at a fixed frequency. Same family as Treemonster, but predictable because you set the frequency."},{"type":"p","indent":true,"html":"<strong>Freq Shifter<\/strong> by a small amount on any percussion sound makes it clangy and slightly detuned."},{"type":"p","indent":true,"html":"Finish with a resonant band-pass <strong>Filter+<\/strong> and a short decay. Heavier REVERB LONG send than Perc A, so it sits further back."},{"type":"p","indent":true,"html":"<strong>Resonator route:<\/strong> a click into a <strong>Resonator Bank<\/strong> tuned to inharmonic intervals gives a struck-metal tone. 12.14 builds a whole lead this way."}]},{"title":"12.7 Rides and open hats","blocks":[{"type":"p","indent":false,"html":"Rides add energy without adding density, which makes them one of the best arrangement tools you have."},{"type":"p","indent":true,"html":"<strong>Ride:<\/strong> a long ride sample on quarter-notes or off-beats. Low cut around <strong>300 to 500 Hz<\/strong>. A slow LFO on a high shelf or on Tool's Gain makes it shimmer."},{"type":"p","indent":true,"html":"<strong>Open hat:<\/strong> off-beat 8ths, decay just long enough to touch the next kick. A tiny bit of the kick-triggered ducking keeps it from smearing into the kick. (Part 16 shows the less common on-the-beat version, choked by the closed hat.)"},{"type":"p","indent":true,"html":"Bring the ride in for the peak (bar 161) and take it out for the breakdown. Its presence or absence is often enough to mark a section."}]},{"title":"12.8 Bleeps and sonar pings","blocks":[{"type":"p","indent":false,"html":"The dub techno blip that floats over the groove."},{"type":"ol","start":1,"items":["<strong>Polymer<\/strong> or a simple synth with a near-sine tone and a very short amp envelope.","One note, rarely. Once every two or four bars is plenty.","Send heavily to <strong>FILTERED DELAY<\/strong>, or put a Delay+ on the track with high feedback (watch the runaway warning in 12.1), narrow EQ, Ping mode.","Optional: a <strong>Random<\/strong> modulator on pitch with a small amount, quantized to your scale if the synth allows, so pings wander. Leave it unquantized for the between-the-keys feel in Part 15.2.","Variation: self-oscillating resonance. Turn a Filter+ resonance almost to maximum and send a short click through it. The filter rings at the cutoff frequency, giving a pitched, watery ping. (That's the one-band version of 12.14.)"]}]},{"title":"12.9 Noise and air","blocks":[{"type":"p","indent":false,"html":"Hypnotic techno rarely uses big risers, but filtered noise adds air and slow tension."},{"type":"p","indent":true,"html":"White or pink noise (Polymer's noise source, or a sample), band-pass <strong>Filter+<\/strong> with resonance moderate, slow unsynced LFO on cutoff."},{"type":"p","indent":true,"html":"Very quiet. It should be felt as air, not heard as a whoosh."},{"type":"p","indent":true,"html":"For tension before a change, automate the band-pass slowly upward over 16 to 32 bars instead of a short riser."},{"type":"p","indent":true,"html":"A permanent, very quiet noise floor across the whole track adds analog-style warmth (Part 15.3)."}]},{"title":"12.10 Voice and found-sound textures","blocks":[{"type":"p","indent":false,"html":"Short vocal syllables, breath, or field recordings, processed until they're more texture than words."},{"type":"p","indent":true,"html":"<strong>Sampler<\/strong>, a short slice, played rarely. Heavy delay and reverb sends."},{"type":"p","indent":true,"html":"This is where <strong>To-Da-Choppa<\/strong> and <strong>Treemonster<\/strong> shine, because their submerged, talking quality is exactly what you want in a background texture. The \"underwater\" sound that didn't work on Rubby Wubby may be perfect here."},{"type":"p","indent":true,"html":"High-pass at 300 Hz or higher and keep it well back in the mix."}]},{"title":"12.11 Resampling: turn a chain into a new source","blocks":[{"type":"p","indent":false,"html":"When a chain is heavy on CPU, or you love a moment and want to build on it, record its output as audio and treat that audio as a new raw sound."},{"type":"p","indent":true,"html":"Bounce the clip to audio (right-click the clip; look for <strong>Bounce<\/strong> or <strong>Bounce in Place<\/strong>), or record the track's output onto a new audio track."},{"type":"p","indent":true,"html":"Chop the result, reverse slices, pitch them, load them into Sampler."},{"type":"p","indent":true,"html":"Processing a resampled sound a second time is how a lot of the strangest textures in the genre are made."},{"type":"p","indent":false,"html":"Part 14.7 walks through resampling a rumble kick into a one-shot, step by step; the same procedure works for any sound."}]},{"title":"12.12 Where everything sits","blocks":[{"type":"p","indent":false,"html":"A quick map so new sounds don't fight the core."},{"type":"table","rows":[["<strong>Range<\/strong>","<strong>Who lives there<\/strong>","<strong>Rule<\/strong>"],["Below 100 Hz","Kick, plus <strong>one<\/strong> sub owner: rumble, bass, tom rumble, or noise sub","Mono. One owner only (Part 14)."],["100 to 300 Hz","Rumble's upper edge, kick body, toms","Toms cut low; everything else high-passed at 300 Hz"],["300 Hz to 2 kHz","Chords, wub, drones, leads (including the one-hit lead), Perc A, rumble mid layer, glitch loop","The crowded zone. Use ducking and space, not volume."],["2 to 8 kHz","Perc attacks, bleeps, wub click layer, resonator ring","Presence. Where clarity lives."],["Above 8 kHz","Hats, rides, noise, air","Keep the melodic elements gently shelved down here so hats stay clear."]],"header":true}]},{"title":"12.13 Feedback looper (glitchy loop textures)","blocks":[{"type":"p","indent":false,"html":"Adapted from an Ableton tip: anything can go inside a looper's feedback loop, including another looper. A dry piano plays, a hidden loop copies it, and a second loop with pitch shifting, bitcrushing and random speed changes turns that copy into a glitchy ambient bed."},{"type":"p","indent":false,"html":"<strong>How Bitwig does it.<\/strong> Bitwig has no Looper device. A delay set to the loop length with feedback all the way up does the same job, because it repeats whatever it holds forever. <strong>Delay+<\/strong> and <strong>Delay-1<\/strong> both have an <strong>FB FX<\/strong> slot, and any device placed there sits inside the loop, so it processes every repeat again. That is the Ableton trick."},{"type":"h4","text":"Build it"},{"type":"pre","text":"PIANO (or CHORD, or any source track): dry, nothing added\n   └─ send ─> LOOP A (effect track)\n                Delay+  time 1 to 4 bars, Mix 100%, Feedback max\n                fader all the way down (you never hear it directly)\n                   └─ send, pre-fader ─> GLITCH LOOP (effect track)\n                                           Delay+  long time, Mix 100%, Feedback high\n                                             FB FX: pitch shift > Bit-8\n                                             Random modulator on Time\n                                           EQ+ high-pass 300 Hz\n                                           Peak Limiter (safety)"},{"type":"ol","start":1,"items":["<strong>Source.<\/strong> Any track with a melodic phrase: a piano in Sampler, CHORD, or the Part 7 lead. Keep it dry. This is what you hear in the front.","<strong>LOOP A, the hidden loop.<\/strong> Add an effect track named LOOP A. <strong>Delay+<\/strong>, Mix <strong>100%<\/strong>, time <strong>1 bar<\/strong> to start (try 2 or 4 bars), Feedback all the way up. Turn up the source's send to LOOP A. Then pull LOOP A's <strong>fader all the way down<\/strong>. You don't hear this loop. It only feeds the next one, which is the video's \"you're only hearing the dry sound.\"","<strong>Send LOOP A on.<\/strong> Add a second effect track named GLITCH LOOP. Effect tracks can send to other effect tracks, so turn up LOOP A's send to GLITCH LOOP and set that send to <strong>pre-fader<\/strong> (right-click the send knob, choose <strong>Pre<\/strong>; the ring turns blue). Pre-fader is what lets the loop feed GLITCH LOOP while its own fader is down.","<strong>GLITCH LOOP, the processed loop. Delay+<\/strong>, Mix <strong>100%<\/strong>, a long time (1 or 2 bars, or an odd length like 5/16 for drift), Feedback high but just under maximum.","<strong>Fill the feedback loop.<\/strong> Open Delay+'s <strong>FB FX<\/strong> slot and add, in order:"]},{"type":"p","indent":true,"html":"A <strong>pitch shifter<\/strong>, set an octave or a fifth up (or down). Each pass round the loop shifts again, so the repeats climb or fall. Use <strong>Freq Shifter<\/strong> at a small amount instead for a clangy, detuned version."},{"type":"p","indent":true,"html":"<strong>Bit-8<\/strong> for the bitcrush. Small amounts: it compounds on every repeat."},{"type":"ol","start":6,"items":["<strong>Random speed changes.<\/strong> Open GLITCH LOOP's Delay+ Modulators pane and add a <strong>Random<\/strong> modulator, sync on, around <strong>1 bar<\/strong>. Route it to the delay <strong>Time<\/strong> with a moderate drag. Changing the time of a running delay speeds up or slows down the audio already in it, like tape, which is what the Ableton looper's speed changes are doing. Turn Random's sync off and lower the rate for smooth glides instead of jumps.","<strong>Tidy and protect.<\/strong> After Delay+: <strong>EQ+<\/strong> high-pass at <strong>300 Hz<\/strong> so it never touches the rumble, then a <strong>Peak Limiter<\/strong> as a safety net (see the warning below). Send GLITCH LOOP to REVERB LONG if you want it further back."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> the dry phrase in front, and behind it a smeared, crunchy, shifting copy that keeps evolving after you stop playing the source."},{"type":"h4","text":"Controlling it"},{"type":"p","indent":true,"html":"<strong>Clearing a loop.<\/strong> There's no clear button. Drop the Feedback to zero for a bar and it empties. Automate that in the Arrangement for a deliberate reset."},{"type":"p","indent":true,"html":"<strong>Freezing it.<\/strong> Turn the source's send to LOOP A down. The loops keep cycling what they already hold, and GLITCH LOOP keeps degrading it."},{"type":"p","indent":true,"html":"<strong>How fast it degrades.<\/strong> Set by GLITCH LOOP's Feedback and how much Bit-8 and pitch shift sit inside the loop. Lower feedback means the texture refreshes from LOOP A more often; higher means it drifts further from the source."},{"type":"p","indent":true,"html":"<strong>More recursion.<\/strong> Delay-1 inside Delay+'s FB FX (or another delay) extends or splits the loop length. FX tracks can also send back to themselves, which is a second, messier route to the same place."},{"type":"h4","text":"Feedback warning"},{"type":"p","indent":false,"html":"This build runs feedback near 100 percent with devices inside the loop that can add level. It can run away and get very loud. Turn your monitoring down before you start. Keep Feedback just under maximum and lower Bit-8 if the level climbs. The Peak Limiter at the end only protects your ears; it doesn't stop the loop growing. If the sound won't stop, see \"Sound keeps playing after I stop\" in Troubleshooting."},{"type":"h4","text":"Where it sits"},{"type":"p","indent":false,"html":"A texture layer, not a lead. Build it on SPARE's sends or alongside ATMOS, and bring it in with a filter around bar 97 (Part 8), like any other new element. If it competes with the drums, add the kick-triggered Tool ducking from Part 7, Step 6."},{"type":"p","indent":false,"html":"<strong>Want a true looper with record and overdub buttons?<\/strong> Build one in <strong>The Grid<\/strong> around its Recorder module, or use a third-party looper plugin. The delay version above is simpler and covers this sound."}]},{"title":"12.14 One-hit lead (physical modeling from a percussion sample)","blocks":[{"type":"p","indent":false,"html":"Adapted from a Pick Yourself video built in Ableton. The challenge: make a full lead line from <strong>one percussion hit, no synths<\/strong>. A click is sequenced, given pitch with phase modulation, then used to strike tuned resonators. The notes you hear come mostly from the resonators, not from an oscillator, which is why it doesn't sound like a preset."},{"type":"p","indent":false,"html":"<strong>Why it works.<\/strong> Physical modeling is an <strong>exciter<\/strong> hitting a <strong>resonator<\/strong> (see Glossary). Here the exciter is your sequenced click; the resonator is a bank of tuned filters, plus a short delay or comb acting as a \"body.\" The resonators react to everything upstream, so changing the sample, the phase mod amount, or the note pattern changes the whole voice. It's the same family as Treemonster (12.2), but you choose the pitches, so it's steerable."},{"type":"p","indent":false,"html":"Bitwig covers every step except one. Ableton's <strong>Corpus<\/strong> (modeled membranes, plates, pipes) has no native equivalent; Step 4 gives three substitutes."},{"type":"h4","text":"The chain"},{"type":"pre","text":"ONE HIT (instrument track, or SPARE)\n  Arpeggiator or clip  >  Sampler (click, phase mod, slow LFO)\n    >  Resonator Bank (bands on root, +7, +12, +19; Mix ~50%)\n    >  Body: Comb, or Delay+ at a few ms, Mix ~50%\n    >  Delay+ 1/8 with a pitch shifter in FB FX\n    >  EQ+ (high-pass, resonance notches)  >  Tool (Audio Sidechain duck)\n  └─ send > TEXTURE (effect track): Delay+ (pitch +12 in FB FX) > Phaser+ > Reverb > EQ+"},{"type":"h4","text":"Step 1: The source and the notes"},{"type":"ol","start":1,"items":["On SPARE (or a new instrument track named ONE HIT), drop a short click, rim, or perc sample. It loads into <strong>Sampler<\/strong>. One-shot mode.","<strong>Get notes without drawing them.<\/strong> The video avoids pencilling notes in, because it breaks flow. Ableton's MIDI generators and audio-to-MIDI have no direct Bitwig match, so use one of these:"]},{"type":"p","indent":true,"html":"<strong>Arpeggiator<\/strong> in front of Sampler (as in Part 7, 1c), holding two or three notes of your chord. Let it run against the beat and keep what works."},{"type":"p","indent":true,"html":"A clip with an <strong>odd loop length<\/strong> (5 or 7 sixteenths, as Perc B) plus a few notes at <strong>Chance<\/strong> 40 to 60 percent (13.5)."},{"type":"ol","start":3,"items":["Keep the notes in key. The resonators will be tuned to your key in Step 3."]},{"type":"h4","text":"Step 2: Make the click tonal (phase modulation)"},{"type":"ol","start":1,"items":["<strong>Bitwig 6.1 and later:<\/strong> the Sampler overhaul added playback characters, one of which applies <strong>phase modulation<\/strong>. Select it and raise its amount slowly. The click gains a pitched, metallic tone.","<strong>Older route, or for more control:<\/strong> modulate the Sampler's playback <strong>Speed<\/strong>, which works like phase or frequency modulation on the sample.","<strong>Animate it.<\/strong> Open the Sampler's Modulators pane, add an <strong>LFO<\/strong>: sync <strong>off<\/strong>, slow (around <strong>0.1 to 0.3 Hz<\/strong>), a smooth-random shape if offered, <strong>unipolar<\/strong>. Route it <strong>down<\/strong> on the phase mod amount so it swings from full to a little less. Same move as Drill 1."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> the click now has a drifting, slightly pitched edge. Still percussive. The tonality comes next."},{"type":"h4","text":"Step 3: Resonator Bank (the main pitch source)"},{"type":"ol","start":1,"items":["Drag <strong>Resonator Bank<\/strong> to the right of Sampler.","<strong>Tune the bands<\/strong> to your key. A starting set, relative to your root:"]},{"type":"p","indent":true,"html":"Root"},{"type":"p","indent":true,"html":"+7 (fifth)"},{"type":"p","indent":true,"html":"+12 (octave)"},{"type":"p","indent":true,"html":"+19 (octave plus fifth), or +21 for something stranger"},{"type":"ol","start":3,"items":["Turn the <strong>upper bands' gain down<\/strong> so the low ones lead. Use the bank's global frequency, Q, and gain shifts to move all bands together.","<strong>Width down.<\/strong> The video narrows it; a lead that starts wide has nowhere to go.","<strong>Mix around 50 percent.<\/strong> Some dry click keeps the rhythm and the phase-mod grit.","<strong>Q (or decay) sets the ring.<\/strong> Low Q is short and plucky. High Q rings long and melodic.","<strong>Key track:<\/strong> the bank has a key-track control. Try it on, so the bands follow the notes you play; if that sounds wrong, leave it off and let the notes change only the click."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> the click now strikes a chord-like ring in your key. Raise Mix for more melody; lower it for more abstract."},{"type":"h4","text":"Step 4: The body (Corpus substitute)"},{"type":"p","indent":false,"html":"Corpus adds a second, physical-sounding resonance: a membrane, plate, pipe, or string. Closest substitutes first:"},{"type":"p","indent":true,"html":"<strong>Comb<\/strong> (a comb filter device, or Filter+ in a comb mode). Tune it to your root and push its feedback. Sounds like a pipe or plucked string."},{"type":"p","indent":true,"html":"<strong>Delay+ at a very short time<\/strong> (a few milliseconds, sync off) with high feedback. This is Karplus-Strong, the classic plucked-string model. The delay time sets the pitch: time in ms = 1000 ÷ frequency. For A2 (110 Hz) that's about <strong>9.1 ms<\/strong>."},{"type":"p","indent":true,"html":"<strong>FX Grid<\/strong> with two or three resonant band-pass filters or short delays in parallel, tuned to <strong>inharmonic<\/strong> ratios. Closest to a membrane or plate."},{"type":"p","indent":true,"html":"Or a third-party physical-modeling plugin as a VST, if you want the real thing."},{"type":"p","indent":false,"html":"Set its Mix around <strong>50 percent<\/strong>. Then, as the video does:"},{"type":"p","indent":true,"html":"An LFO or hand automation on the body's <strong>decay or feedback<\/strong>: lower is snappier, higher is longer."},{"type":"p","indent":true,"html":"Keep <strong>upper harmonics low<\/strong> (lower the comb's feedback, or low-pass the body). For techno, every harmonic ringing at once sounds like a bell tree."},{"type":"h4","text":"Step 5: Pitch-shifted echo"},{"type":"p","indent":false,"html":"The video uses Ableton's Shifter with its built-in delay. In Bitwig: <strong>Delay+<\/strong>, time <strong>1/8<\/strong>, Feedback low to moderate, with a <strong>pitch shifter<\/strong> in its <strong>FB FX<\/strong> slot shifted <strong>down<\/strong> a little. Each echo drops in pitch. Same FB FX trick as 12.13. Use <strong>Freq Shifter<\/strong> at a small amount if there's no native pitch shifter."},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> a rhythmic lead with tails that fall away behind each note."},{"type":"h4","text":"Step 6: The texture return"},{"type":"ol","start":1,"items":["Add an effect track named <strong>TEXTURE<\/strong>, and send ONE HIT to it.","<strong>Grain Delay<\/strong> (the video's first device) has no native Bitwig equivalent. Two substitutes:"]},{"type":"p","indent":true,"html":"<strong>Delay+<\/strong>, Mix 100%, a pitch shifter set <strong>+12<\/strong> in FB FX, and a small <strong>Random<\/strong> modulator on Time. Gives the octave-up spray."},{"type":"p","indent":true,"html":"A free granular delay plugin, or resample the lead (12.11) and play it in <strong>Sampler<\/strong> in a granular mode."},{"type":"ol","start":3,"items":["<strong>Phaser+<\/strong>, slow (Part 7, Step 2A).","<strong>Reverb<\/strong>, long and dark. For the video's shimm
