<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hypnotic Techno Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Archivo:wdth,wght@62..125,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: device-panel sidebar (parts as tracks) + one part at a time, subsections fold like device chains */
:root {
  --bg: #eef0f3;
  --panel: #f8f9fb;
  --panel-2: #e3e6eb;
  --line: #cfd4dc;
  --fg: #1b2029;
  --muted: #5b6474;
  --accent: #c2550f;
  --accent-soft: #f6e2d3;
  --mod: #2f6fb3;
  --mod-soft: #dce8f5;
  --check: #2c7a4b;
  --check-soft: #dcefe3;
  --mark: #ffe08a;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side-w: 300px;
  --top-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --panel: #1c2027; --panel-2: #252a33; --line: #343b47;
    --fg: #e6e9ee; --muted: #9aa3b2; --accent: #f08a3c; --accent-soft: #3a281b;
    --mod: #6fa8e8; --mod-soft: #1d2b3c; --check: #5fc28a; --check-soft: #1a3226; --mark: #7a5f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --panel: #1c2027; --panel-2: #252a33; --line: #343b47;
  --fg: #e6e9ee; --muted: #9aa3b2; --accent: #f08a3c; --accent-soft: #3a281b;
  --mod: #6fa8e8; --mod-soft: #1d2b3c; --check: #5fc28a; --check-soft: #1a3226; --mark: #7a5f12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  min-height: var(--top-h);
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand b { font-family: var(--font-display); font-stretch: 75%; font-weight: 800; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 13px; white-space: nowrap; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; min-width: 38px; padding: 0 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-size: 14px;
}
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 18px; height: 18px; }
#menuBtn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; margin-left: auto; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 15px;
}
.search svg { position: absolute; left: 10px; top: 10px; width: 18px; height: 18px; color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 8px; }
kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--panel); }
.results {
  position: absolute; top: 44px; left: 0; right: 0; max-height: min(70vh, 560px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.25);
}
.results button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; }
.results button:hover, .results button.sel { background: var(--accent-soft); }
.results .where { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.results .snip { font-size: 14px; color: var(--muted); display: block; }
.results .none { padding: 14px; color: var(--muted); font-size: 14px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

/* Step strip: one cell per Part 0-16 */
.steps { display: flex; gap: 3px; padding-block: 0 8px; }
.steps button {
  flex: 1; height: 14px; padding: 0; border-radius: 2px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; position: relative;
}
.steps button.done { background: var(--check); border-color: var(--check); }
.steps button.here { outline: 2px solid var(--accent); outline-offset: 1px; }
.steps button:nth-child(4n+1):not(.done) { background: var(--line); }

/* Shell */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: calc(100% - var(--top-h)); }
.side {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--panel);
  padding-block: 14px 40px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
}
.side h2 { font-family: var(--font-display); font-stretch: 80%; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 18px 6px 6px; }
.side h2:first-of-type { margin-top: 4px; }
.nav-part { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 5px; background: none; text-align: left; cursor: pointer; font-size: 15px; line-height: 1.3; }
.nav-part:hover { background: var(--panel-2); }
.nav-part.active { background: var(--accent-soft); }
.nav-part .num { flex: none; width: 26px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }
.nav-part .led { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.nav-part .led.done { background: var(--check); }
.nav-part .lbl { flex: 1; min-width: 0; }
.nav-subs { margin: 2px 0 6px 42px; padding: 0; list-style: none; border-left: 1px solid var(--line); }
.nav-subs button { display: block; width: 100%; text-align: left; padding: 3px 10px; border: 0; background: none; cursor: pointer; font-size: 13.5px; line-height: 1.35; color: var(--muted); }
.nav-subs button:hover { color: var(--fg); }
.nav-subs button.active { color: var(--accent); font-weight: 700; }

/* Main */
main {
  min-width: 0;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 820px; margin: 0 auto; }
.eyebrow { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: .04em; }
h1 { font-family: var(--font-display); font-stretch: 78%; font-weight: 800; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 4px 0 12px; text-wrap: balance; letter-spacing: -.005em; }
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 18px; }
.chip { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); text-decoration: none; cursor: pointer; }
.chip.stagechip { color: var(--mod); border-color: var(--mod); background: var(--mod-soft); }
.chip.done { color: var(--check); border-color: var(--check); background: var(--check-soft); }
.chip:hover { border-color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 16px; }
.toolbar .spacer { flex: 1; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.jump button { font-size: 13.5px; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; line-height: 1.3; text-align: left; }
.jump button:hover { border-color: var(--accent); color: var(--accent); }

.prose { max-width: 70ch; }
.prose p { margin: 0 0 14px; }
.prose ol { margin: 0 0 16px; padding-left: 28px; }
.prose ol li { margin-bottom: 8px; padding-left: 4px; }
.prose ol li::marker { font-family: var(--font-mono); font-weight: 600; color: var(--accent); font-size: 14px; }
.prose ul.sub { margin: -4px 0 16px; padding-left: 22px; }
.prose ul.sub li { margin-bottom: 6px; }
.prose ul.sub li::marker { color: var(--muted); }
.prose h4 { font-family: var(--font-display); font-stretch: 90%; font-size: 18px; margin: 22px 0 8px; }
.prose code { font-family: var(--font-mono); font-size: .86em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.prose pre { font-family: var(--font-mono); font-size: 13px; line-height: 1.5; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow-x: auto; margin: 0 0 16px; }
.prose a.xref { color: var(--mod); text-decoration: none; border-bottom: 1px dotted var(--mod); font-weight: 700; }
.prose a.xref:hover { background: var(--mod-soft); }
.tablewrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-display); font-stretch: 85%; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--panel); }
tr:last-child td { border-bottom: 0; }
.checkpoint { background: var(--check-soft); border-left: 3px solid var(--check); padding: 8px 12px; border-radius: 0 6px 6px 0; }
li.checkpoint { list-style-position: inside; margin-left: -28px; padding-left: 12px; }
.ck-tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--check); margin-right: 6px; }

/* Subsections as foldable devices */
details.sub { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin: 0 0 10px; scroll-margin-top: calc(var(--top-h) + 16px + env(safe-area-inset-top, 0px)); }
details.sub > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-family: var(--font-display); font-stretch: 88%; font-weight: 700; font-size: 18px; line-height: 1.25; }
details.sub > summary::-webkit-details-marker { display: none; }
details.sub > summary .caret { flex: none; width: 20px; height: 20px; color: var(--muted); transition: transform .15s; }
details.sub[open] > summary .caret { transform: rotate(90deg); color: var(--accent); }
details.sub > summary .t { flex: 1; min-width: 0; }
details.sub > summary .count { flex: none; font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--muted); }
details.sub > .body { max-width: none; padding: 2px 16px 8px 44px; border-top: 1px solid var(--line); padding-top: 14px; background: var(--bg); border-radius: 0 0 8px 8px; }
@media (prefers-reduced-motion: reduce) { details.sub > summary .caret { transition: none; } }

.filter { width: 100%; max-width: 420px; height: 38px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; font-size: 15px; }
.filter-count { font-size: 13px; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 36px; }
.pager button { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; text-align: left; min-width: 0; }
.pager button:hover { border-color: var(--accent); }
.pager button.next { text-align: right; grid-column: 2; }
.pager small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.pager span { font-weight: 700; overflow-wrap: anywhere; }

/* Home */
.lede { font-size: 18px; color: var(--muted); max-width: 64ch; margin: 0 0 20px; }
.status { display: grid; gap: 6px; padding: 14px 16px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); margin-bottom: 26px; max-width: 70ch; }
.status p { margin: 0; }
.home-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 30px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--accent); }
h2.section { font-family: var(--font-display); font-stretch: 78%; font-size: 26px; font-weight: 800; margin: 8px 0 4px; }
.section-note { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
.path { display: grid; gap: 10px; margin-bottom: 34px; }
.stage { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.stage .n { font-family: var(--font-display); font-stretch: 70%; font-weight: 800; font-size: 40px; line-height: .9; color: var(--accent); }
.stage h3 { margin: 0 0 4px; font-family: var(--font-display); font-stretch: 88%; font-size: 19px; }
.stage .do { font-size: 15.5px; }
.stage .time { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.stage .meter { display: flex; gap: 3px; margin-top: 8px; }
.stage .meter i { width: 18px; height: 6px; border-radius: 2px; background: var(--line); }
.stage .meter i.on { background: var(--check); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 30px; }
.card { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; text-align: left; }
.card:hover { border-color: var(--accent); }
.card .num { font-family: var(--font-mono); font-size: 12px; color: var(--accent); display: flex; justify-content: space-between; }
.card .num .led { width: 8px; height: 8px; border-radius: 50%; background: var(--line); align-self: center; }
.card .num .led.done { background: var(--check); }
.card b { font-size: 16px; line-height: 1.3; }
.card small { color: var(--muted); font-size: 13px; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }

/* Glossary drawer */
.drawer { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.2); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer header b { font-family: var(--font-display); font-stretch: 80%; font-size: 20px; flex: 1; }
.drawer .dbody { overflow-y: auto; padding: 12px 16px 30px; }
.drawer .gl-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.drawer .gl-cat { font-family: var(--font-display); font-stretch: 85%; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.35); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  #menuBtn { display: inline-flex; }
  .side { position: fixed; z-index: 38; top: 0; left: 0; bottom: 0; height: auto; width: min(320px, 88%); transform: translateX(-105%); transition: transform .2s; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; box-shadow: 12px 0 32px rgba(0,0,0,.25); }
  .brand small, .search kbd, .hide-sm { display: none; }
  details.sub > .body { padding-left: 16px; }
}
@media (max-width: 560px) {
  body { font-size: 16px; }
  .stage { grid-template-columns: 40px minmax(0, 1fr); }
  .stage .time { grid-column: 2; text-align: left; }
  .stage .n { font-size: 32px; }
  .brand { display: none; }
  .pager { grid-template-columns: 1fr; }
  .pager button.next { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="Open contents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand" href="#home" id="brand"><b>Hypnotic Techno</b><small>Bitwig build guide</small></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search the guide (e.g. sidechain, Treemonster, 14.4)" autocomplete="off" aria-label="Search the guide">
    <kbd>/</kbd>
    <div class="results" id="results" hidden></div>
  </div>
  <button class="iconbtn" id="glossBtn" title="Glossary lookup (g)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg><span class="hide-sm">Glossary</span></button>
  <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark theme" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="Contents"></nav>
  <main id="main"><div class="page" id="page"></div></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Glossary">
  <header><b>Glossary</b><button class="iconbtn" id="drawerClose" aria-label="Close glossary">Close</button></header>
  <div style="padding: 12px 16px 0"><input class="filter" id="glq" type="search" placeholder="Look up a term" autocomplete="off" aria-label="Look up a term"></div>
  <div class="dbody" id="glList"></div>

<script type="application/json" id="guide-data">{"title":"Hypnotic Techno Template: Bitwig Build Guide","intro":[{"type":"p","indent":false,"html":"Everything from our build, in order, with the corrections folded in, plus rumble methods, sound design theory, and a physical-modeling lead translated from five video tutorials and a set of TR-8S pattern reels (sources at the end). Written for someone new to Bitwig and to sound design."},{"type":"p","indent":false,"html":"<strong>Where things stand:<\/strong> Kick and rumble done. Percussion in progress; Part 16 now has three ready-made step patterns to fill it. <strong>Next:<\/strong> finish Part 3 (using Part 16), then build the returns, groups, and remaining channels in Part 6."}],"parts":[{"title":"How to use this guide","blocks":[{"type":"p","indent":false,"html":"The parts are numbered by where they sit in the template, not by the order you should learn them. Follow this path instead. Each stage is a natural stopping point."},{"type":"table","rows":[["<strong>Stage<\/strong>","<strong>Do these<\/strong>","<strong>Roughly<\/strong>"],["1. Learn the moves","Part 0, skim the Glossary, then the <strong>Part 4 drills<\/strong>","30 to 45 minutes"],["2. Build the core loop","Part 1, Part 2, Part 3, with Part 16's patterns beside Part 3","One or two sessions"],["3. Fill out the template","Part 6 (returns, groups, SPARE, chord, atmos), then Part 5 (modulators), then Part 10 (save it)","One or two sessions"],["4. Make a track","Part 13 with Part 8 beside it. For sounds: Part 12 (palette), Part 14 (rumble and low end), Part 15 (sound design ideas), Part 7 (lead voice, optional), 12.13 (feedback looper textures), 12.14 (one-hit physical-modeling lead). For arrangement moves: Part 16.9.","As long as it takes"],["5. Release","Part 9, then Part 11","One session"]],"header":true},{"type":"p","indent":false,"html":"<strong>Use any time:<\/strong> the Glossary, Troubleshooting, the list of uncertain labels, and Sources at the end."},{"type":"p","indent":false,"html":"<strong>Checkpoints.<\/strong> Every \"You should hear\" line is a checkpoint. If you don't hear it, stop there and check Troubleshooting before going further. Problems compound when you build on top of them."}],"subs":[]},{"title":"Part 0: Bitwig orientation","blocks":[{"type":"p","indent":false,"html":"Seven things that make everything else make sense."},{"type":"ol","start":1,"items":["<strong>The screen.<\/strong> The <strong>Browser<\/strong> (sounds, devices, presets, your files) is the panel on the right. The <strong>Inspector<\/strong> (settings for whatever you've selected) is on the left. The <strong>Device Panel<\/strong> (the effects chain of the selected track) runs along the bottom. The <strong>Mixer<\/strong> is a separate view you can switch to.","<strong>Two ways of working.<\/strong> The <strong>Clip Launcher<\/strong> is a grid of loops you trigger by hand, good for building and jamming. The <strong>Arrangement<\/strong> is a timeline, left to right, where the finished track lives.","<strong>Devices run left to right.<\/strong> Signal enters at the left of the Device Panel and flows rightward through each device in turn.","<strong>Modulators live inside devices.<\/strong> You add an LFO to a specific device, then connect it to a knob. There is no separate LFO device.","<strong>Modulation routing is drag-based.<\/strong> Click the modulator's <strong>routing button<\/strong> (a small dot with an arrow) so it flashes, then drag on the target knob. Drag distance sets the amount. Up is positive, down is negative.","<strong>Effect Tracks are returns.<\/strong> They live in their own section at the bottom of the track list, below a divider. Other tracks send audio to them.","<strong>Containers and layers.<\/strong> Some devices (FX Layer, Instrument Layer, Drum Machine, Chain) hold other devices inside them. Inside a <em>layer<\/em> container, the layers play <strong>side by side, not one after another<\/strong>. An effect placed in a different layer from the instrument receives no sound. This one cost us an afternoon."]}],"subs":[]},{"title":"Glossary","blocks":[{"type":"p","indent":false,"html":"Plain-language definitions. Skim once, come back when a word stops you."},{"type":"h4","text":"Signal and level"},{"type":"p","indent":true,"html":"<strong>dB (decibel):<\/strong> the unit for volume changes. +6 dB is noticeably louder, -6 dB noticeably quieter. 0 dB on a knob means \"no change.\""},{"type":"p","indent":true,"html":"<strong>dBFS:<\/strong> level on a digital meter. 0 dBFS is the maximum before distortion; everything is a negative number below it."},{"type":"p","indent":true,"html":"<strong>LUFS:<\/strong> how loud something <em>sounds<\/em> over time, as opposed to its loudest single moment. Used in Part 11."},{"type":"p","indent":true,"html":"<strong>Peak:<\/strong> the single loudest instant of a sound."},{"type":"p","indent":true,"html":"<strong>Headroom:<\/strong> the gap between your loudest peak and 0 dBFS. Room to avoid distortion."},{"type":"p","indent":true,"html":"<strong>Fader:<\/strong> a volume slider on a track."},{"type":"p","indent":true,"html":"<strong>Gain:<\/strong> a volume knob, usually on a device rather than a track."},{"type":"p","indent":true,"html":"<strong>Bypass:<\/strong> switch a device off without deleting it (its power button). Used to compare with and without."},{"type":"p","indent":true,"html":"<strong>Solo / Mute:<\/strong> S plays only that track; M silences it."},{"type":"p","indent":true,"html":"<strong>Soft clip / glue:<\/strong> gently flattening the loudest peaks of several sounds together, so they feel like one sound."},{"type":"h4","text":"Frequency and tone"},{"type":"p","indent":true,"html":"<strong>Hz / kHz:<\/strong> pitch or frequency. Low numbers are bass, high numbers are treble. 1 kHz = 1000 Hz. Human hearing runs roughly 20 Hz to 20 kHz."},{"type":"p","indent":true,"html":"<strong>Fundamental:<\/strong> the lowest, main frequency of a sound; what you hear as its pitch."},{"type":"p","indent":true,"html":"<strong>Harmonics:<\/strong> quieter frequencies above the fundamental, at whole-number multiples of it. They give a sound its character and brightness. The <strong>second harmonic<\/strong> is exactly double the fundamental, one octave up."},{"type":"p","indent":true,"html":"<strong>Inharmonic:<\/strong> frequencies that are <em>not<\/em> whole-number multiples of the fundamental. Sound metallic or clangy."},{"type":"p","indent":true,"html":"<strong>Transient:<\/strong> the sharp, very first moment of a sound, like the click of a kick or the tap of a woodblock."},{"type":"p","indent":true,"html":"<strong>Filter:<\/strong> removes part of the frequency range."},{"type":"p","indent":true,"html":"<strong>Low-pass (high cut):<\/strong> removes highs, keeps lows. Muffled."},{"type":"p","indent":true,"html":"<strong>High-pass (low cut):<\/strong> removes lows, keeps highs. Thin."},{"type":"p","indent":true,"html":"<strong>Band-pass:<\/strong> keeps only a band in the middle, removing both lows and highs. Telephone-like."},{"type":"p","indent":true,"html":"<strong>Cutoff:<\/strong> where a filter starts removing. The main filter knob."},{"type":"p","indent":true,"html":"<strong>Resonance:<\/strong> a boost right at the cutoff. Makes a moving filter sound vocal, whistly, or \"wubby.\""},{"type":"p","indent":true,"html":"<strong>Shelf:<\/strong> an EQ move that raises or lowers everything above (high shelf) or below (low shelf) a frequency."},{"type":"p","indent":true,"html":"<strong>EQ:<\/strong> a tool for raising or lowering specific frequency ranges."},{"type":"p","indent":true,"html":"<strong>Saturation / distortion / drive:<\/strong> bending the waveform, which adds harmonics. Gentle is warm; heavy is gritty."},{"type":"h4","text":"Synthesis"},{"type":"p","indent":true,"html":"<strong>Sine:<\/strong> the simplest waveform, a single frequency with no harmonics. Pure and round."},{"type":"p","indent":true,"html":"<strong>Noise:<\/strong> random sound with no pitch, like hiss. White noise has equal energy at every frequency."},{"type":"p","indent":true,"html":"<strong>Envelope (ADSR):<\/strong> a shape that plays once per note: Attack (rise), Decay (fall), Sustain (held level), Release (fade after the note ends). Also usable as a modulator."},{"type":"p","indent":true,"html":"<strong>Glide:<\/strong> pitch slides smoothly from one note to the next instead of jumping."},{"type":"p","indent":true,"html":"<strong>Pitch expression:<\/strong> a per-note curve that bends that note's pitch while it plays."},{"type":"p","indent":true,"html":"<strong>FM (frequency modulation):<\/strong> one oscillator wobbling another's pitch very fast, which creates new tones."},{"type":"p","indent":true,"html":"<strong>AM (amplitude modulation):<\/strong> one oscillator wobbling another's volume very fast."},{"type":"p","indent":true,"html":"<strong>Wavefolding:<\/strong> folding the top of a waveform back on itself, which adds bright overtones."},{"type":"p","indent":true,"html":"<strong>Beating:<\/strong> two tones very close in pitch drift in and out of step, making a slow wobble."},{"type":"p","indent":true,"html":"<strong>Physical modeling:<\/strong> simulating a real object that rings. An <strong>exciter<\/strong> (a click, a pluck, noise) hits a <strong>resonator<\/strong> (tuned filters or very short delays), and the resonator rings at its own pitches. Used in 12.14."},{"type":"h4","text":"Space and stereo"},{"type":"p","indent":true,"html":"<strong>Mono:<\/strong> identical in both speakers. <strong>Stereo:<\/strong> different in each speaker. <strong>Width:<\/strong> how spread out a sound is between the speakers."},{"type":"p","indent":true,"html":"<strong>Mid / side:<\/strong> the mid is what both speakers share; the side is what differs between them. Processing them separately lets you make just the low end mono."},{"type":"p","indent":true,"html":"<strong>Reverb:<\/strong> simulated room or space. <strong>Decay<\/strong> is how long it rings. <strong>Convolution<\/strong> reverb uses a recording of a real room (an impulse response)."},{"type":"p","indent":true,"html":"<strong>Delay:<\/strong> echoes. <strong>Feedback<\/strong> is how many echoes repeat. <strong>Ping-pong<\/strong> bounces echoes between left and right."},{"type":"p","indent":true,"html":"<strong>Wet / dry / Mix:<\/strong> dry is the original sound, wet is the effect. Mix blends them."},{"type":"h4","text":"Routing"},{"type":"p","indent":true,"html":"<strong>Send:<\/strong> a knob on a track that copies some of its sound to an effect track. Lets several tracks share one reverb."},{"type":"p","indent":true,"html":"<strong>Return / effect track:<\/strong> the track that receives sends and holds the shared effect."},{"type":"p","indent":true,"html":"<strong>Group:<\/strong> a folder track that combines several tracks so you can process them together."},{"type":"p","indent":true,"html":"<strong>Sidechain:<\/strong> using one sound to control a process on another, like the kick pushing the rumble's volume down."},{"type":"p","indent":true,"html":"<strong>Ducking:<\/strong> a sound getting quieter in response to another, usually the kick."},{"type":"p","indent":true,"html":"<strong>Pre-fader / post-fader:<\/strong> whether a send takes its sound before or after the track's volume fader."},{"type":"h4","text":"Modulation and control"},{"type":"p","indent":true,"html":"<strong>Modulator:<\/strong> something that moves a knob automatically. LFO, Steps, Random, Audio Sidechain, ADSR."},{"type":"p","indent":true,"html":"<strong>LFO:<\/strong> a modulator that moves a knob back and forth in a repeating wave."},{"type":"p","indent":true,"html":"<strong>Steps:<\/strong> a modulator that plays a row of values you draw, one after another."},{"type":"p","indent":true,"html":"<strong>Routing:<\/strong> the connection from a modulator to a knob, shown as a coloured ring."},{"type":"p","indent":true,"html":"<strong>Sync on / off:<\/strong> on means timed to the beat (1/16, 1 bar); off means timed in Hz (cycles per second)."},{"type":"p","indent":true,"html":"<strong>Remote Controls page:<\/strong> a set of eight knobs you choose for a track or device, gathered in one place for quick access or a MIDI controller."},{"type":"h4","text":"Time and structure"},{"type":"p","indent":true,"html":"<strong>Bar:<\/strong> four beats at 132 BPM, about 1.8 seconds. <strong>Beat:<\/strong> one kick in four-on-the-floor, about 455 ms at 132 BPM. <strong>16th:<\/strong> a quarter of a beat, about 114 ms."},{"type":"p","indent":true,"html":"<strong>Step:<\/strong> one 16th-note slot on a drum machine's 16-button row. Step 1 is the downbeat; steps 1, 5, 9, 13 are the four beats. Part 16 uses step numbers."},{"type":"p","indent":true,"html":"<strong>Offbeat:<\/strong> the \"and\" halfway between two beats. Steps 3, 7, 11, 15."},{"type":"p","indent":true,"html":"<strong>Backbeat:<\/strong> beats 2 and 4 (steps 5 and 13), where a clap or snare traditionally goes."},{"type":"p","indent":true,"html":"<strong>Choke group:<\/strong> sounds that cut each other off, so an open hat stops the moment a closed hat plays."},{"type":"p","indent":true,"html":"<strong>Phrase:<\/strong> a group of bars, usually 16 or 32, that feels like a unit. DJs mix on phrase boundaries."},{"type":"p","indent":true,"html":"<strong>Velocity:<\/strong> how hard a note is played. Usually controls volume."},{"type":"p","indent":true,"html":"<strong>Groove / shuffle:<\/strong> delaying every second 16th slightly, for swing."},{"type":"p","indent":true,"html":"<strong>Clip:<\/strong> a block of notes or audio. <strong>Loop length:<\/strong> how long before a clip repeats."},{"type":"p","indent":true,"html":"<strong>Polymeter:<\/strong> loops of different lengths playing together, so they keep shifting against each other."},{"type":"p","indent":true,"html":"<strong>Rhythmic displacement:<\/strong> moving notes off their usual position, for example one 16th later."},{"type":"p","indent":true,"html":"<strong>Cue marker (locator):<\/strong> a labelled point on the Arrangement timeline."},{"type":"h4","text":"Files"},{"type":"p","indent":true,"html":"<strong>Preset:<\/strong> one saved device or container. <strong>Template:<\/strong> a whole saved project layout."},{"type":"p","indent":true,"html":"<strong>Bounce / resample:<\/strong> recording a track or clip's processed output as a new audio file, which you can then treat as a raw sound."},{"type":"p","indent":true,"html":"<strong>One-shot:<\/strong> a sample that plays all the way through once per note."}],"subs":[]},{"title":"Part 1: Session settings","blocks":[{"type":"table","rows":[["<strong>Setting<\/strong>","<strong>Value<\/strong>"],["Tempo","132 BPM"],["Key","One minor key, one chord, entire track"],["Global shuffle","15 to 20 percent"],["Master headroom","Master fader at -6 dB during writing"]],"header":true},{"type":"h4","text":"How to set them:"},{"type":"ol","start":1,"items":["<strong>Tempo.<\/strong> In the transport bar along the top, find the BPM number. Double-click it and type <code>132<\/code>.","<strong>Shuffle.<\/strong> Also in the transport area, next to the groove switch. Turn groove on and set shuffle to 15 to 20 percent.","<strong>Key.<\/strong> Pick any minor key. A minor and F minor are both common. The first note of the key (A or F) is your <strong>root note<\/strong>; you'll tune the kick to it in Part 2. Bitwig 6 added a project-wide key signature; set it there if you can find it, but the music works whether or not you do. Part 14.4 lists the low-end frequencies for common roots.","<strong>Headroom.<\/strong> Open the Mixer, find the Master track, and set its fader to <strong>-6 dB<\/strong> (double-click the value and type <code>-6<\/code>)."]},{"type":"p","indent":false,"html":"<strong>The headroom comes back out before export.<\/strong> That 6 dB is a working allowance, not a finished level. Part 11 is the step that recovers it. Earlier versions of this guide never said so, which is most of why the exports were quiet."}],"subs":[]},{"title":"Part 2: Kick and rumble","blocks":[{"type":"p","indent":false,"html":"The heart of the template. Everything else is decoration by comparison. Part 14 covers other ways to build a rumble and why each step works; this part builds the one the template uses."},{"type":"p","indent":false,"html":"<strong>Before the ducking section below, do the Part 4 drills<\/strong> if you haven't. It uses a modulator routing, and that's much easier once you've done one on a plain test sound."}],"subs":[{"title":"Filter naming, so this never trips you again","blocks":[{"type":"p","indent":true,"html":"<strong>High-pass = low cut.<\/strong> Removes everything <em>below<\/em> the cutoff."},{"type":"p","indent":true,"html":"<strong>Low-pass = high cut.<\/strong> Removes everything <em>above<\/em> the cutoff."},{"type":"p","indent":false,"html":"Bitwig shows these as shape icons. The high-pass icon slopes up from the left. The low-pass slopes down to the right."},{"type":"p","indent":false,"html":"To enter 30 Hz in a field displaying kHz, type <code>30 Hz<\/code> with the unit attached, or type <code>0.03<\/code>."}]},{"title":"Build the KICK track","blocks":[{"type":"ol","start":1,"items":["Right-click in the empty space below your track headers, choose <strong>Add Instrument Track<\/strong>. Double-click its name and call it KICK.","<strong>Load a kick.<\/strong> In the Browser, find a kick sample (in Bitwig's library or your own files) and drag it onto the KICK track's Device Panel. Bitwig loads it into a <strong>Sampler<\/strong>. If a Sampler is already there, drag the sample onto its waveform display instead.","<strong>One-shot mode.<\/strong> In the Sampler, find the playback mode chooser and set it to <strong>One-shot<\/strong>, so the whole sample plays once per note.","Drag <strong>EQ+<\/strong> onto the track, to the right of Sampler.","In EQ+, set the first band to high-pass (low cut) at <strong>30 Hz<\/strong>. This removes rumble you can't hear but that eats headroom.","<strong>Tune the kick to your root note.<\/strong>"]},{"type":"p","indent":true,"html":"Drag <strong>Tuner<\/strong> onto the track after the Sampler (it arrived in Bitwig 6.1). Play the kick and watch which note it shows most often. Kicks are short, so the reading jumps; go with the most common note."},{"type":"p","indent":true,"html":"No Tuner? Look at EQ+'s spectrum display: the tallest hump at the low end is the fundamental."},{"type":"p","indent":true,"html":"Turn the Sampler's <strong>Pitch<\/strong> knob (in semitones) until the Tuner reads your root note, or the same note an octave away."},{"type":"p","indent":true,"html":"Remove the Tuner afterwards."},{"type":"p","indent":true,"html":"This matters for the rumble too: the rumble is made from the kick, so it inherits the kick's pitch."},{"type":"ol","start":7,"items":["<strong>Short decay.<\/strong> If you can hear a tail after the kick's thump, shorten the Sampler's amp decay. Aim for a kick of roughly <strong>200 to 250 ms<\/strong>. One beat at 132 BPM is about 455 ms, so that leaves about 200 ms for the rumble to bloom. A long, boomy kick leaves the rumble nowhere to live.","Drag <strong>Saturator<\/strong> onto the end of the chain with a small amount of drive. This adds harmonics above 200 Hz so the kick survives on phone speakers."]}]},{"title":"Build the RUMBLE effect track","blocks":[{"type":"p","indent":false,"html":"Right-click in the empty space below your track headers, choose <strong>Add Effect Track<\/strong>. Name it RUMBLE."},{"type":"p","indent":false,"html":"Verify it landed in the Effect track section at the bottom, below a divider. If it's sitting inline with your regular tracks, you added an Audio track by mistake. Delete and redo."},{"type":"p","indent":false,"html":"Chain, left to right:"},{"type":"table","rows":[["<strong>Position<\/strong>","<strong>Device<\/strong>","<strong>Setting<\/strong>"],["1","EQ+ (pre-filter)","Low-pass (high cut) at <strong>200 Hz<\/strong>. Optionally a high-pass at <strong>30 Hz<\/strong> too."],["2","Reverb","Fully wet, size large, decay ~2 s, pre-delay at or near zero, damping down hard"],["3","Saturator","Gentle drive to start. Push harder for grit (see the post-filter below)."],["4","EQ+ (post-filter)","<strong>Recommended.<\/strong> Low-pass at <strong>120 to 250 Hz<\/strong>. A dip of about <strong>-3 dB around 200 Hz<\/strong>."],["5","Tool","<strong>Width<\/strong> turned all the way down (mono). <strong>Gain<\/strong> left at 0 dB."]],"header":true},{"type":"p","indent":false,"html":"<strong>Why filter twice.<\/strong> The first EQ+ feeds the reverb only the kick's body, so the click doesn't turn into hiss. The Saturator then manufactures new harmonics above 200 Hz. A little of that helps the rumble survive small speakers, which is why the template originally stopped there. But as you push the drive, those harmonics turn fizzy and crowd the 200 to 500 Hz zone. The second EQ+ removes them. Every rumble tutorial we translated (Part 14) filters both before the space and after the drive. The 200 Hz dip keeps the rumble from going muddy."},{"type":"p","indent":false,"html":"<strong>Why Width goes to zero.<\/strong> Reverb spreads sound across the left and right speakers. That's fine for high sounds, but stereo low end partly cancels itself out on club systems and phone speakers, so the rumble gets thin or disappears. The fix is to make the low end mono, meaning identical in both speakers."},{"type":"p","indent":false,"html":"Bitwig's Tool device has no \"mono below a frequency\" control. (That's an Ableton feature, and an earlier version of this guide wrongly listed it.) Here you don't need one: the EQ+ devices already remove everything above about 200 Hz, so the rumble contains only low end. Making the whole track mono with Tool's Width does exactly the right job."},{"type":"p","indent":false,"html":"<strong>Tool's Gain stays at 0 dB.<\/strong> The Audio Sidechain ducking (below) moves Gain downward, and it needs room to move. Set the rumble's volume with its mixer fader or the KICK send, never with Tool's Gain."},{"type":"p","indent":false,"html":"<strong>LFO 4 (Part 5) goes on the first EQ+<\/strong>, the pre-filter, not the post-filter."}]},{"title":"Set up the send","blocks":[{"type":"p","indent":false,"html":"Sends are not in the device chain. They're in the mixer."},{"type":"ol","start":1,"items":["Open the <strong>Mixer<\/strong> panel.","Along its left edge is a column of small toggles controlling which sections show: meters, sends, EQ. <strong>The sends section is often off by default.<\/strong> Turn it on.","A send slot labeled RUMBLE appears on every channel strip.","On KICK, turn the send up. Start around 25 percent."]},{"type":"p","indent":false,"html":"Alternate route: select the KICK track and open the <strong>Inspector<\/strong> on the left. Sends are listed there too."},{"type":"p","indent":false,"html":"<strong>Optional: set the send to post-fader.<\/strong> You can usually skip this, because Bitwig's default (<strong>Auto<\/strong>) lets the effect track decide, and that normally behaves as post-fader. To set it explicitly:"},{"type":"ol","start":1,"items":["In the <strong>Mixer<\/strong>, find the RUMBLE send knob on the KICK channel strip.","<strong>Right-click the send knob<\/strong> and choose <strong>Post<\/strong> from the menu.","The ring around the knob turns <strong>yellow<\/strong>. (Yellow means post-fader, blue means pre-fader.)"]},{"type":"p","indent":false,"html":"What post-fader means: the send takes its signal <em>after<\/em> the KICK volume fader. If you turn the kick down later, the rumble comes down with it, which is what you want for audio you hear. This is separate from the \"pre\" setting in the ducking step below, which is about the sidechain trigger rather than the send."}]},{"title":"Set up the ducking","blocks":[{"type":"p","indent":false,"html":"Not a compressor. Use the Audio Sidechain modulator: it listens to the kick and pulls Tool's Gain down every time the kick hits. Ducking goes at the <strong>end<\/strong> of the chain, after the reverb and drive, or the tail fills the gap back in."},{"type":"p","indent":false,"html":"<strong>Before you start:<\/strong> solo RUMBLE and play. Soloing mutes the kick, but the trigger keeps working, so you'll clearly hear whether the rumble dips on each beat."},{"type":"h4","text":"Add and connect the modulator"},{"type":"ol","start":1,"items":["On RUMBLE, open the Modulators pane on the <strong>Tool<\/strong> device (icon in its bottom-left corner).","Click <strong>+<\/strong> and choose <strong>Audio Sidechain<\/strong>.","In the modulator, set the input source to the <strong>KICK<\/strong> track. If there's a pre/post choice, pick <strong>pre<\/strong>: it keeps the trigger steady regardless of the kick's fader.","<strong>Check it's hearing the kick.<\/strong> The modulator's small display should bounce on every kick. If it's flat, the source is wrong or the kick isn't playing. Don't go further until it bounces."]},{"type":"h4","text":"Set the modulator's knobs"},{"type":"p","indent":false,"html":"The Audio Sidechain has its own knobs. They shape the signal it sends out, before it reaches Tool's Gain."},{"type":"table","rows":[["<strong>Knob<\/strong>","<strong>What it does<\/strong>","<strong>Set it to<\/strong>"],["<strong>Gain<\/strong>","How strongly it reacts to the kick","Turn up until the display's bounce reaches near the top on every kick. If the bounce is small, the ducking will be tiny however far you drag."],["<strong>Rise<\/strong>","How fast the duck happens when the kick hits","As fast as it goes, or very close"],["<strong>Fall<\/strong>","How fast the rumble swells back after the kick","Around <strong>200 ms<\/strong> to start. This is \"the release\" tuned below."],["<strong>Low cut / High cut<\/strong>","Filter what the modulator listens to","Leave wide open (low cut all the way down, high cut all the way up). The KICK track contains only the kick, so there's nothing to filter out."]],"header":true},{"type":"h4","text":"Route it to Tool's Gain"},{"type":"ol","start":1,"items":["Make sure Tool's <strong>Gain<\/strong> knob is at <strong>0 dB<\/strong>. It needs room to move down.","Click the modulator's <strong>routing button<\/strong> (dot with arrow) so it flashes.","Click on Tool's <strong>Gain<\/strong> and <strong>drag down a lot<\/strong>, well over half the knob's travel. A small drag on a gain knob only removes a few dB, which the reverb tail easily covers up.","Click the routing button again to stop."]},{"type":"p","indent":false,"html":"<em>You should hear<\/em> the rumble drop away on each kick and swell back in between. Watch Tool's Gain: an indicator inside its ring should jump down in time with the kick."},{"type":"p","indent":false,"html":"<strong>Too much?<\/strong> If the rumble almost disappears, re-arm and drag less, or lower the modulator's Gain slightly."},{"type":"p","indent":false,"html":"<strong>Still nothing?<\/strong> Work through the \"Rumble isn't ducking\" entry in Troubleshooting."},{"type":"p","indent":false,"html":"<strong>Do not also run a compressor here.<\/strong> The two do the same job and stacking them double-ducks."}]},{"title":"Tune it, in this order","blocks":[{"type":"p","indent":false,"html":"Each step changes what you hear in the next, so the order matters."},{"type":"ol","start":1,"items":["<strong>Fall first.<\/strong> This is the most important setting in the entire template. Loop four bars. Sweep the Audio Sidechain's <strong>Fall<\/strong> from about 120 ms to 350 ms. Listen for where it stops sounding like reverb and starts sounding like the kick has a tail: ducked enough to leave room, not so much that it pumps. Around 200 ms is a starting point, not an answer.","<strong>Then the Reverb.<\/strong> Size and decay change everything downstream, so tune them while hearing the whole chain. Bigger and longer is deeper and dubbier. Smaller and shorter is tighter and more driving.","<strong>Then the post-filter low-pass.<\/strong> Lower is rounder and further away; higher is grittier and more present.","<strong>Then level,<\/strong> with the RUMBLE fader or the KICK send, never Tool's Gain."]},{"type":"p","indent":false,"html":"Blend until you feel it more than you hear it. If you can point at it and say \"that's reverb,\" pull it back with the RUMBLE fader."},{"type":"p","indent":false,"html":"Those four controls (Fall, reverb decay, drive, post-filter low-pass) move this one rumble across most of the styles in Part 14.9. Part 14.9 shows how to put them on one Remote Controls page."}]}]},{"title":"Part 3: Percussion","blocks":[{"type":"p","indent":false,"html":"Mostly clip arithmetic, not sound design."}],"subs":[{"title":"The core idea","blocks":[{"type":"p","indent":false,"html":"Everything loops at 4 bars except Perc A, which loops at 3. Your ear tries to lock them together and can't. Twelve bars before the relationship repeats."},{"type":"p","indent":false,"html":"<strong>Need notes to put in these tracks?<\/strong> Part 16 has three complete step patterns from a TR-8S, a map of which template track each part goes on, and a way to make one of their cells drift like Perc A."}]},{"title":"HATS","blocks":[{"type":"ol","start":1,"items":["New instrument track named HATS. Drag a <strong>Drum Machine<\/strong> onto it from the Browser.","Drag a closed hi-hat sample from the Browser onto one of the Drum Machine's pads (or keys). It loads into a Sampler on that pad. Alternatively, skip the Drum Machine and drop the sample straight onto the track, which makes a Sampler.","Double-click an empty clip slot to create a clip, then double-click the clip to open it in the editor at the bottom. Draw a note on every 16th across one bar. (Part 16 offers the other common choice: offbeats only, steps 3, 7, 11, 15.)","<strong>Vary the velocities from 60 to 110.<\/strong> Offbeats generally quieter. This matters more than the sample; flat velocities sound like a machine. In the clip editor, look for the expression lanes under the notes and choose <strong>Velocity<\/strong>, then drag each note's bar up or down. Or select a note and type its velocity in the Inspector.","EQ+ after it, low cut around 400 Hz."]},{"type":"p","indent":false,"html":"<strong>Check the Drum Machine's own fader.<\/strong> Its container fader defaults to <strong>-10 dB<\/strong>, while each chain inside it defaults to 0 dB relative to that container. It's a deliberate headroom choice by Bitwig, and it's easy to forget it's there. See Part 11."},{"type":"p","indent":false,"html":"For hats that groove from the kick through their own ducked reverb, see \"Hats that groove from the kick\" in Part 15.3."}]},{"title":"PERC A, the engine","blocks":[{"type":"ol","start":1,"items":["New instrument track named PERC A. Load a conga, rim, or woodblock sample the same way as the kick. Dry and short.","Create a clip and write a pattern across <strong>three bars<\/strong>.","Select the clip, open the <strong>Inspector<\/strong>, set loop length to <strong>3 bars<\/strong>. Everything else stays at 4. If the loop fields aren't in the Inspector, drag the loop end marker along the top of the clip editor.","Drag <strong>Filter+<\/strong> onto the track. Set it to <strong>band-pass<\/strong>, with Resonance about a third of the way up.","<strong>Send to FILTERED DELAY,<\/strong> once you've built it in Part 6. Skip this step until then."]},{"type":"p","indent":false,"html":"<strong>The test:<\/strong> play 12 bars and count. Perc A should land in a different spot against the kick each pass, resetting at bar 13. If it lines up identically every 4 bars, the loop length didn't take."}]},{"title":"PERC B (add later)","blocks":[{"type":"p","indent":false,"html":"Different timbre from A. If A is wooden, make B metallic (Part 12.6 has recipes). Loop length of <strong>7 sixteenth-notes<\/strong> against the 16-step bar."},{"type":"p","indent":false,"html":"To set that: set the clip editor's grid to 1/16, then drag the loop end marker to the end of the 7th sixteenth. In the Inspector the length may read as <code>0.1.3<\/code>, meaning 0 bars, 1 beat, 3 sixteenths."},{"type":"p","indent":false,"html":"Heavier reverb send than Perc A, so it sits further back."}]},{"title":"Groove","blocks":[{"type":"p","indent":false,"html":"Bitwig handles groove globally, unlike Ableton's per-clip Groove Pool. You set the shuffle amount in Part 1."},{"type":"p","indent":false,"html":"Check whether individual clips can opt out. You want groove <strong>on<\/strong> for hats and perc, <strong>off<\/strong> for the kick. A swung kick is a different genre."}]},{"title":"Sit with it","blocks":[{"type":"p","indent":false,"html":"Loop 16 bars of kick, rumble, hats, and Perc A. Two full minutes, hands off. If it feels tedious, the loop lengths are still aligned. If you lose track of where you are, it's working."}]}]},{"title":"Part 4: How modulation works in Bitwig","blocks":[{"type":"p","indent":false,"html":"The single most important skill in this DAW. Read the mental model first, then do the drills. The drills matter more than the reading."}],"subs":[{"title":"The mental model: source, routing, target","blocks":[{"type":"p","indent":false,"html":"Every modulation in Bitwig has three parts."},{"type":"pre","text":"SOURCE              ROUTING                  TARGET\n(modulator)  --->   (a connection with  ---> (a parameter knob\n LFO, Steps,         its own amount and        with a base value)\n Audio Sidechain     direction)"},{"type":"ol","start":1,"items":["<strong>The source<\/strong> is a modulator: an LFO, an envelope, Steps, Audio Sidechain, Random. It produces a moving signal and does nothing on its own.","<strong>The routing<\/strong> is the connection from that source to one parameter. Each routing has its own <strong>amount<\/strong> (how far it moves the knob) and <strong>direction<\/strong> (up or down).","<strong>The target<\/strong> is the knob. Its position is the <strong>base value<\/strong>, the resting point. Modulation moves the parameter away from that base value and back, inside a range shown by a colored ring."]},{"type":"p","indent":false,"html":"The idea most people miss: <strong>turning the knob does not change the modulation, it moves the whole range.<\/strong> If a filter is sweeping between 400 Hz and 2 kHz and you turn the cutoff knob up, the sweep moves up with it. The amount stays the same. This is why we set resting positions deliberately."},{"type":"p","indent":false,"html":"One modulator can have many routings (one LFO moving five knobs, each by a different amount). One knob can receive many routings (three LFOs adding together on a single cutoff)."}]},{"title":"Where things live","blocks":[{"type":"table","rows":[["<strong>Thing<\/strong>","<strong>Where<\/strong>"],["Modulators pane","Click the <strong>Modulators icon in the bottom-left corner of a device<\/strong>. The pane opens beside the device's parameters."],["Slots","Three by default. More appear as you fill them."],["Add a modulator","The <strong>+<\/strong> button in the Modulators pane opens the Popup Browser. Pick the modulator type."],["Routing button","On each modulator: a small <strong>dot with an arrow<\/strong>. Some modulators have more than one."],["Modulation range","A colored <strong>ring<\/strong> drawn around the target knob."]],"header":true},{"type":"p","indent":false,"html":"A modulator belongs to the device it sits on, but it can reach parameters on other devices in the same chain too. Placing it on the device you're modulating keeps things easy to find later."}]},{"title":"Making a routing, step by step","blocks":[{"type":"ol","start":1,"items":["Open the Modulators pane on the device (bottom-left icon).","Click <strong>+<\/strong> and choose <strong>LFO<\/strong>.","Click the LFO's <strong>routing button<\/strong> (dot with arrow). It starts flashing, and every parameter you can modulate turns <strong>blue<\/strong>.","<strong>Click and drag<\/strong> on the target knob. Drag up for positive modulation, down for negative. The distance you drag sets the amount. A ring appears around the knob.","Still flashing? You can drag on more knobs now, and each gets its own routing from the same LFO.","Click the routing button again to stop. The parameters stop being blue."]},{"type":"p","indent":false,"html":"<strong>If the knob just turned instead of growing a ring, the routing button wasn't flashing.<\/strong> That is the number-one beginner mistake. Undo, arm, try again."}]},{"title":"Blue versus green","blocks":[{"type":"p","indent":true,"html":"<strong>Blue<\/strong> means monophonic: one modulation signal for the whole device. Use this for effects, filters on audio tracks, sends, everything in the Part 5 checklist."},{"type":"p","indent":true,"html":"<strong>Green<\/strong> means polyphonic: each note gets its own modulation. Only relevant on instruments, for example each arpeggiated note getting its own envelope. The Inspector toggles between modes."},{"type":"p","indent":false,"html":"If you see green when you expected blue, nothing is broken. For the template, stay in blue."}]},{"title":"Editing and removing a routing","blocks":[{"type":"p","indent":true,"html":"<strong>Change the amount:<\/strong> arm the routing button again and drag on the same knob. You're adjusting the existing routing, not making a second one."},{"type":"p","indent":true,"html":"<strong>See what a modulator is doing:<\/strong> each routing shows its target and amount in a small readout beside the modulator. Hover or click to inspect."},{"type":"p","indent":true,"html":"<strong>Remove a routing:<\/strong> double-click the modulation amount."},{"type":"p","indent":true,"html":"<strong>Change the shape of a routing:<\/strong> routings can have curves (for example exponential) so the modulation doesn't move linearly. Useful on filter cutoff, which sounds more even with a curve."}]},{"title":"Modulating a modulator","blocks":[{"type":"p","indent":false,"html":"A modulator's own knobs (rate, depth, phase) are parameters like any other, so they can be targets."},{"type":"ol","start":1,"items":["Add a second LFO. Set it very slow.","Arm its routing button.","Drag on the <strong>first LFO's rate or depth knob<\/strong>."]},{"type":"p","indent":false,"html":"Now the first LFO speeds up and slows down, or deepens and relaxes, over time. This is the \"destroy the filter\" move from the lead voice tutorial, and the cleanest way to make motion that never repeats."}]},{"title":"Stacking","blocks":[{"type":"p","indent":false,"html":"When several modulators target one knob, their effects add. Two LFOs at unrelated free-running rates on the same cutoff give you a movement far less predictable than either alone. Past three or four sources on one knob, it tends to turn to mush."}]},{"title":"Practice drills","blocks":[{"type":"p","indent":false,"html":"Fifteen minutes on a throwaway track. Every drill uses the same test sound, so set that up once."},{"type":"h4","text":"Setup: a test sound"},{"type":"ol","start":1,"items":["Right-click below your tracks, <strong>Add Instrument Track<\/strong>. Name it TEST.","Drag <strong>Polymer<\/strong> onto it. If the default sound is dull rather than bright and buzzy, find Polymer's own filter section and turn its cutoff all the way up, so Polymer stays out of the way.","Make a held note, meaning one continuous tone:"]},{"type":"p","indent":true,"html":"With a MIDI keyboard: arm the track and hold a key."},{"type":"p","indent":true,"html":"Without one: double-click an empty clip slot on TEST to create a clip. Double-click in the note grid to make a note, then drag its right edge out to fill the whole clip. Launch the clip."},{"type":"ol","start":4,"items":["Drag <strong>Filter+<\/strong> onto TEST, to the <strong>right<\/strong> of Polymer."]},{"type":"h4","text":"Words used in the drills"},{"type":"p","indent":true,"html":"<strong>Filter:<\/strong> removes part of a sound. <strong>Low-pass<\/strong> mode removes the bright, high part, like hearing music through a wall."},{"type":"p","indent":true,"html":"<strong>Cutoff:<\/strong> the main filter knob. Low = muffled, high = bright and open."},{"type":"p","indent":true,"html":"<strong>Resonance:<\/strong> a boost right at the cutoff point. More resonance makes the filter ring or whistle as it moves. On Filter+ it's the smaller knob beside the big Cutoff knob."},{"type":"p","indent":true,"html":"<strong>LFO:<\/strong> an invisible hand that turns a knob back and forth on repeat."},{"type":"p","indent":true,"html":"<strong>Hz:<\/strong> cycles per second. 0.5 Hz = one full back-and-forth every 2 seconds. 0.1 Hz = every 10 seconds."},{"type":"p","indent":true,"html":"<strong>Sync off:<\/strong> the LFO is timed in seconds, not locked to the beat."},{"type":"p","indent":true,"html":"<strong>Amount:<\/strong> how far the invisible hand turns the knob. Set by how far you drag."},{"type":"h4","text":"Drill 1: one LFO, one knob"},{"type":"p","indent":false,"html":"<em>Goal: make the filter open and close by itself.<\/em>"},{"type":"ol","start":1,"items":["Press play so the note sounds.","On Filter+, set the mode to <strong>low-pass<\/strong> (the shape sloping down to the right).","Turn <strong>Cutoff<\/strong> down by hand until the sound is muffled but clear, about a third of the way up. This is the base value.","Click the <strong>Modulators icon in Filter+'s bottom-left corner<\/strong>.","Click <strong>+<\/strong>, choose <strong>LFO<\/strong>.","On the LFO, turn <strong>sync off<\/strong> so the rate reads in Hz. Set rate to <strong>0.5 Hz<\/strong> (double-click the value and type <code>0.5<\/code> if dragging is fiddly).","Click the LFO's <strong>routing button<\/strong> (dot with arrow). It flashes, and Filter+'s knobs turn blue.","Click on <strong>Cutoff<\/strong> and <strong>drag upward<\/strong> about a third of the knob's travel. A colored ring appears.","Click the routing button again to stop."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> muffled, bright, muffled, every 2 seconds, like a slow \"wah.\" A small marker moves inside the ring."},{"type":"p","indent":false,"html":"<em>Then:<\/em> turn the Cutoff knob itself. The whole sweep shifts darker or brighter but stays the same size. The knob sets where the sweep sits; the ring sets how big it is."},{"type":"p","indent":false,"html":"<em>Then:<\/em> change the rate to <strong>0.1 Hz<\/strong>. That ten-second cycle is much closer to hypnotic speed."},{"type":"h4","text":"Drill 2: one LFO, two knobs"},{"type":"p","indent":false,"html":"<em>Goal: one source moving more than one thing.<\/em>"},{"type":"ol","start":1,"items":["Click the same LFO's routing button so it flashes.","Click on <strong>Resonance<\/strong> and drag upward a small amount, about a fifth of the knob's travel.","Stop routing."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> the sweep now rings or whistles slightly as it opens. Both knobs have rings, both moving together from one LFO. You can keep adding knobs this way, each with its own amount, including knobs on Polymer. Part 15.2 builds on this move."},{"type":"h4","text":"Drill 3: modulate the modulator"},{"type":"p","indent":false,"html":"<em>Goal: make the motion itself change over time.<\/em>"},{"type":"ol","start":1,"items":["Set the first LFO's rate back to 0.5 Hz.","In the same Modulators pane, click <strong>+<\/strong> and add a <strong>second LFO<\/strong>. Sync off, rate <strong>0.05 Hz<\/strong> (one cycle every 20 seconds).","Click the second LFO's routing button.","Drag upward on the <strong>first LFO's Rate knob<\/strong>.","Stop routing."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> the sweep gradually speeding up and slowing down over about 20 seconds. This is the core hypnotic technique in miniature: motion that never settles into one rhythm."},{"type":"h4","text":"Drill 4: two sources, one knob"},{"type":"p","indent":false,"html":"<em>Goal: hear how modulation adds up.<\/em>"},{"type":"ol","start":1,"items":["Remove Drill 3's routing: double-click the modulation amount, or simply delete the second LFO.","Add a new LFO. Sync off, rate <strong>0.13 Hz<\/strong>.","Route it to <strong>Cutoff<\/strong> with a small upward drag."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> a sweep that never lands in quite the same place twice, because two unrelated speeds are adding together on one knob."},{"type":"h4","text":"Drill 5: Steps, a rhythm you draw"},{"type":"p","indent":false,"html":"<em>Goal: learn the Steps modulator, which Parts 12, 13, and 15 use for rhythmic wubs, tom variation, and pitch sequences.<\/em>"},{"type":"ol","start":1,"items":["Delete the LFOs from the earlier drills so you can hear Steps on its own.","On Filter+, click <strong>+<\/strong> in the Modulators pane and choose <strong>Steps<\/strong>.","You'll see a row of vertical bars, one per step. Click and drag on each bar to set its height. Try: low, low, high, low, silent-ish, high, low, low.","Set its rate to <strong>1/16<\/strong> (sync on).","Route it to <strong>Cutoff<\/strong> with an upward drag, about a third.","Find its step count control and change it from 8 to <strong>7<\/strong>."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> the filter jumping through your drawn pattern in rhythm. At 7 steps, the pattern starts in a different place against each bar, so it rolls rather than repeats."}]},{"title":"Troubleshooting modulation","blocks":[{"type":"table","rows":[["<strong>Symptom<\/strong>","<strong>Likely cause<\/strong>"],["Knob moved, no ring appeared","Routing button wasn't flashing. Undo and arm first."],["Ring is there, sound barely changes","Amount is tiny. Re-arm and drag further."],["Modulation seems to stop at one end","The base value is near the knob's limit, so modulation hits the edge and flattens. Move the knob toward the middle."],["Everything pulses on the grid","LFO is tempo-synced. Turn sync off and set a rate in Hz."],["Parameters show green instead of blue","Polyphonic mode is on. Switch back in the Inspector."],["Can't find the modulator later","It sits on a different device in the chain. Check each device's Modulators pane."]],"header":true}]},{"title":"How this connects to the template","blocks":[{"type":"p","indent":false,"html":"Every modulator in the Part 5 checklist is one routing: a source, an amount, a target. The Audio Sidechain on the RUMBLE Tool device is also just a routing: source is the kick's amplitude, target is Tool's gain, direction is down. Once this section clicks, the whole template is variations of the same move."}]}]},{"title":"Part 5: Where each modulator goes","blocks":[],"subs":[{"title":"What this part is","blocks":[{"type":"p","indent":false,"html":"There is no \"modulation layer\" location in Bitwig. This part is a checklist of individual modulators, placed one at a time across the project."},{"type":"p","indent":true,"html":"<strong>Five modulators total, for the whole project.<\/strong> Not five per track."},{"type":"p","indent":true,"html":"<strong>Each lives inside one device on one track<\/strong>, and moves a knob on that same device."},{"type":"p","indent":true,"html":"<strong>They are not sends.<\/strong> They work exactly like the Audio Sidechain already on RUMBLE's Tool device."},{"type":"p","indent":true,"html":"<strong>Add each one only when its track exists.<\/strong> RUMBLE and PERC A exist after Part 3."},{"type":"p","indent":true,"html":"CHORD and ATMOS exist after Part 6."},{"type":"p","indent":false,"html":"The rates are deliberately odd numbers that don't line up with the beat or with each other, so the combined motion never repeats. 0.07 Hz is one cycle every ~14 seconds; 0.013 Hz is one cycle every ~77 seconds."}]},{"title":"The checklist","blocks":[{"type":"p","indent":false,"html":"<strong>LFO 1: PERC A filter<\/strong> (the most important one)"},{"type":"p","indent":true,"html":"Device: the <strong>Filter+<\/strong> (band-pass) on PERC A"},{"type":"p","indent":true,"html":"Modulator: <strong>LFO<\/strong>, sync off, <strong>0.07 Hz<\/strong>"},{"type":"p","indent":true,"html":"Target: <strong>Cutoff<\/strong>, drag up about a quarter of the knob"},{"type":"p","indent":true,"html":"Before routing: set Cutoff by hand to where the percussion sounds good"},{"type":"p","indent":true,"html":"Aim: subtle. The loop feels different each pass without an obvious \"filter sweep\" sound."},{"type":"h4","text":"LFO 4: RUMBLE warmth"},{"type":"p","indent":true,"html":"Device: the <strong>first EQ+<\/strong> on RUMBLE (the pre-filter; not Tool, which already has the sidechain, and not the post-filter EQ+)"},{"type":"p","indent":true,"html":"Modulator: <strong>LFO<\/strong>, sync off, <strong>0.013 Hz<\/strong>"},{"type":"p","indent":true,"html":"Target: the <strong>low-pass band's frequency<\/strong>, drag up a small amount, about a fifth"},{"type":"p","indent":true,"html":"Before routing: set that low-pass down to about <strong>170 Hz<\/strong> by hand, so the sweep runs roughly 170 to 230 Hz"},{"type":"p","indent":true,"html":"Aim: at 77 seconds per cycle you won't hear it move, only notice the low end slowly getting warmer and darker."},{"type":"p","indent":false,"html":"<strong>Random: HATS<\/strong> (optional)"},{"type":"p","indent":true,"html":"Device: a <strong>Tool<\/strong> you add at the end of the HATS chain"},{"type":"p","indent":true,"html":"Modulator: <strong>Random<\/strong>, sync on, <strong>1/16<\/strong>"},{"type":"p","indent":true,"html":"Target: <strong>Gain<\/strong>, drag down a small amount"},{"type":"p","indent":true,"html":"Aim: nudges each hit's volume slightly. Keep it small; a big amount sounds broken rather than human. Optional because you already varied velocities by hand."},{"type":"p","indent":false,"html":"<strong>LFO 2: CHORD echo swell<\/strong> (after Part 6)"},{"type":"p","indent":true,"html":"Device: the <strong>Delay+<\/strong> on CHORD"},{"type":"p","indent":true,"html":"Modulator: <strong>LFO<\/strong>, sync off, <strong>0.11 Hz<\/strong>"},{"type":"p","indent":true,"html":"Target: <strong>Mix<\/strong>, drag up about a quarter"},{"type":"p","indent":true,"html":"Aim: the delay tail swells and recedes. (Earlier versions said \"reverb send.\" Changed because a send is a mixer control rather than a device knob, and the delay's Mix gives the same effect reliably.)"},{"type":"p","indent":false,"html":"<strong>LFO 3: ATMOS width<\/strong> (after Part 6)"},{"type":"p","indent":true,"html":"Device: the <strong>Tool<\/strong> at the end of ATMOS"},{"type":"p","indent":true,"html":"Modulator: <strong>LFO<\/strong>, sync off, <strong>0.19 Hz<\/strong>"},{"type":"p","indent":true,"html":"Target: <strong>Width<\/strong>, drag up about half"},{"type":"p","indent":true,"html":"Aim: the background bed slowly widens and narrows."}]},{"title":"How to add any of them","blocks":[{"type":"p","indent":false,"html":"Same steps as Drill 1 in Part 4."},{"type":"ol","start":1,"items":["Click the <strong>track<\/strong>.","Find the <strong>device<\/strong> listed. If it says \"add at end,\" drag that device onto the end of the chain first.","Click the <strong>Modulators icon in that device's bottom-left corner<\/strong>.","Click <strong>+<\/strong>, choose the <strong>modulator<\/strong> listed.","Set the <strong>sync<\/strong> and <strong>rate<\/strong>.","Set the target knob's <strong>resting position<\/strong> by hand, where you want the sweep to start from.","Click the modulator's <strong>routing button<\/strong> so it flashes.","Click on the <strong>target knob<\/strong> and <strong>drag<\/strong> the direction and distance listed.","Click the routing button again to stop."]}]},{"title":"Checking your work","blocks":[{"type":"p","indent":false,"html":"When all five are in, play 32 bars with nothing else changing. Nothing should sound like it's obviously sweeping. If you can point at one element and say \"that's an LFO,\" reduce its amount."}]}]},{"title":"Part 6: Returns, groups, and remaining channels","blocks":[{"type":"p","indent":false,"html":"Build in this order: the two returns first (other tracks send to them), then SPARE, then CHORD and ATMOS, then groups."}],"subs":[{"title":"Return: REVERB LONG","blocks":[{"type":"p","indent":false,"html":"Shared long reverb for atmosphere, drones, and Perc B."},{"type":"ol","start":1,"items":["Right-click below your tracks, <strong>Add Effect Track<\/strong>. Name it REVERB LONG. Check it sits below the divider with RUMBLE.","<strong>EQ+<\/strong>: high-pass at <strong>300 Hz<\/strong>, so the reverb never adds mud to the low end.","<strong>Reverb<\/strong>: Mix fully wet (100 percent). Decay long, <strong>6 to 8 seconds<\/strong>. Damping moderate, so the tail darkens as it fades."]},{"type":"p","indent":false,"html":"Effect-track devices are fully wet because the dry sound is already playing on the original track. The send knob decides how much of each track reaches the reverb."}]},{"title":"Return: FILTERED DELAY","blocks":[{"type":"p","indent":false,"html":"Shared dub-style echo with darkened, narrowed repeats."},{"type":"ol","start":1,"items":["<strong>Add Effect Track<\/strong>, name it FILTERED DELAY.","<strong>Delay+<\/strong>:"]},{"type":"p","indent":true,"html":"Mix fully wet"},{"type":"p","indent":true,"html":"Time <strong>3/16<\/strong> (a dotted eighth, the classic dub delay; 341 ms at 132 BPM)"},{"type":"p","indent":true,"html":"Mode <strong>Ping<\/strong> (ping-pong, echoes bounce left and right)"},{"type":"p","indent":true,"html":"Feedback around <strong>50 to 60 percent<\/strong>"},{"type":"p","indent":true,"html":"Use its <strong>EQ<\/strong> section to narrow the repeats: low cut up toward <strong>400 Hz<\/strong>, high cut down toward <strong>3 kHz<\/strong>"},{"type":"ol","start":3,"items":["<strong>EQ+<\/strong> after it: high-pass at <strong>300 Hz<\/strong>."]},{"type":"p","indent":false,"html":"<strong>Feedback warning:<\/strong> past about 70 percent, especially with saturation anywhere in the chain, echoes can build forever. See \"Sound keeps playing after I stop\" in Troubleshooting."},{"type":"p","indent":false,"html":"Now go back and turn up PERC A's send to FILTERED DELAY, around 15 to 25 percent."},{"type":"p","indent":false,"html":"This is different from the RUMBLE MID layer in Part 14.5: FILTERED DELAY is stereo, clean, and fed by percussion; RUMBLE MID is mono, distorted, fed by the kick, and sits right under it."}]},{"title":"SPARE","blocks":[{"type":"p","indent":false,"html":"An empty instrument track reserved for a variation voice: the Part 7 lead, a Part 12 sound like the wub or the one-hit lead (12.14), or the sliding bassline from Part 14.8. Add an Instrument Track, name it SPARE, leave it empty. Having the slot in the template means the arrangement and groups already account for it."}]},{"title":"CHORD","blocks":[{"type":"p","indent":false,"html":"One stab every 8 bars. The effects generate the movement, not the playing."},{"type":"ol","start":1,"items":["Add Instrument Track, name it CHORD. Load <strong>Polymer<\/strong> (or Polysynth) with a saw oscillator.","<strong>Make it a stab:<\/strong> short amp decay, low sustain, so each chord is a brief \"chk.\"","<strong>Write the chord.<\/strong> Create an <strong>8-bar<\/strong> clip and put one chord at the very start. For a minor 7 on your root note: root, plus 3 semitones, plus 7, plus 10. For sus2: root, plus 2, plus 7.","<strong>Filter+<\/strong>, low-pass, Cutoff about halfway, Resonance about a third.","<strong>Delay+<\/strong>, Mode <strong>Ping<\/strong>, Feedback around <strong>65 percent<\/strong>, EQ narrowing the repeats as on FILTERED DELAY. Mix around a third. (LFO 2 in Part 5 goes on this Mix.)","<strong>Tool<\/strong>, Width up a little.","<strong>EQ+<\/strong> at the end, high-pass at <strong>300 Hz<\/strong> so it never touches the rumble."]},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> a short chord, then a trail of darker echoes bouncing between speakers and fading."}]},{"title":"ATMOS","blocks":[{"type":"p","indent":false,"html":"The background bed."},{"type":"ol","start":1,"items":["Add Instrument Track, name it ATMOS. Either:"]},{"type":"p","indent":true,"html":"<strong>Polymer<\/strong> with its noise turned up and oscillators down, for filtered noise, or"},{"type":"p","indent":true,"html":"<strong>Sampler<\/strong> with a pad or field recording"},{"type":"ol","start":2,"items":["Create a clip with <strong>one long held note<\/strong> filling it, 8 bars or more.","<strong>Filter+<\/strong>, band-pass, Cutoff around <strong>1 kHz<\/strong>, Resonance low. Add an <strong>LFO<\/strong>, sync off, around <strong>0.04 Hz<\/strong>, routed up to Cutoff with a small drag.","<strong>EQ+<\/strong>, high-pass at <strong>300 Hz<\/strong>.","<strong>Tool<\/strong> at the end. (LFO 3 in Part 5 goes on its Width.)","Send to <strong>REVERB LONG<\/strong> fairly high, around 40 to 50 percent."]}]},{"title":"Groups","blocks":[{"type":"p","indent":false,"html":"Groups let you process several tracks together, which the breakdown in Part 13 depends on."},{"type":"ol","start":1,"items":["Click the KICK track header, then hold Shift (or Ctrl/Cmd) and click HATS, PERC A, and PERC B.","Right-click one of the selected headers and choose <strong>Group<\/strong> (Ctrl+G on Windows, Cmd+G on Mac, if the shortcut works). Name the group <strong>DRUMS<\/strong>.","Do the same for CHORD, ATMOS, and SPARE. Name it <strong>MELODIC<\/strong>.","Effect tracks (RUMBLE, REVERB LONG, FILTERED DELAY) stay outside the groups.","On the DRUMS group track, add a <strong>Filter+<\/strong> set to <strong>high-pass<\/strong>, Cutoff all the way down so it does nothing yet. Part 13's breakdown automates this."]},{"type":"p","indent":false,"html":"<strong>One thing to know:<\/strong> sends leave each track <em>before<\/em> the group. So a filter on DRUMS doesn't affect what KICK sends to RUMBLE. Part 13.7 accounts for this. It's also why kick and rumble can't be soft-clipped together in this setup (Part 14.7 has the workaround)."}]}]},{"title":"Part 7: Hypnotic lead voice (phaser chain)","blocks":[{"type":"p","indent":false,"html":"<strong>Optional.<\/strong> Come back once the template is built and you want a lead or texture voice. For a lead built from a single percussion hit instead of a synth, see 12.14."},{"type":"p","indent":false,"html":"Translated from an Ableton tutorial. One sound-design chain: a harsh, moving source into a phaser used three ways, then stacked moving filters, then a tiny room. It goes on the SPARE track from Part 6, or replaces CHORD as a variation."}],"subs":[{"title":"The principle","blocks":[{"type":"p","indent":false,"html":"Hypnotic sounds play with psychoacoustics: phasing, Doppler-like pitch smear, and very small rooms that make a sound feel right next to your head. You need a harsh, harmonically rich source for this to work, because phasers and filters can only move harmonics that exist."}]},{"title":"Step 1: The source","blocks":[{"type":"p","indent":false,"html":"Take this step slowly. It introduces wavetables, and it's your first time putting a modulator inside a synth."},{"type":"h4","text":"What a wavetable is"},{"type":"p","indent":false,"html":"An ordinary oscillator plays one waveform: a sine, a saw, a square. Each has a fixed tone."},{"type":"p","indent":false,"html":"A <strong>wavetable<\/strong> is a stack of many waveforms in a row, like frames of a flipbook. Frame 1 might be soft and round, frame 64 harsh and buzzy, with gradual changes in between. The oscillator plays one frame at a time."},{"t
