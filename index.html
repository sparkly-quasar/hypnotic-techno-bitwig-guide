display format for a 7-sixteenth length"},{"type":"p","indent":true,"html":"How cue markers are added (right-click on the ruler is a guess; there may be a shortcut or a transport button)"},{"type":"p","indent":true,"html":"Whether Ctrl+G / Cmd+G groups selected tracks"},{"type":"p","indent":true,"html":"Whether individual clips can opt out of global groove"},{"type":"p","indent":true,"html":"Whether the per-note pitch lane in the note editor reads <strong>Pitch<\/strong> or <strong>Transpose<\/strong>"},{"type":"p","indent":true,"html":"Whether the Drum Machine has choke groups, and where the setting lives (Part 16.7)"},{"type":"p","indent":true,"html":"Whether global shuffle swings 16ths (the even steps) or can be set to 8ths; Part 16.7 assumes 16ths"},{"type":"h4","text":"Modulation and devices"},{"type":"p","indent":true,"html":"Whether Bitwig's \"pre\" on a sidechain source means pre-fader or pre-device-chain"},{"type":"p","indent":true,"html":"Whether removing a routing by double-clicking its amount still works in version 6 (right-click on the ring is the other place to look)"},{"type":"p","indent":true,"html":"The Steps modulator's exact controls: how bars are drawn, and whether the step count can be set to 7 directly"},{"type":"p","indent":true,"html":"The exact reverb parameter names, particularly the mix control"},{"type":"p","indent":true,"html":"The exact names of Delay+'s feedback control and its EQ knobs (the Ping mode and EQ section are visible on the device)"},{"type":"p","indent":true,"html":"The Arpeggiator's mode names, and whether one matches Ableton's \"play order\""},{"type":"p","indent":true,"html":"The exact on-screen label of Phaser+'s Manual Override toggle"},{"type":"p","indent":true,"html":"The exact label of Polymer's wavetable position knob (Index is the standard Bitwig name, but check for Position)"},{"type":"p","indent":true,"html":"Where <strong>Glide<\/strong> and mono voice settings live for Polymer (Inspector or device)"},{"type":"p","indent":true,"html":"Whether Bitwig's right-click menu offers wrapping a device in an Instrument Layer directly"},{"type":"p","indent":true,"html":"Whether Bitwig 6 has a native pitch-shift device for 12.13's FB FX slot, and its name (Freq Shifter is the fallback)"},{"type":"p","indent":true,"html":"Whether Delay+'s Feedback reaches a true infinite hold at maximum, and whether its built-in feedback level control keeps a 12.13 loop from running away"},{"type":"p","indent":true,"html":"Whether Delay+'s Time can be unsynced (in ms) so a Random modulator glides rather than jumps between note values"},{"type":"p","indent":true,"html":"What To-Da-Choppa is, exactly. From its controls (Modulator, Carrier, band count,"},{"type":"p","indent":true,"html":"Formant) it behaves like a vocoder; Part 12 treats it that way."},{"type":"h4","text":"One-hit lead (12.14)"},{"type":"p","indent":true,"html":"The exact name of the Sampler's 6.1 phase-modulation character and its amount control"},{"type":"p","indent":true,"html":"Resonator Bank's per-band controls (pitch in semitones or Hz, gain, Q or decay), and whether its key-track follows notes when placed on an instrument track after Sampler"},{"type":"p","indent":true,"html":"Whether Bitwig has a standalone <strong>Comb<\/strong> device or only a comb mode inside Filter+ or The Grid"},{"type":"p","indent":true,"html":"Whether Delay+ can be set short enough (a few ms) for the Karplus-Strong body; Delay-1 or an FX Grid delay are fallbacks"},{"type":"p","indent":true,"html":"Where <strong>Loud Split<\/strong> lives and how its bands are labelled"},{"type":"h4","text":"Rumble and theory (Parts 14 and 15)"},{"type":"p","indent":true,"html":"Whether an <strong>ADSR<\/strong> on an effect after the Sampler fires on the track's notes (Setup B's ducking)"},{"type":"p","indent":true,"html":"Whether a <strong>Chain<\/strong> container accepts an instrument like Sampler (Setup B falls back to an Instrument Layer)"},{"type":"p","indent":true,"html":"The <strong>Amp<\/strong> device's model names, and whether any match Ableton's Bass, Blues, or Boost"},{"type":"p","indent":true,"html":"Whether <strong>Delay-2<\/strong> has independent left and right times"},{"type":"p","indent":true,"html":"The Grid's exact module names for wavefolding, multiply (AM), and phase or FM inputs"},{"type":"h4","text":"Pattern library (Part 16)"},{"type":"p","indent":true,"html":"The TR-8S instrument names in 16.4 are read from small, blurry display text in screenshots"},{"type":"p","indent":true,"html":"How the TR-8S handles a closed and open hat on the same step (Pattern 3, step 15)"},{"type":"h4","text":"Arranging and performing"},{"type":"p","indent":true,"html":"The exact names and locations of the note operators (Chance, Repeat, Occurrence, Recurrence) in version 6"},{"type":"p","indent":true,"html":"How Remote Controls pages and MIDI mapping mode are reached"},{"type":"p","indent":true,"html":"The exact steps for recording a Clip Launcher performance into the Arrangement, and for writing automation live"},{"type":"p","indent":true,"html":"Whether <strong>Bounce in Place<\/strong> sits in the clip's right-click menu under that name"},{"type":"h4","text":"Mastering"},{"type":"p","indent":true,"html":"The Peak Limiter's exact parameter names. The user guide says only \"peak level, gain, and release controls\"; Ceiling is the name used in Bitwig's own training material. Whether it does true-peak detection is undocumented, so Part 11 assumes it does not."},{"type":"p","indent":true,"html":"The exact on-screen label of Over's Delta mode toggle"},{"type":"p","indent":true,"html":"Whether Tilt or EQ+ shelves is the better tool for broad master-bus tone in practice. Both will work; this is taste, not fact."},{"type":"p","indent":false,"html":"<strong>Resolved during the build:<\/strong> Compressor+'s Character chooser does exist, but displays its current value (Vanilla by default) rather than a \"Character\" label. Treemonster's controls (Threshold, detector low-pass and high-pass, Pitch, Speed, Ring, Mix) match Bitwig's user guide and the on-screen device. Delay+ has a Ping mode and an EQ section, visible on the device during the Rubby Wubby build."},{"type":"p","indent":false,"html":"Everything else in this guide was verified during the build, and Part 11's device descriptions came from Bitwig's published user guide."}],"subs":[]},{"title":"Sources","blocks":[{"type":"p","indent":true,"html":"Bitwig Studio User Guide, Audio FX and Modulators chapters: bitwig.com/userguide"},{"type":"p","indent":true,"html":"Ozgun, Lunatik Rave: Techno Rumble in 2 Minutes (New Method) (Part 14.4)"},{"type":"p","indent":true,"html":"The Producer School: How To Make Techno Rumble Kicks (2025) (Parts 2, 14.3, 14.5 to 14.7)"},{"type":"p","indent":true,"html":"Pick Yourself: The Hypnotic Techno Bass Pros Use Instead Of Rumble (Part 14.8)"},{"type":"p","indent":true,"html":"Pick Yourself: one-percussion-hit lead challenge (Ableton physical modeling with Resonators and Corpus), transcript supplied October 2026 (Part 12.14)"},{"type":"p","indent":true,"html":"Voltage Labs: The Art of Hypnotic Techno (Part 15)"},{"type":"p","indent":true,"html":"Polarity Music: Simple Long Looper in Bitwig (Part 12.13)"},{"type":"p","indent":true,"html":"Polarity Music: Resonance suppressor in Bitwig (Loud Split, Filter+ with Audio Sidechain) (Part 12.14)"},{"type":"p","indent":true,"html":"Sound On Sound: Bitwig Studio 6.1 enters beta testing (Sampler phase-modulation character, Part 12.14)"},{"type":"p","indent":true,"html":"r/Bitwig: FM modulate the Sampler? (modulating playback Speed as PM/FM, Part 12.14)"},{"type":"p","indent":true,"html":"KVR: Bitwig information thread (Resonator Bank key track and global controls, Part 12.14)"},{"type":"p","indent":true,"html":"Bitwig Studio 4.3 release notes (Delay+ FB FX chain, FX-track-to-FX-track sends): Gearspace thread (Part 12.13)"},{"type":"p","indent":true,"html":"Placiid (@placiidfr), Bordeaux: three Instagram reels programming techno patterns on a Roland TR-8S, captured as screenshots in October 2026 (Part 16)"}],"subs":[]},{"title":"Change log","blocks":[{"type":"p","indent":true,"html":"<strong>October 2026, one-hit lead:<\/strong> added 12.14 (a Pick Yourself challenge: a full lead from one percussion hit, rebuilt with Sampler phase modulation, Resonator Bank, a Comb or short-delay body in place of Corpus, a pitch-shifting Delay+, a texture return, and resonance taming). Added a Physical modeling glossary entry, eight rows to the 14.2 translation table, a troubleshooting entry, a Resonator route in 12.6, and links from the start-here table, Part 6 SPARE, Part 7, 12.8, 12.12, and 16.8. Added five uncertain labels and six sources."},{"type":"p","indent":true,"html":"<strong>October 2026, feedback looper:<\/strong> added 12.13 (an Ableton looper-in-a-looper trick rebuilt with Delay+ at full feedback, effects in its FB FX slot, and a Random modulator on delay time). Linked it from the start-here table, 12.3, 12.12, the 14.2 translation table, and Troubleshooting. Added three uncertain labels and two sources."},{"type":"p","indent":true,"html":"<strong>October 2026, pattern library:<\/strong> added Part 16 (three TR-8S patterns from Placiid's reels, step-number guide, what the patterns share, a skeptical read against the template, a track map, the drifting 4-7 cell, and the reels' arrangement moves in Bitwig). Added glossary entries for step, offbeat, backbeat, and choke group. Linked Part 16 from the start-here table, Part 3, 12.5, 12.7, 13.7, 14.6, and 14.8. Added TR-8S rows to the 14.2 translation table, two troubleshooting entries, and new uncertain labels."},{"type":"p","indent":true,"html":"<strong>October 2026, rumble consolidation:<\/strong> merged the separate \"Bitwig Rumble Kicks &amp; Hypnotic Techno Sound Design\" guide. Part 2's RUMBLE chain gained the post-filter EQ+, the optional 30 Hz high-pass, the kick length target, and the four-step tuning order. Added Part 14 (rumble methods, tutorial translation table, glue and resampling, sliding bassline, rumble character page) and Part 15 (sound design theory and the Grid patch). Added glossary entries for synthesis, mid/side, polymeter, and bouncing. Converted the rumble character table to lists. Added a Sources section. Fixed the SuperCollider sketch to play in both speakers."},{"type":"p","indent":true,"html":"<strong>October 2026, accessibility pass:<\/strong> added the start-here path, glossary, and Steps drill; built out the returns, SPARE, groups, CHORD, and ATMOS in Part 6; added how-to steps for loading samples, tuning the kick, velocities, odd loop lengths, cue markers, and automation; converted wide tables to lists; renumbered the arrangement to start at bar 1; fixed the breakdown so the rumble drops with the drums."},{"type":"p","indent":true,"html":"<strong>October 2026:<\/strong> Part 12 (sound palette, including the wub) and Part 13 (flow and composition) added. Part 11 (mastering) added and verified against Bitwig's user guide."},{"type":"p","indent":true,"html":"<strong>Earlier:<\/strong> kick, rumble, percussion, modulation tutorial, lead voice."}],"subs":[]}]}</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("guide-data").textContent);
  const $ = (s, el = document) => el.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("htg:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("htg:" + k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- Model ----------
  const STAGE_OF = { 0: 1, 4: 1, 1: 2, 2: 2, 3: 2, 16: 2, 5: 3, 6: 3, 10: 3, 7: 4, 8: 4, 12: 4, 13: 4, 14: 4, 15: 4, 9: 5, 11: 5 };
  const STAGE_NAMES = { 1: "Learn the moves", 2: "Build the core loop", 3: "Fill out the template", 4: "Make a track", 5: "Release" };
  const REF_IDS = { "how to use this guide": "how-to-use", "glossary": "glossary", "troubleshooting": "troubleshooting", "sources": "sources", "change log": "change-log" };

  const parts = DATA.parts.map((p, i) => {
    const m = p.title.match(/^Part (\d+):\s*(.*)$/);
    const num = m ? +m[1] : null;
    let id = m ? "part-" + num : (REF_IDS[p.title.toLowerCase()] || (/^labels/i.test(p.title) ? "uncertain-labels" : "sec-" + i));
    return {
      idx: i, id, num, title: m ? m[2] : p.title, full: p.title, blocks: p.blocks,
      ref: num == null,
      subs: p.subs.map((s, j) => {
        const sm = s.title.match(/^(\d+\.\d+)\s+(.*)$/);
        return { id: id + "-s" + (j + 1), code: sm ? sm[1] : null, title: sm ? sm[2] : s.title, full: s.title, blocks: s.blocks };
      })
    };
  });
  const byId = Object.fromEntries(parts.map(p => [p.id, p]));
  const subById = {}; const subByCode = {};
  parts.forEach(p => p.subs.forEach(s => { subById[s.id] = { part: p, sub: s }; if (s.code) subByCode[s.code] = s.id; }));
  const partByNum = Object.fromEntries(parts.filter(p => p.num != null).map(p => [p.num, p]));
  const guideParts = parts.filter(p => !p.ref).sort((a, b) => a.num - b.num);
  const refParts = parts.filter(p => p.ref && p.id !== "how-to-use");
  const order = guideParts.concat(refParts);

  let done = new Set(store.get("done", []));
  const saveDone = () => store.set("done", [...done]);

  // ---------- Rendering helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const strip = h => h.replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");

  // Turn "Part 14.4", "12.13", "Troubleshooting" into in-guide links, touching text only (never inside tags).
  function linkify(html) {
    return html.split(/(<[^>]+>)/).map(seg => {
      if (seg.startsWith("<")) return seg;
      seg = seg.replace(/\bPart (\d{1,2})(?:\.(\d{1,2}))?\b/g, (m, a, b) => {
        if (b && subByCode[a + "." + b]) return `<a class="xref" href="#${subByCode[a + "." + b]}">${m}</a>`;
        if (partByNum[a] && !b) return `<a class="xref" href="#${partByNum[a].id}">${m}</a>`;
        return m;
      });
      seg = seg.replace(/(^|[^\d.\-+\w>])(1[2-6]\.\d{1,2})(?![\d.]|\s?(?:dB|Hz|kHz|ms|%|BPM|LUFS|x\b))/g, (m, pre, code) =>
        subByCode[code] ? `${pre}<a class="xref" href="#${subByCode[code]}">${code}</a>` : m);
      seg = seg.replace(/\b(Troubleshooting|Glossary)\b/g, (m) => `<a class="xref" href="#${m.toLowerCase()}">${m}</a>`);
      return seg;
    }).join("")
      // a link nested inside another link (e.g. "Part 14.4" then "14.4") is undone here
      .replace(/(<a class="xref"[^>]*>[^<]*)<a class="xref"[^>]*>([^<]*)<\/a>/g, "$1$2");
  }
  const CK = /You should hear|you should hear/;
  function ck(html) { return CK.test(html) ? ' class="checkpoint"' : ""; }
  function ckTag(html) { return CK.test(html) ? '<span class="ck-tag">Checkpoint</span>' : ""; }

  function renderBlocks(blocks) {
    let out = ""; let i = 0;
    while (i < blocks.length) {
      const b = blocks[i];
      if (b.type === "p" && b.indent) {
        let items = "";
        while (i < blocks.length && blocks[i].type === "p" && blocks[i].indent) {
          const h = blocks[i].html; items += `<li${ck(h)}>${ckTag(h)}${linkify(h)}</li>`; i++;
        }
        out += `<ul class="sub">${items}</ul>`; continue;
      }
      if (b.type === "p") out += `<p${ck(b.html)}>${ckTag(b.html)}${linkify(b.html)}</p>`;
      else if (b.type === "h4") out += `<h4>${esc(b.text)}</h4>`;
      else if (b.type === "ol") out += `<ol start="${b.start}">` + b.items.map(h => `<li${ck(h)}>${ckTag(h)}${linkify(h)}</li>`).join("") + `</ol>`;
      else if (b.type === "pre") out += `<pre>${esc(b.text)}</pre>`;
      else if (b.type === "table") {
        const rows = b.rows.filter(r => r.some(c => strip(c).trim())).map((r, ri) => {
          const tag = (b.header && ri === 0) ? "th" : "td";
          return "<tr>" + r.map(c => `<${tag}>${linkify(c)}</${tag}>`).join("") + "</tr>";
        });
        out += `<div class="tablewrap"><table>${b.header ? "<thead>" + rows.shift() + "</thead>" : ""}<tbody>${rows.join("")}</tbody></table></div>`;
      }
      i++;
    }
    return out;
  }

  const caret = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';
  const label = p => p.num != null ? `Part ${p.num}` : "Reference";

  // ---------- Sidebar ----------
  function renderSide(activePart, activeSub) {
    const item = p => {
      const on = activePart && p.id === activePart.id;
      let h = `<button class="nav-part${on ? " active" : ""}" data-go="${p.id}"><span class="num">${p.num != null ? p.num : ""}</span><span class="led${done.has(p.id) ? " done" : ""}"></span><span class="lbl">${esc(p.title)}</span></button>`;
      if (on && p.subs.length) {
        h += `<ul class="nav-subs">` + p.subs.map(s => `<li><button data-go="${s.id}"${activeSub === s.id ? ' class="active"' : ""}>${s.code ? `<span style="font-family:var(--font-mono);font-size:12px">${s.code}</span> ` : ""}${esc(s.title)}</button></li>`).join("") + `</ul>`;
      }
      return h;
    };
    $("#side").innerHTML =
      `<button class="nav-part${!activePart ? " active" : ""}" data-go="home"><span class="num"></span><span class="led"></span><span class="lbl">Start here: learning path</span></button>` +
      `<h2>The guide</h2>` + guideParts.map(item).join("") +
      `<h2>Use any time</h2>` + refParts.map(item).join("");
  }

  function renderSteps(activePart) {
    let el = $("#steps");
    if (!el) { el = document.createElement("div"); el.id = "steps"; el.className = "steps"; }
    el.innerHTML = guideParts.map(p => `<button data-go="${p.id}" title="Part ${p.num}: ${esc(p.title)}${done.has(p.id) ? " (done)" : ""}" aria-label="Part ${p.num}" class="${done.has(p.id) ? "done" : ""}${activePart && activePart.id === p.id ? " here" : ""}"></button>`).join("");
    return el;
  }

  // ---------- Views ----------
  function homeView() {
    const intro = DATA.intro;
    const lede = intro.find(b => b.type === "p");
    const status = intro.filter(b => b.type === "p" && /Where things stand|Checkpoints|Use any time/.test(b.html));
    const howTo = byId["how-to-use"];
    const table = howTo && howTo.blocks.find(b => b.type === "table");
    const last = store.get("last", null);
    const lastP = last && (byId[last] || (subById[last] && subById[last].part));
    let stages = "";
    if (table) {
      stages = table.rows.slice(table.header ? 1 : 0).map(r => {
        const n = (strip(r[0]).match(/^(\d+)/) || [])[1];
        const name = strip(r[0]).replace(/^\d+\.\s*/, "");
        const inStage = guideParts.filter(p => String(STAGE_OF[p.num]) === n);
        const meter = inStage.map(p => `<i class="${done.has(p.id) ? "on" : ""}" title="Part ${p.num}"></i>`).join("");
        return `<div class="stage"><div class="n">${n}</div><div><h3>${esc(name)}</h3><div class="do prose">${linkify(r[1])}</div><div class="meter">${meter}</div></div><div class="time">${esc(strip(r[2]))}</div></div>`;
      }).join("");
    }
    const cards = guideParts.map(p => `<button class="card" data-go="${p.id}"><span class="num"><span>PART ${p.num}${STAGE_OF[p.num] ? " · STAGE " + STAGE_OF[p.num] : ""}</span><span class="led${done.has(p.id) ? " done" : ""}"></span></span><b>${esc(p.title)}</b><small>${p.subs.length ? p.subs.length + " sections" : "Single page"}</small></button>`).join("");
    const refCards = refParts.map(p => `<button class="card" data-go="${p.id}"><span class="num"><span>REFERENCE</span></span><b>${esc(p.title)}</b><small>${refBlurb(p)}</small></button>`).join("");
    const page = $("#page");
    page.innerHTML = `
      <div class="eyebrow">BITWIG · 132 BPM · ONE MINOR KEY</div>
      <h1>${esc(DATA.title)}</h1>
      <p class="lede">${lede ? linkify(lede.html) : ""}</p>
      <div class="status prose">${status.map(b => `<p>${linkify(b.html)}</p>`).join("")}</div>
      <div class="home-actions">
        ${lastP ? `<button class="btn" data-go="${last}">Continue: ${esc(label(lastP))} · ${esc(lastP.title)}</button>` : `<button class="btn" data-go="part-0">Start with Part 0</button>`}
        <button class="btn ghost" data-go="troubleshooting">Something's wrong: Troubleshooting</button>
      </div>
      <h2 class="section">Learning path</h2>
      <p class="section-note">Parts are numbered by where they sit in the template, not the order to learn them. Follow these stages instead. The bars fill as you mark parts done.</p>
      <div class="path">${stages}</div>
      <h2 class="section">All parts</h2>
      <div class="grid">${cards}</div>
      <h2 class="section">Use any time</h2>
      <div class="grid">${refCards}</div>
      <h2 class="section">Keys</h2>
      <div class="keys"><span><kbd>/</kbd> search</span><span><kbd>g</kbd> glossary</span><span><kbd>←</kbd> <kbd>→</kbd> previous / next part</span><span><kbd>e</kbd> expand or collapse all sections</span><span><kbd>d</kbd> mark part done</span><span><kbd>h</kbd> home</span></div>`;
    page.prepend(renderSteps(null));
    renderSide(null, null);
    document.title = "Hypnotic Techno Navigator";
  }
  function refBlurb(p) {
    return { "glossary": "Plain-language definitions, filterable", "troubleshooting": "Things that went wrong, and why", "uncertain-labels": "Bitwig 6 labels to double-check", "sources": "Tutorials, reels and manuals", "change-log": "What changed in each revision" }[p.id] || "";
  }

  let currentPart = null;
  function partView(p, subId, highlight) {
    currentPart = p;
    const pos = order.indexOf(p);
    const prev = order[pos - 1], next = order[pos + 1];
    const stage = STAGE_OF[p.num];
    const filterable = ["glossary", "troubleshooting", "uncertain-labels", "sources", "change-log"].includes(p.id);
    const openAll = store.get("openAll", false);
    let subs = "";
    if (p.subs.length) {
      subs = p.subs.map(s => {
        const n = s.blocks.length;
        const open = openAll || s.id === subId;
        return `<details class="sub" id="${s.id}"${open ? " open" : ""}><summary>${caret}<span class="t">${s.code ? `<span class="eyebrow" style="margin-right:8px">${s.code}</span>` : ""}${esc(s.title)}</span>${s.blocks.some(b => CK.test(b.html || (b.items || []).join(""))) ? '<span class="chip done" style="padding:1px 8px;font-size:11px">checkpoint</span>' : ""}<span class="count">${n} ${n === 1 ? "block" : "blocks"}</span></summary><div class="body prose">${renderBlocks(s.blocks)}</div></details>`;
      }).join("");
    }
    const page = $("#page");
    page.innerHTML = `
      <div class="eyebrow">${p.num != null ? "PART " + p.num : "REFERENCE"}</div>
      <h1>${esc(p.title)}</h1>
      <div class="page-head">
        ${stage ? `<a class="chip stagechip" href="#home" title="Back to the learning path">Stage ${stage}: ${STAGE_NAMES[stage]}</a>` : ""}
        ${p.num != null ? `<button class="chip${done.has(p.id) ? " done" : ""}" id="doneBtn" aria-pressed="${done.has(p.id)}">${done.has(p.id) ? "✓ Done" : "Mark part done"}</button>` : ""}
      </div>
      ${filterable ? `<div class="toolbar"><input class="filter" id="secFilter" type="search" placeholder="Filter ${esc(p.title.toLowerCase())}" autocomplete="off" aria-label="Filter this section"><span class="filter-count" id="filterCount"></span></div>` : ""}
      <div class="prose" id="partBody">${renderBlocks(p.blocks)}</div>
      ${p.subs.length ? `
        <div class="toolbar"><b style="font-family:var(--font-display);font-stretch:85%">${p.subs.length} sections</b><span class="spacer"></span><button class="chip" id="toggleAll">${openAll ? "Collapse all" : "Expand all"}</button></div>
        <div class="jump">${p.subs.map(s => `<button data-go="${s.id}">${s.code ? s.code + " " : ""}${esc(s.title)}</button>`).join("")}</div>
        ${subs}` : ""}
      <div class="pager">
        ${prev ? `<button class="prev" data-go="${prev.id}"><small>← ${esc(label(prev))}</small><span>${esc(prev.title)}</span></button>` : ""}
        ${next ? `<button class="next" data-go="${next.id}"><small>${esc(label(next))} →</small><span>${esc(next.title)}</span></button>` : ""}
      </div>`;
    page.prepend(renderSteps(p));
    renderSide(p, subId);
    document.title = (p.num != null ? `Part ${p.num}: ` : "") + p.title + " · Hypnotic Techno Navigator";
    if (filterable) setupFilter();
    if (highlight) markText(page, highlight);
    requestAnimationFrame(() => {
      const target = subId ? document.getElementById(subId) : (highlight ? page.querySelector("mark") : null);
      if (target) {
        const t = target.closest("details") || target;
        t.scrollIntoView({ block: "start" });
        if (target.tagName === "MARK") target.scrollIntoView({ block: "center" });
      } else window.scrollTo(0, 0);
    });
    store.set("last", subId || p.id);
  }

  function setupFilter() {
    const input = $("#secFilter"), body = $("#partBody"), count = $("#filterCount");
    const items = [...body.querySelectorAll(":scope > p, :scope > ul.sub > li, :scope > h4, :scope > ol > li")];
    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      items.forEach(el => {
        if (el.tagName === "H4") return;
        const hit = !q || el.textContent.toLowerCase().includes(q);
        el.hidden = !hit; if (hit) shown++;
      });
      // hide category headings with nothing visible under them
      items.filter(el => el.tagName === "H4").forEach(h => {
        let sib = h.nextElementSibling, any = false;
        while (sib && sib.tagName !== "H4") { if (sib.matches("ul") ? [...sib.children].some(li => !li.hidden) : !sib.hidden) any = true; sib = sib.nextElementSibling; }
        h.hidden = q && !any;
      });
      body.querySelectorAll("ul.sub").forEach(ul => ul.hidden = ![...ul.children].some(li => !li.hidden));
      count.textContent = q ? `${shown} match${shown === 1 ? "" : "es"}` : "";
      body.querySelectorAll("mark").forEach(m => m.replaceWith(m.textContent));
      body.normalize();
      if (q.length > 1) markText(body, q);
    });
  }

  function markText(root, q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest("summary,script,.eyebrow,.pager,.jump,.steps") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      if (!re.test(n.data)) return; re.lastIndex = 0;
      const frag = document.createDocumentFragment(); let last = 0;
      n.data.replace(re, (m, idx) => { frag.append(n.data.slice(last, idx)); const mk = document.createElement("mark"); mk.textContent = m; frag.append(mk); last = idx + m.length; });
      frag.append(n.data.slice(last)); n.replaceWith(frag);
      // open any folded section that contains a hit
      const d = frag.parentElement;
    });
    root.querySelectorAll("mark").forEach(m => { const d = m.closest("details"); if (d) d.open = true; });
  }

  // ---------- Routing ----------
  let pendingHighlight = null;
  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    closeSide();
    if (!h || h === "home") { currentPart = null; homeView(); window.scrollTo(0, 0); return; }
    const hl = pendingHighlight; pendingHighlight = null;
    if (byId[h]) return partView(byId[h], null, hl);
    if (subById[h]) return partView(subById[h].part, h, hl);
    homeView();
  }
  function go(id, highlight) {
    pendingHighlight = highlight || null;
    if (location.hash === "#" + id) route(); else location.hash = id;
  }
  window.addEventListener("hashchange", route);

  // ---------- Search ----------
  const index = [];
  parts.forEach(p => {
    if (p.blocks.length) index.push({ id: p.id, where: (p.num != null ? `Part ${p.num}` : "Reference"), title: p.title, text: blocksText(p.blocks) });
    p.subs.forEach(s => index.push({ id: s.id, where: (p.num != null ? `Part ${p.num}` : "Reference") + (s.code ? " · " + s.code : ""), title: s.title, text: blocksText(s.blocks) }));
  });
  function blocksText(bs) { return bs.map(b => b.html ? strip(b.html) : b.text ? b.text : b.items ? b.items.map(strip).join(" ") : b.rows ? b.rows.map(r => r.map(strip).join(" ")).join(" ") : "").join(" \n "); }

  const q = $("#q"), results = $("#results");
  let sel = 0, hits = [];
  function search() {
    const term = q.value.trim();
    if (term.length < 2) { results.hidden = true; return; }
    const t = term.toLowerCase();
    const code = subByCode[term] || (byId["part-" + term.replace(/^part\s*/i, "")] && /^(part\s*)?\d{1,2}$/i.test(term) ? "part-" + term.replace(/^part\s*/i, "") : null);
    hits = [];
    if (code) { const s = subById[code]; const p = byId[code]; hits.push({ id: code, where: s ? `Part ${s.part.num} · ${s.sub.code}` : `Part ${p.num}`, title: s ? s.sub.title : p.title, snip: "Jump straight there", n: 99, direct: true }); }
    index.forEach(e => {
      const inTitle = e.title.toLowerCase().includes(t);
      const lower = e.text.toLowerCase();
      let n = 0, pos = lower.indexOf(t), first = pos;
      while (pos !== -1) { n++; pos = lower.indexOf(t, pos + t.length); }
      if (!n && !inTitle) return;
      let snip = "";
      if (first !== -1) {
        const a = Math.max(0, first - 50), b = Math.min(e.text.length, first + t.length + 70);
        snip = (a ? "…" : "") + esc(e.text.slice(a, first)) + "<mark>" + esc(e.text.slice(first, first + t.length)) + "</mark>" + esc(e.text.slice(first + t.length, b)) + (b < e.text.length ? "…" : "");
      }
      hits.push({ id: e.id, where: e.where, title: e.title, snip, count: n, n: n + (inTitle ? 20 : 0) });
    });
    hits.sort((a, b) => b.n - a.n);
    hits = hits.slice(0, 40); sel = 0;
    results.innerHTML = hits.length ? hits.map((h, i) => `<button data-i="${i}" class="${i === 0 ? "sel" : ""}"><span class="where">${esc(h.where)}</span> <b>${esc(h.title)}</b>${h.direct ? "" : (h.count ? ` <span class="where" style="color:var(--muted)">· ${h.count} hit${h.count === 1 ? "" : "s"}</span>` : "")}<span class="snip">${h.snip}</span></button>`).join("") : `<div class="none">No matches for “${esc(term)}”. Try a device name (Filter+, Tool, Delay+) or a part number like 14.4.</div>`;
    results.hidden = false;
  }
  function pick(i) {
    const h = hits[i]; if (!h) return;
    results.hidden = true; const term = q.value.trim(); q.blur();
    go(h.id, h.direct ? null : term);
  }
  q.addEventListener("input", search);
  q.addEventListener("focus", search);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!hits.length) return;
      sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length;
      results.querySelectorAll("button").forEach((b, i) => b.classList.toggle("sel", i === sel));
      results.querySelectorAll("button")[sel].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
    else if (e.key === "Escape") { results.hidden = true; q.blur(); }
  });
  results.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) pick(+b.dataset.i); });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) results.hidden = true; });

  // ---------- Glossary drawer ----------
  const gl = byId["glossary"];
  function renderGloss(term) {
    const t = (term || "").trim().toLowerCase();
    let html = "", cat = "";
    (gl ? gl.blocks : []).forEach(b => {
      if (b.type === "h4") { cat = b.text; return; }
      if (b.type !== "p" || !b.indent) return;
      if (t && !strip(b.html).toLowerCase().includes(t)) return;
      if (cat) { html += `<div class="gl-cat">${esc(cat)}</div>`; cat = ""; }
      html += `<div class="gl-item prose">${linkify(b.html)}</div>`;
    });
    $("#glList").innerHTML = html || `<p class="section-note">No glossary entry mentions “${esc(term)}”. Try the main search for more.</p>`;
  }
  function openGloss() { $("#drawer").hidden = false; $("#scrim").hidden = false; renderGloss($("#glq").value); setTimeout(() => $("#glq").focus(), 0); }
  function closeGloss() { $("#drawer").hidden = true; if (!$("#side").classList.contains("open")) $("#scrim").hidden = true; }
  $("#glossBtn").addEventListener("click", openGloss);
  $("#drawerClose").addEventListener("click", closeGloss);
  $("#glq").addEventListener("input", e => renderGloss(e.target.value));
  $("#glList").addEventListener("click", e => { if (e.target.closest("a.xref")) closeGloss(); });

  // ---------- Sidebar (mobile) ----------
  function closeSide() { $("#side").classList.remove("open"); if ($("#drawer").hidden) $("#scrim").hidden = true; }
  $("#menuBtn").addEventListener("click", () => { $("#side").classList.add("open"); $("#scrim").hidden = false; });
  $("#scrim").addEventListener("click", () => { closeSide(); closeGloss(); });

  // ---------- Theme ----------
  const savedTheme = store.get("theme", null);
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  $("#themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nextT = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nextT); store.set("theme", nextT);
  });

  // ---------- Global clicks & keys ----------
  function toggleDone() {
    if (!currentPart || currentPart.num == null) return;
    const id = currentPart.id;
    done.has(id) ? done.delete(id) : done.add(id); saveDone();
    const btn = $("#doneBtn");
    btn.classList.toggle("done", done.has(id)); btn.textContent = done.has(id) ? "✓ Done" : "Mark part done"; btn.setAttribute("aria-pressed", done.has(id));
    $("#page").replaceChild(renderSteps(currentPart), $("#steps"));
    renderSide(currentPart, null);
  }
  function toggleAll() {
    const all = [...document.querySelectorAll("details.sub")]; if (!all.length) return;
    const open = !all.every(d => d.open);
    all.forEach(d => d.open = open); store.set("openAll", open);
    const b = $("#toggleAll"); if (b) b.textContent = open ? "Collapse all" : "Expand all";
  }
  document.addEventListener("click", e => {
    const g = e.target.closest("[data-go]");
    if (g) { e.preventDefault(); go(g.dataset.go); return; }
    if (e.target.closest("#doneBtn")) toggleDone();
    if (e.target.closest("#toggleAll")) toggleAll();
  });
  // Opening a section from its summary updates the sidebar highlight without a page re-render
  document.addEventListener("toggle", e => {
    const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.open || !currentPart) return;
    document.querySelectorAll(".nav-subs button").forEach(b => b.classList.toggle("active", b.dataset.go === d.id));
    store.set("last", d.id);
  }, true);
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); q.focus(); q.select(); }
    else if (e.key === "g") { e.preventDefault(); $("#drawer").hidden ? openGloss() : closeGloss(); }
    else if (e.key === "Escape") { closeGloss(); closeSide(); }
    else if (e.key === "h") go("home");
    else if (e.key === "e") toggleAll();
    else if (e.key === "d") toggleDone();
    else if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && currentPart) {
      const pos = order.indexOf(currentPart); const t = order[pos + (e.key === "ArrowRight" ? 1 : -1)];
      if (t) go(t.id);
    }
  });

  route();
})();
</script>

</body>
</html>
