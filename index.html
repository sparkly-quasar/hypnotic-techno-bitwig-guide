er, put a pitch shifter in a feedback loop before it; for real rooms, use <strong>Convolution<\/strong>.","<strong>EQ+<\/strong> high-pass at <strong>300 Hz<\/strong>."]},{"type":"p","indent":false,"html":"Bring the send up until the lead has a halo, then back off."},{"type":"h4","text":"Step 7: Tame the resonances"},{"type":"p","indent":false,"html":"Resonators pile energy onto a few frequencies, and one note will often jump out or whistle."},{"type":"ol","start":1,"items":["Watch <strong>EQ+<\/strong>'s spectrum while it plays. The culprits are the tall, narrow spikes.","<strong>Notch them<\/strong>: narrow cuts of a few dB. Don't go deep; over-notching removes the character you built.","<strong>Dynamic option<\/strong> (the video's spectral mode): use <strong>Loud Split<\/strong> to tame only the loudest part of the spectrum, or a <strong>Filter+<\/strong> band with an <strong>Audio Sidechain<\/strong> modulator so the cut only happens when that frequency spikes. Polarity's tutorial in Sources shows both.","Or lower that band's gain or Q in Resonator Bank, which fixes it at the source."]},{"type":"h4","text":"Step 8: Play upstream"},{"type":"p","indent":false,"html":"The video's key point: physical modeling reacts to everything before it. Once it sounds good, change the source and listen to the whole voice transform:"},{"type":"p","indent":true,"html":"Swap the click for a rim, shaker, or woodblock."},{"type":"p","indent":true,"html":"Raise or lower the phase mod amount."},{"type":"p","indent":true,"html":"Change the Arpeggiator rate or the clip's loop length."},{"type":"p","indent":false,"html":"Then rebalance the resonators, because they will ring differently."},{"type":"h4","text":"A skeptical read"},{"type":"p","indent":true,"html":"<strong>\"Sounds you can't get from traditional synthesis\"<\/strong> is a video hook. Under the hood this is resonant filtering of an impulse, which a synth with good filters can approximate. The real value is the <strong>constraint<\/strong>: one sample forces you into devices you'd otherwise skip."},{"type":"p","indent":true,"html":"<strong>Consonant bands can get cheesy fast.<\/strong> Root, fifth, octave on every hit is very \"pretty.\" Detune one band a few cents off the scale, per Part 15.2's between-the-keys idea, and check whether it stays more hypnotic."},{"type":"p","indent":true,"html":"<strong>It's bright and busy.<\/strong> A full lead runs against the template's \"change is scarce\" rule (13.1). Use it sparingly, or resample a few bars (12.11) and use slices as a recurring motif."},{"type":"h4","text":"Feedback warning"},{"type":"p","indent":false,"html":"Resonator Bank, a high-feedback comb or short delay, and a pitch-shifting delay are three resonant loops in one chain. Turn monitoring down before raising Q or feedback. If it rings on after you stop, see \"Sound keeps playing after I stop\" in Troubleshooting."},{"type":"h4","text":"Where it sits"},{"type":"p","indent":true,"html":"<strong>EQ+<\/strong> high-pass at <strong>300 to 500 Hz<\/strong>; a gentle high shelf down from <strong>7 to 8 kHz<\/strong> so hats stay clear."},{"type":"p","indent":true,"html":"Kick-triggered <strong>Tool<\/strong> ducking from Part 7, Step 6."},{"type":"p","indent":true,"html":"Enters around bar <strong>97 or 129<\/strong> (Part 8), in place of or alongside the chord stab. Bring it in with its filter or its Resonator Bank Mix, not its fader."}]}]},{"title":"Part 13: Flow and composition","blocks":[{"type":"p","indent":false,"html":"Part 8 tells you <em>when<\/em> things happen. This part is about <em>how<\/em> it should feel, and how to get from a good loop to a finished eight minutes."}],"subs":[{"title":"13.1 What hypnotic composition is doing","blocks":[{"type":"p","indent":false,"html":"Most music holds attention with events: a drop, a new section, a hook. Hypnotic techno holds attention by <strong>taking events away<\/strong> and making the listener's ear do the work. Repetition settles them in; tiny, constant variation keeps them from tuning out. The goal is that someone loses track of where they are in the track without ever feeling that it stopped moving."},{"type":"p","indent":false,"html":"Two consequences:"},{"type":"p","indent":true,"html":"<strong>The loop is the composition.<\/strong> If the core loop can't hold you for two minutes hands-off (Part 3's \"sit with it\" test), no arrangement will save it."},{"type":"p","indent":true,"html":"<strong>Change is a scarce resource.<\/strong> Every change you make spends some of the listener's trust. Spend it slowly."},{"type":"p","indent":false,"html":"Part 15 covers the same idea from the sound design side: relationships between sounds, rather than the sounds themselves, carry the hypnotic effect."}]},{"title":"13.2 Three time scales","blocks":[{"type":"p","indent":false,"html":"Think of motion at three speeds and give each one its own tools."},{"type":"h4","text":"Micro: per hit, per bar"},{"type":"p","indent":true,"html":"What changes: velocity, tiny timing and level variation, which notes play"},{"type":"p","indent":true,"html":"Tools: velocity variation, Random modulator, note Chance (13.5), groove"},{"type":"h4","text":"Meso: 8 to 32 bars"},{"type":"p","indent":true,"html":"What changes: filter positions, loop relationships, which element is in front"},{"type":"p","indent":true,"html":"Tools: odd loop lengths, slow LFOs (Part 5), Steps, sends"},{"type":"h4","text":"Macro: the whole track"},{"type":"p","indent":true,"html":"What changes: overall density, brightness, space, energy"},{"type":"p","indent":true,"html":"Tools: arrangement automation, group filters, element entries and exits"},{"type":"p","indent":false,"html":"If a track feels static, one of the three scales is empty. If it feels busy, usually too much is happening at the meso scale."}]},{"title":"13.3 The energy dials (no drops needed)","blocks":[{"type":"p","indent":false,"html":"Energy in this genre is not about volume. These are the dials you turn instead, roughly in order of how often to reach for them."},{"type":"table","rows":[["","",""],["","",""],["","",""],["<strong>Dial<\/strong>","<strong>Up means<\/strong>","<strong>How in Bitwig<\/strong>"],["<strong>Brightness<\/strong>","Filters open, more top end","Filter+ cutoff automation on groups or elements"],["<strong>Density<\/strong>","More elements, more notes","Element entries; note Chance raised"],["<strong>Space<\/strong>","More reverb and delay, sounds further away","Send automation to REVERB LONG and FILTERED DELAY"],["<strong>Width<\/strong>","Wider stereo image","Tool Width on non-bass elements"],["<strong>Rhythmic complexity<\/strong>","More overlapping loop lengths","Bringing in odd-length elements (Perc A, Perc B, toms)"],["<strong>Low-end weight<\/strong>","Fuller, grittier rumble","The rumble character knobs (Part 14.9), very gently"]],"header":false},{"type":"p","indent":false,"html":"A peak is several dials up at once. A breakdown is one or two dials down while the others hold. Moving <strong>one dial at a time<\/strong> is the default; moving two together is an event."},{"type":"p","indent":false,"html":"<strong>Automating a dial,<\/strong> the basic move: in the Arrangement, show the track's automation lane, choose the parameter, and draw points. Or record it: enable automation write and turn the knob while the track plays. Either way, Bitwig 6's automation editing tools let you smooth the result afterwards."}]},{"title":"13.4 How to make a change","blocks":[{"type":"p","indent":true,"html":"<strong>Fade with filters, not faders.<\/strong> An element entering via a slowly opening filter feels like it was always there and you just noticed it. A fader fade-in sounds like someone turned it up."},{"type":"p","indent":true,"html":"<strong>One change per 16 to 32 bars.<\/strong> Part 8's rule. If two things need to happen close together, overlap them, so one is settling while the other begins."},{"type":"p","indent":true,"html":"<strong>Not always on bar 1 of a phrase.<\/strong> Most changes should land on 16- or 32-bar boundaries for mixability, but a slow filter move that begins mid-phrase and lands on the boundary feels far more natural than a switch."},{"type":"p","indent":true,"html":"<strong>Subtraction counts.<\/strong> Removing the hats for 8 bars is as strong as adding a new element, and costs nothing in density."},{"type":"p","indent":true,"html":"<strong>Let things run.<\/strong> At least once in the track, let the full groove play for 32 to 64 bars with no structural change at all. The micro and meso motion will carry it, and that unbroken stretch is often where the trance state actually happens."}]},{"title":"13.5 Variation without writing more notes","blocks":[{"type":"p","indent":false,"html":"Most variation should come from the system, not from you writing new parts."},{"type":"p","indent":true,"html":"<strong>Odd loop lengths.<\/strong> Part 3's 3-bar Perc A against 4-bar loops, 7-step Perc B, 5- or 7- step toms. Different lengths drift against each other for free."},{"type":"p","indent":true,"html":"<strong>Note Chance.<\/strong> Bitwig notes have per-note settings called operators. <strong>Chance<\/strong> sets the probability a note plays each pass. Put a few ghost hits on a percussion clip at 30 to 50 percent and the pattern never repeats exactly. To find it: open the clip, select a note, and look in the Inspector on the left for the note's operator settings."},{"type":"p","indent":true,"html":"<strong>Recurrence and Occurrence.<\/strong> Other note operators that let a note play only on certain passes of the loop, for example only every fourth time round. Good for a fill or accent that shows up occasionally without being written into a separate clip."},{"type":"p","indent":true,"html":"<strong>Repeat.<\/strong> Turns one note into a quick ratchet. Use on a single hat or perc hit, sparingly."},{"type":"p","indent":true,"html":"<strong>Rhythmic displacement.<\/strong> Copy a bar and shift its notes one 16th later (Part 14.8 uses this on the bassline)."},{"type":"p","indent":true,"html":"<strong>Slow modulators.<\/strong> The Part 5 checklist exists for exactly this."},{"type":"p","indent":true,"html":"<strong>Steps with odd step counts<\/strong> on filter or pitch (Drill 5)."}]},{"title":"13.6 A workflow from loop to track","blocks":[{"type":"ol","start":1,"items":["<strong>Build the loop<\/strong> in the Clip Launcher. Kick, rumble, hats, Perc A first. Pass the two-minute test.","<strong>Build the palette.<\/strong> Add the other elements (Parts 6, 12, and 14) as clips, each one able to sit in the loop on its own.","<strong>Pick your dials.<\/strong> Choose six to eight controls from 13.3: the DRUMS group filter, a MELODIC group filter, the REVERB LONG and FILTERED DELAY sends, an element or two's filters, the rumble character page (14.9). If you have a MIDI controller, map them to its knobs using Bitwig's mapping mode. If not, gather them on a Remote Controls page so they're in one place.","<strong>Perform a pass.<\/strong> Switch to the Arrangement, start recording, and launch clips from the Clip Launcher while riding the dials. Go for 10 to 15 minutes, longer than the finished track. Don't stop when you make mistakes.","<strong>Edit by subtraction.<\/strong> Keep the best eight minutes. Delete the moments where you were fiddling. Make sure the first and last 32 bars are kick, rumble, and hats only, so a DJ can mix it.","<strong>Clean up automation.<\/strong> Smooth jerky knob moves into deliberate lines.","<strong>Check against Part 8.<\/strong> Use the table as a checklist, not a script. If your performance found a better shape, keep yours."]},{"type":"p","indent":false,"html":"Performing is faster than drawing every change by hand, and it captures the kind of slight irregularity in timing that makes changes feel human."},{"type":"p","indent":false,"html":"<strong>If performing feels like too much at first,<\/strong> skip steps 3 and 4: drag clips from the Clip Launcher into the Arrangement following Part 8's table, then draw the automation by hand. Slower, but nothing to coordinate in real time."}]},{"title":"13.7 The breakdown without a drop","blocks":[{"type":"p","indent":false,"html":"At bar 193, Part 8 calls for a drum bus filter sweep rather than a removal. One way to do it:"},{"type":"ol","start":1,"items":["Over 8 to 16 bars, automate the high-pass <strong>Filter+ on the DRUMS group<\/strong> (Part 6) up to around <strong>300 to 600 Hz<\/strong>. The kick thins to a click.","<strong>Bring the rumble down with it.<\/strong> The rumble is fed by KICK's send, which leaves before the group, so the group filter doesn't touch it. Automate the RUMBLE track's fader down over the same bars. Do the same for any other low-end layer from Part 14.","At the same time, raise the reverb send on the melodic tracks a little, so the space opens as the floor drops away.","Hold there for 8 to 16 bars. This is the tension.","Return the filter and the RUMBLE fader in <strong>one bar or less<\/strong>, on a phrase boundary. The kick coming back at full weight is the release."]},{"type":"p","indent":false,"html":"Keep the held section short. Withholding the kick for longer than about 16 bars loses a dancefloor."},{"type":"p","indent":false,"html":"Part 16.9 has the blunter version from the TR-8S reels: cut the kick outright and wash the rest in delay or reverb."}]},{"title":"13.8 Harmony","blocks":[{"type":"p","indent":false,"html":"One key, one chord, entire track (Part 1). Harmonic interest comes from <strong>tone and texture<\/strong>, not chord changes: filter movement on the chord, the delay's filtered repeats, wavetable morphing, a drone's fifth fading in. If you want a sense of harmonic movement, change one note of the chord for 8 bars and come back, or bring in a drone on the fifth. Anything more starts pulling the track toward a different genre."},{"type":"p","indent":false,"html":"The exception worth knowing is the low end: a bassline that slides between notes, or stops between semitones, creates tension without changing the chord (Part 14.8)."}]},{"title":"13.9 Listening checks for flow","blocks":[{"type":"p","indent":true,"html":"<strong>Walk-away test.<\/strong> Play the full track while doing something else. Note the moments that pull your attention back. Each one is either a highlight or a mistake; decide which."},{"type":"p","indent":true,"html":"<strong>Background test.<\/strong> Play it quietly. A good hypnotic track still feels like it's moving at low volume."},{"type":"p","indent":true,"html":"<strong>\"Where am I\" test.<\/strong> Stop at a random point and guess the bar. If you're usually right, the structure is too obvious."},{"type":"p","indent":true,"html":"<strong>DJ test.<\/strong> Mix the intro into a reference track and the outro out of one. The first and last 32 bars should be plain enough to blend."},{"type":"p","indent":true,"html":"<strong>Fresh ears.<\/strong> Listen the next day before changing anything. Most over-arranging happens late at night."}]},{"title":"13.10 Common failure modes","blocks":[{"type":"table","rows":[["<strong>Symptom<\/strong>","<strong>Likely cause<\/strong>"],["Boring after two minutes","The loop isn't strong enough, or all loop lengths are aligned"],["Restless, never settles","Changes every 8 bars, or several dials moving at once"],["Feels like a list of sections","Changes are switches rather than filter fades, all on bar 1"],["Flat over eight minutes","No macro shape: no clear peak, no breakdown"],["Muddy at the peak","Too many elements in 300 Hz to 2 kHz. See the 12.12 map."],["Obvious LFOs","Modulation amounts too large; you can point at them (Part 5's check)"]],"header":true}]}]},{"title":"Part 14: Rumble and low end","blocks":[{"type":"p","indent":false,"html":"Translated from three video tutorials (Lunatik Rave, The Producer School, Pick Yourself; see Sources). Part 2 builds the template's rumble. This part explains why each step works, gives three other ways to build one, and covers gluing, resampling, and a sliding bassline as an alternative low end."},{"type":"p","indent":false,"html":"<strong>One rule for this whole part: one owner for the sub.<\/strong> Only one layer should carry the content below about 100 Hz. If you add any method here alongside RUMBLE, turn the RUMBLE send down or high-pass RUMBLE around 80 to 100 Hz so it becomes texture above the new layer."}],"subs":[{"title":"14.1 How a rumble works","blocks":[{"type":"p","indent":false,"html":"Every rumble in these tutorials is the same chain: smear a low source into a tail, drive it, filter it down to the low end, make it mono, and duck it so the next kick lands clean. The methods only differ in what feeds the chain: a copy of the kick, white noise, pitched-down toms, or a moving bassline."},{"type":"pre","text":"SOURCE (kick copy / noise / pitched toms / bassline)\n  > 1. Pre-filter  (EQ+ low-pass ~200 Hz, high-pass ~30 Hz)\n  > 2. Space       (Reverb or Convolution, 100% wet)\n  > 3. Drive       (Saturator or Distortion)\n  > 4. Post-filter (EQ+ low-pass 120 to 250 Hz, dip ~200 Hz)\n  > 5. Mono        (Tool, Width 0)\n  > 6. Duck        (Audio Sidechain from KICK on Tool Gain; Fall sets the feel)\n  > Glue           (Over or Saturator, soft clip kick + rumble)\n  > Print          (resample to a one-shot)"},{"type":"p","indent":false,"html":"Only the source changes between methods. The duck's Fall is the setting that most decides how the rumble feels."},{"type":"h4","text":"Six principles that hold across every method"},{"type":"ol","start":1,"items":["<strong>The kick has to leave room.<\/strong> At 132 BPM one beat is about 455 ms. A kick of roughly 200 to 250 ms leaves about 200 ms for the rumble to bloom. Shorten the Sampler's amp decay before blaming the rumble.","<strong>The source sets the pitch.<\/strong> Reverb on a kick tuned to your root inherits that pitch, so the rumble is in key for free. Noise has no pitch at all, which is why Method 2 adds a sine.","<strong>Space first, then drive.<\/strong> Distortion placed after the reverb chews on the tail and makes it dense and grainy. Distortion before the reverb mostly crunches the transient, which then gets smeared.","<strong>Filter after the drive, too.<\/strong> Distortion manufactures new harmonics above whatever you cut earlier.","<strong>Mono, always.<\/strong> Reverb is stereo by nature. Stereo low end partly cancels on club systems and phones.","<strong>The duck's release is the groove.<\/strong> The Audio Sidechain's <strong>Fall<\/strong> decides whether the rumble reads as a tail on the kick or as a separate thing pumping between kicks."]}]},{"title":"14.2 Translating tutorials into Bitwig","blocks":[{"type":"p","indent":false,"html":"The videos use FL Studio, Ableton, and third-party plugins. Everything has a stock Bitwig equivalent except where noted. This table also works for translating other tutorials you find."},{"type":"table","rows":[["","",""],["","",""]],"header":false},{"type":"h4","text":"In the video What it's doing In Bitwig"},{"type":"p","indent":false,"html":"Fruity Reverb 2, The \"warehouse\" <strong>Reverb<\/strong>, or <strong>Convolution<\/strong> with a large-room Hybrid Reverb tail impulse response"},{"type":"p","indent":false,"html":"Decapitator, Heavy analog- <strong>Saturator<\/strong> for smooth, <strong>Distortion<\/strong> for harder. For Decapitator style drive \"Punish,\" stack Saturator into Distortion \"Punish\""},{"type":"p","indent":false,"html":"Blood Overdrive Destroying the <strong>Distortion<\/strong> with drive near maximum and output at \"x100\" noise pulled down"},{"type":"p","indent":false,"html":"Ableton Amp Amp coloration at (Bass, Blues, <strong>Amp<\/strong> device, Mix around 25% 20 to 30% wet Boost)"},{"type":"p","indent":false,"html":"Parametric EQ 2, Filtering and tone <strong>EQ+<\/strong> EQ Eight, Pro-Q"},{"type":"p","indent":false,"html":"Fruity Delay 3 at Rhythmic echo, 3 <strong>Delay+<\/strong> at <strong>3/16<\/strong> (341 ms at 132 BPM) time \"3\" sixteenths"},{"type":"p","indent":false,"html":"Kickstart, ShaperBox, Ducking under the <strong>Audio Sidechain<\/strong> modulator on <strong>Tool Gain<\/strong> sidechain kick compression"},{"type":"p","indent":false,"html":"\"Stereo separation\" to Mono low end <strong>Tool<\/strong>, Width all the way down mono"},{"type":"p","indent":false,"html":"Fruity Soft Gluing kick and Clipper on the <strong>Over<\/strong> with Knee raised, or <strong>Saturator<\/strong> gently rumble kick bus"},{"type":"p","indent":false,"html":"Edison recording, Resampling to <strong>Bounce<\/strong> or <strong>Bounce in Place<\/strong> on a clip, or record \"consolidate\" audio into an audio track"},{"type":"p","indent":true,"html":"<strong>Polymer<\/strong> with a sine, or a <strong>Sine<\/strong> module in The 3x Osc sine Sub in key Grid"},{"type":"p","indent":false,"html":"Ableton pitch-Per-note <strong>pitch expression<\/strong> in the note editor, or bend clip Sliding notes <strong>Glide<\/strong> on a mono synth envelope"},{"type":"p","indent":false,"html":"Limiter on Fattening the bass <strong>Peak Limiter<\/strong> with input gain raised slightly \"Maximize\""},{"type":"p","indent":false,"html":"Pro-Q 4 or TDR Removing side- <strong>Mid-Side Split<\/strong> container with <strong>EQ+<\/strong> high-pass in Nova on Sides channel lows the Side chain"},{"type":"p","indent":true,"html":"Modular cross- <strong>The Grid<\/strong> (Poly Grid instrument, FX Grid effect), Buchla, VCV Rack modulation or <strong>Phase-4<\/strong> for sines modulating sines"},{"type":"p","indent":false,"html":"Serum LFO in A pitch envelope <strong>ADSR<\/strong> modulator routed to pitch retrigger mode"},{"type":"p","indent":false,"html":"Soundtoys Console-style <strong>Saturator<\/strong> at very low drive Radiator saturation"},{"type":"p","indent":false,"html":"Valhalla, Eventide <strong>Reverb<\/strong> large and long, or <strong>Convolution<\/strong> with a Huge deep reverb Blackhole long hall"},{"type":"p","indent":false,"html":"Replika XT tape Wow, flutter, L/R <strong>Delay-2<\/strong> with different left and right times, plus a mode mismatch tiny slow LFO on time"},{"type":"p","indent":false,"html":"FilterFreak self- A filter used as a <strong>Filter+<\/strong> with resonance near maximum, or simply oscillating sine a sine oscillator"},{"type":"p","indent":true,"html":"Moving left and Auto Pan <strong>Tool<\/strong> Pan with an LFO on it right"},{"type":"p","indent":false,"html":"Ableton Looper, Looping a phrase <strong>Delay+<\/strong> or <strong>Delay-1<\/strong> at full feedback, devices in effects in its and reprocessing the <strong>FB FX<\/strong> slot (12.13) feedback loop every pass"},{"type":"p","indent":false,"html":"TR-8S step One bar of 16th- Clip editor grid at <strong>1/16<\/strong>; Part 16.1 converts step buttons 1 to 16 note steps numbers to positions"},{"type":"p","indent":false,"html":"TR-8S instrument Note length per <strong>Sampler<\/strong> amp envelope decay (or the drum Decay knob drum synth's decay)"},{"type":"p","indent":false,"html":"TR-8S CH/OH Closed hat chokes A Drum Machine choke setting if you find one, shared track open hat otherwise a short open-hat decay (Part 16.7)"},{"type":"p","indent":false,"html":"Ableton MIDI <strong>Arpeggiator<\/strong> on held notes, or a clip with odd Notes without generators, loop length and note <strong>Chance<\/strong> (12.14). No direct drawing them audio-to-MIDI equivalent."},{"type":"p","indent":true,"html":"Giving a sample <strong>Sampler<\/strong>'s phase-modulation character (Bitwig Drum Sampler FM pitch and grit 6.1), or modulating playback <strong>Speed<\/strong>"},{"type":"table","rows":[["","",""],["","",""],["Ableton Resonators","Tuned bands that ring","<strong>Resonator Bank<\/strong>"],["Corpus (membrane, plate, pipe)","Physical-model body","<strong>No native match. Comb<\/strong>, <strong>Delay+<\/strong> at a few ms with high feedback, an <strong>FX Grid<\/strong> of resonant filters, or a VST (12.14)"],["Ableton Shifter with built-in delay","Echoes that drop in pitch","<strong>Delay+<\/strong> with a pitch shifter in <strong>FB FX<\/strong>"],["Grain Delay","Granular, pitched echo spray","<strong>No native match.<\/strong> Delay+ with +12 in FB FX and Random on Time, a granular VST, or Sampler granular on a bounce"],["Hybrid Reverb shimmer / Dark Hall","Evolving algorithmic tail","<strong>Reverb<\/strong>, with a pitch shifter in a feedback loop for shimmer"],["Pro-Q 4 spectral / dynamic notch","Taming resonances only when they spike","<strong>Loud Split<\/strong>, or <strong>Filter+<\/strong> with an <strong>Audio Sidechain<\/strong> envelope; static notches with <strong>EQ+<\/strong>"]],"header":false},{"type":"p","indent":false,"html":"VCV Rack's free version runs standalone only, so it won't load inside Bitwig as a plugin. The Grid covers the same ideas inside the DAW."}]},{"title":"14.3 Method 1: the classic reverb rumble","blocks":[{"type":"p","indent":false,"html":"This is The Producer School's method, and it's what Part 2's RUMBLE track already is. Build it from Part 2. What this method adds:"},{"type":"p","indent":true,"html":"<strong>The order matters.<\/strong> Pre-filter, reverb, drive, post-filter, mono, duck. Part 2's chain follows it."},{"type":"p","indent":true,"html":"<strong>The drive can go much harder<\/strong> than the template's gentle starting point. The video's direction is \"really destroying the sound.\" Turn the Saturator's output down as you push the drive so you don't blow out your ears. The post-filter EQ+ then removes the fizz the drive creates."},{"type":"p","indent":true,"html":"<strong>The post-filter's small boost.<\/strong> Besides the low-pass and the 200 Hz dip, try <strong>+2 to 3 dB<\/strong> at the kick's fundamental or your root note (frequencies in 14.4)."},{"type":"p","indent":true,"html":"<strong>Try Convolution instead of Reverb<\/strong> with a large hall or room impulse response. Real rooms have uneven, lumpy low-end decay, which can sound more \"warehouse\" than an algorithm."},{"type":"p","indent":true,"html":"<strong>The video duplicates the kick onto a second track<\/strong> instead of using a send. A send does the same job with one fewer track to keep in sync, so the template keeps the send."},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> a dark, grainy swell that fills the gap after each kick and gets out of the way before the next one."},{"type":"p","indent":false,"html":"Tune it in the order in Part 2: Fall, then reverb, then post-filter, then level."}]},{"title":"14.4 Method 2: the in-key noise rumble","blocks":[{"type":"p","indent":false,"html":"Noise supplies texture with no pitch; a sine supplies pitch with no texture; an EQ crossover gives each its own lane. This is the Lunatik Rave video's method, credited to Virtual Riot. Its advantage over Method 1 is that the low end is exactly in key, whatever kick you use."},{"type":"h4","text":"Build the noise layer"},{"type":"ol","start":1,"items":["<strong>Make noise.<\/strong> New instrument track, name it NOISE RUMBLE. Load <strong>Polymer<\/strong>, turn its oscillator level all the way down and its <strong>noise<\/strong> level up. Draw one long note, 4 to 8 bars. (A white noise sample in Sampler works too.)","<strong>Bounce it to audio.<\/strong> Right-click the clip, <strong>Bounce in Place<\/strong>. The video calls this \"consolidating.\" It matters because distorted noise sounds different in every section, and you want to audition slices.","<strong>Turn the track fader down first.<\/strong> The next step is extreme.","<strong>Chain on the audio track:<\/strong>"]},{"type":"ol","start":1,"items":["<strong>EQ+<\/strong> low-pass around <strong>300 to 500 Hz<\/strong> (the first high cut)","<strong>Distortion<\/strong> with drive near maximum, output pulled down","<strong>EQ+<\/strong> again: low-pass around <strong>150 to 250 Hz<\/strong>, high-pass around <strong>60 to 90 Hz<\/strong> (see step 7)","<strong>Tool<\/strong>, Width all the way down, with an <strong>Audio Sidechain<\/strong> from KICK on its Gain, as on RUMBLE","<strong>Audition slices.<\/strong> Every section of the bounced noise has a different grain. Loop a one-beat or one-bar slice, try a few, keep the one you like. Or load the bounce into Sampler and move the start point."]},{"type":"h4","text":"Add the sine"},{"type":"ol","start":6,"items":["<strong>Sub track.<\/strong> New instrument track, SUB. Polymer with a plain <strong>sine<\/strong>, mono, short release. Write notes on your root, low octave. The video plays <strong>offbeat<\/strong> notes, which sit between kicks; longer notes give a more continuous floor. Duck the SUB with its own Audio Sidechain from KICK too.","<strong>Set the crossover.<\/strong> The high-pass on the noise (step 4.3) decides where the sine stops and the noise starts. Sweep it while both play. Let them overlap slightly rather than leave a hole between them.","<strong>Boost the second harmonic<\/strong> on the noise layer's EQ+, about +2 to 3 dB, narrow-ish. That's the octave above your sub, and it makes the noise feel pitched in the same key."]},{"type":"h4","text":"Root note frequencies"},{"type":"table","rows":[["<strong>Key root<\/strong>","<strong>Sub (fundamental)<\/strong>","<strong>Second harmonic (boost here)<\/strong>"],["D","36.7 Hz (D1)","73.4 Hz"],["E","41.2 Hz (E1)","82.4 Hz"],["F","43.7 Hz (F1)","87.3 Hz"],["G","49.0 Hz (G1)","98.0 Hz"],["A","55.0 Hz (A1)","110.0 Hz"],["C","65.4 Hz (C2)","130.8 Hz"]],"header":true},{"type":"h4","text":"Where it differs from Method 1"},{"type":"p","indent":false,"html":"A reverb rumble is a copy of the kick, so its shape follows every hit automatically. A noise rumble is independent of the kick, so the ducking does all the work of tying it to the groove. Be more generous with the duck depth here than on RUMBLE. The upside: the sine from step 6 can become the sliding bassline in 14.8, which turns this method into a bridge between the two styles."}]},{"title":"14.5 Method 3: the delay-driven mid layer","blocks":[{"type":"p","indent":false,"html":"A delayed, distorted copy of the kick, with the lows removed, adds a rhythmic, percussive rumble on top of the sub. Optional, and it lives in the crowded 300 Hz to 3 kHz zone (Part 12.12), so keep it quiet."},{"type":"ol","start":1,"items":["<strong>New effect track<\/strong>, RUMBLE MID. Turn up KICK's send to it.","<strong>Delay+<\/strong> at <strong>3/16<\/strong> (341 ms at 132 BPM). Mix <strong>100%<\/strong> so only the echoes come out. Feedback moderate, around 30 to 50%. The first echo lands on the last 16th before the next kick, and the repeats keep shifting against the beat, which is where the groove comes from.","<strong>Distortion<\/strong> hard.","<strong>EQ+:<\/strong> high-pass around <strong>300 to 500 Hz<\/strong> so only the mids play. Low-pass around <strong>3 to 5 kHz<\/strong> to take the edge off.","<strong>Reverb<\/strong>, small and short, optional.","<strong>Tool,<\/strong> Width low or zero, with the same <strong>Audio Sidechain<\/strong> ducking.","<strong>Level:<\/strong> start with the fader low and bring it up until you feel it, then back off a little."]},{"type":"p","indent":false,"html":"<em>Try other delay times<\/em> for different grooves: 1/8 dotted, 5/16, or 1/16 triplets. Each gives a different roll."},{"type":"p","indent":false,"html":"<strong>How this differs from FILTERED DELAY (Part 6):<\/strong> that one is stereo, clean, and fed by percussion. This one is mono, distorted, fed by the kick, and sits right under it."},{"type":"h4","text":"The top kick, for punch"},{"type":"p","indent":false,"html":"If the kick-plus-rumble loses punch, the video layers a short, clicky \"top kick\" on the KICK track."},{"type":"p","indent":true,"html":"Load it on a second pad of a <strong>Drum Machine<\/strong>, or in an <strong>Instrument Layer<\/strong> beside the main kick's Sampler, so one note triggers both."},{"type":"p","indent":true,"html":"<strong>EQ+<\/strong> high-pass around <strong>200 Hz<\/strong> so it doesn't double the sub."},{"type":"p","indent":true,"html":"A very short room reverb, mono."},{"type":"p","indent":false,"html":"The template already does this job with a <strong>Saturator<\/strong> on KICK. Try the Saturator first; use a top kick if the punch still isn't there on a phone speaker."}]},{"title":"14.6 Method 4: the tom rumble","blocks":[{"type":"p","indent":false,"html":"Pitched-down toms become a low, groovy rumble layer with the tom pattern still audible inside it."},{"type":"ol","start":1,"items":["<strong>New instrument track<\/strong>, TOM RUMBLE, with a <strong>Drum Machine<\/strong> and two tom samples.","<strong>Pitch them way down.<\/strong> The video uses -15 and -8 semitones. Better: use <strong>Tuner<\/strong> and the Sampler's Pitch knob to land each tom on your <strong>root<\/strong> and <strong>fifth<\/strong> (7 semitones above), so it stays in key with the kick.","<strong>Write a groovy pattern<\/strong> with an odd loop length (5 or 7 sixteenths) so it rolls against the kick, as in Part 3. Part 16's low-tom lines are a good starting rhythm.","<strong>Chain: Reverb<\/strong> (mono) &gt; <strong>Distortion<\/strong> &gt; <strong>EQ+<\/strong> (high-pass around <strong>40 Hz<\/strong>, then low-pass swept down to taste, as far as about <strong>150 Hz<\/strong> for a pure rumble) &gt; <strong>Tool<\/strong> Width zero with <strong>Audio Sidechain<\/strong> ducking."]},{"type":"p","indent":false,"html":"The pitch-down artifacts are part of the sound. Pitching a sample down 15 semitones lowers its fidelity, and in this genre that grain is useful. Congas, rims, even claps pitched down work too."},{"type":"p","indent":false,"html":"<strong>Different from Part 12.5's rolling toms,<\/strong> which are cut at 80 to 100 Hz and sit above the kick. Here the toms <em>are<\/em> the low end, so the one-owner rule applies."}]},{"title":"14.7 Glue, resample, and two ways to set it up","blocks":[{"type":"p","indent":false,"html":"The last stage in every video is the same: glue the kick and rumble together with a little clipping, then print the result to a single one-shot so every hit is identical. How you do that depends on how the rumble is routed."},{"type":"h4","text":"Setup A: send-based (the template)"},{"type":"p","indent":false,"html":"KICK sends to the RUMBLE return. Good for writing: one kick source, rumble level on one knob, easy to tweak. Its one limit is that kick and rumble never pass through a shared device, so you can't soft-clip them together. (The same fact is why the DRUMS group filter doesn't reach the rumble, Part 13.7.) Resampling solves it."},{"type":"h4","text":"Setup B: a one-track \"rumble kick\" rack (portable preset)"},{"type":"p","indent":false,"html":"For a sound you can drop into any project, build kick and rumble on one track."},{"type":"pre","text":"KICK track\n└─ Chain (outer container, for saving)\n   ├─ Sampler (kick, one-shot)\n   ├─ FX Layer\n   │  ├─ Layer DRY: (empty, passes the kick through)\n   │  └─ Layer RUMBLE: EQ+ > Reverb > Saturator > EQ+ > Tool (Width 0)\n   └─ Over (Knee up) or Saturator: the soft clip on both"},{"type":"p","indent":false,"html":"The Sampler, FX Layer, and clipper sit in one row, one after another. Inside the FX Layer, DRY and RUMBLE play side by side (Part 0, point 7). If a Chain won't accept the Sampler, use an <strong>Instrument Layer<\/strong> with a single layer as the outer container instead."},{"type":"p","indent":false,"html":"<strong>Ducking inside the rack:<\/strong> instead of Audio Sidechain, put an <strong>ADSR<\/strong> modulator on the RUMBLE layer's Tool and route it <strong>down<\/strong> onto Gain. Attack 0, Decay around <strong>200 ms<\/strong> (this becomes your Fall), Sustain 0. Because the KICK track receives MIDI notes, each note triggers the envelope, so the duck is identical every time, with no detection lag. Check on your screen that the ADSR fires before relying on it; if it doesn't, fall back to Audio Sidechain."},{"type":"p","indent":false,"html":"Save from the outer container's name strip (Part 10) and you have a reusable rumble kick preset."},{"type":"h4","text":"Glue: soft clip kick and rumble together"},{"type":"p","indent":true,"html":"<strong>Over<\/strong> with <strong>Knee<\/strong> raised, threshold set so it shaves <strong>1 to 3 dB<\/strong> off the loudest peaks."},{"type":"p","indent":true,"html":"Or <strong>Saturator<\/strong> with gentle drive."},{"type":"p","indent":true,"html":"This is the same \"clip at the source\" move as Part 11. Doing it here means the master clipper has less work later."},{"type":"h4","text":"Resample to a one-shot"},{"type":"p","indent":false,"html":"Reverb and distortion don't produce exactly the same tail on every hit. Printing one good hit fixes that, and it also saves CPU."},{"type":"ol","start":1,"items":["Make a one-bar clip with kick on every beat and the full chain running.","<strong>Bounce<\/strong> it to audio. In Setup A, record into a new audio track whose input is the Master, with only KICK and RUMBLE playing.","Record a few bars and pick the hit you like best.","<strong>Trim it:<\/strong> start exactly on the transient; end just before the next kick (about <strong>455 ms<\/strong> at 132 BPM).","Load that one-shot into a <strong>Sampler<\/strong> in One-shot mode on a new track. Mute or deactivate the original chain, but keep it for later edits."]},{"type":"p","indent":false,"html":"<strong>Bonus:<\/strong> once it's a sample, the Sampler's Pitch knob retunes the whole rumble kick to a new key. A few semitones is fine; past that the length changes noticeably."},{"type":"h4","text":"Rules for every chain"},{"type":"p","indent":true,"html":"<strong>Duck at the end<\/strong> of the chain, after reverb and drive, or the tail fills the gap back in."},{"type":"p","indent":true,"html":"<strong>Mono below about 150 Hz,<\/strong> checked with the mono test in Part 9."},{"type":"p","indent":true,"html":"<strong>Resample once it's right,<\/strong> so it hits the same way every time."}]},{"title":"14.8 Beyond the rumble: the sliding hypnotic bassline","blocks":[{"type":"p","indent":false,"html":"The Pick Yourself video argues for a low end that moves between notes instead of a static rumble. It names three ingredients: slides that create tension, a groove that never sits still, and rumble-style texture. It's a dub techno technique in a modern setting."},{"type":"p","indent":false,"html":"<strong>A skeptical read first.<\/strong> The \"pros use this instead\" framing is a video hook. The two approaches aren't exclusive, and plenty of tracks use both. The useful idea underneath is sound: techno balances <strong>stable<\/strong> elements (the four-on-the-floor kick) against <strong>unstable<\/strong> ones (offbeat hats, a note sliding between semitones), and that push and pull is a big part of the hypnotic effect. Test it against your own references rather than taking the claim on trust."},{"type":"h4","text":"Build it"},{"type":"p","indent":false,"html":"<strong>1. The sound.<\/strong> New instrument track, BASS (or use SPARE). <strong>Polymer<\/strong> with a sine, or a soft saw or triangle for more harmonics to filter. Set the voice to <strong>mono<\/strong> and turn <strong>Glide<\/strong> on (around 50 to 150 ms)."},{"type":"p","indent":false,"html":"<strong>2. The notes.<\/strong> Start from your chord's root, pitched down an octave or two. Two bars of straight 8ths is the video's starting point. (Part 16's Pattern 3 bass, steps 4, 7, 12, 15, is a sparser alternative that never lands on the kick.)"},{"type":"p","indent":false,"html":"<strong>3. The slides.<\/strong> In the note editor, open the <strong>pitch expression<\/strong> lane and draw small curves into and out of notes. Bitwig draws pitch per note, which is finer than Ableton's clip-wide pitch bend the video uses. Small moves are the point: a slide that stops between two semitones creates the dissonance the video is after. Combine with Glide for slides between notes."},{"type":"p","indent":false,"html":"<strong>4. The movement.<\/strong> In order of strength:"},{"type":"p","indent":true,"html":"<strong>Rhythmic displacement:<\/strong> select bar 2's notes and move them <strong>one 16th to the right<\/strong>. Then delete a note or change a pitch in bar 2."},{"type":"p","indent":true,"html":"<strong>Polymeter:<\/strong> set the clip loop length to <strong>3, 5, or 9 sixteenths<\/strong>, the same way as Perc B in Part 3. The notes land somewhere new against every bar."},{"type":"p","indent":true,"html":"<strong>The video's caution:<\/strong> a 9-step bass against a busy lead got muddy, and it went back to displacement. Start with displacement; reach for polymeter only if it locks in. Perc A already runs on a 3-bar loop, so check the bass against it."},{"type":"p","indent":false,"html":"<strong>5. The texture,<\/strong> left to right after Polymer:"},{"type":"ol","start":1,"items":["<strong>Filter+<\/strong>, low-pass, Resonance about a third. Sweep Cutoff until the bass feels like it's \"pushing the track from below\" rather than sitting on top of the kick.","<strong>LFO<\/strong> on that Cutoff, <strong>sync on, 1/2 bar<\/strong>, small amount. This is a deliberate exception to the template's free-running rule: here the push and pull is meant to lock to the beat.","<strong>Saturator,<\/strong> light.","<strong>Reverb,<\/strong> Mix low, around 10 to 15%.","<strong>Amp,<\/strong> Mix <strong>20 to 30%<\/strong>.","<strong>Peak Limiter,<\/strong> input raised just enough to fatten, no more than about 2 dB of gain reduction. In some tracks the dry bass sounds better; the video says so too."]},{"type":"p","indent":false,"html":"<strong>6. Mono safety.<\/strong> Wrap the end of the chain in a <strong>Mid-Side Split<\/strong> and put an <strong>EQ+<\/strong> high-pass around <strong>150 to 200 Hz<\/strong> on the <strong>Side<\/strong> chain only. That removes stereo low end from the reverb without making the whole sound mono."},{"type":"p","indent":false,"html":"<strong>7. Duck it. Tool<\/strong> at the end with an <strong>Audio Sidechain<\/strong> from KICK on Gain. Fall shorter than the rumble's, around 100 to 150 ms."},{"type":"h4","text":"Where it fits"},{"type":"p","indent":true,"html":"<strong>One owner for the sub.<\/strong> If BASS carries the low end, turn KICK's RUMBLE send down, or high-pass RUMBLE around 80 to 100 Hz so it becomes texture above the bass."},{"type":"p","indent":true,"html":"<strong>Pair it with Method 2.<\/strong> The noise layer becomes the texture, and the sine sub becomes this sliding bassline. That gives you the rumble's grain with the bassline's movement."}]},{"title":"14.9 Steering the rumble","blocks":[{"type":"p","indent":false,"html":"Most of the variety comes from five settings: reverb decay, drive type, the post-filter low-pass, the duck's Fall, and which source feeds the chain. Change one at a time and listen across 8 bars before changing the next."},{"type":"h4","text":"Pick a character"},{"type":"h4","text":"Deep, dubby, far away"},{"type":"p","indent":true,"html":"Reverb long, 3 to 5 s. Saturator, gentle."},{"type":"p","indent":true,"html":"Post-filter low-pass low, 120 to 150 Hz. Fall long, 250 to 350 ms."},{"type":"p","indent":true,"html":"Source: Method 1."},{"type":"h4","text":"Tight, driving warehouse"},{"type":"p","indent":true,"html":"Reverb short, 0.8 to 1.5 s. Saturator, hard."},{"type":"p","indent":true,"html":"Post-filter low-pass 200 to 250 Hz. Fall 150 to 200 ms."},{"type":"p","indent":true,"html":"Source: Method 1 with a Convolution room impulse response."},{"type":"h4","text":"Gritty, industrial"},{"type":"p","indent":true,"html":"Reverb medium, Convolution. Distortion, hard."},{"type":"p","indent":true,"html":"Post-filter low-pass 200 to 250 Hz. Fall 150 to 200 ms."},{"type":"p","indent":true,"html":"Source: Method 1 plus the Method 3 mid layer."},{"type":"h4","text":"Rolling, groovy"},{"type":"p","indent":true,"html":"Reverb medium. Distortion."},{"type":"p","indent":true,"html":"Post-filter low-pass 150 to 200 Hz. Fall 150 to 250 ms."},{"type":"p","indent":true,"html":"Source: Method 3, or Method 4 with an odd loop."},{"type":"h4","text":"Melodic, exactly in key"},{"type":"p","indent":true,"html":"No reverb needed. Distortion on the noise."},{"type":"p","indent":true,"html":"Post-filter low-pass 150 to 250 Hz. Fall 150 to 250 ms."},{"type":"p","indent":true,"html":"Source: Method 2, or the sliding bassline."},{"type":"h4","text":"Evolving over 8 minutes"},{"type":"p","indent":true,"html":"Automate reverb size by section. Slow LFO on the low-pass (LFO 4 already does this)."},{"type":"p","indent":true,"html":"Any drive, Fall, or source."},{"type":"h4","text":"When it goes wrong"},{"type":"table","rows":[["<strong>Symptom<\/strong>","<strong>Likely cause<\/strong>","<strong>Fix<\/strong>"],["Kick loses punch","Kick tail too long, or the duck too shallow","Shorten the kick's decay; drag further down on Tool Gain; try a top kick"],["Muddy, boxy","Too much around 200 to 300 Hz","Dip around 200 Hz on the post-filter; lower its low-pass"],["Fizzy or harsh","Drive harmonics left in","Add or lower the post-filter EQ+ after the drive"],["Clashes with the bass","Rumble not in key","Tune the kick to your root with Tuner; or use Method 2"],["Thin in mono","Stereo reverb","Tool Width at zero at the end of the chain"],["Every hit sounds a bit different","Reverb and drive vary per hit","Resample to a one-shot (14.7)"],["Static, boring","Nothing moves over time","Slow LFO on the post-filter low-pass or reverb decay; add the Method 3 layer"],["Pumping is obvious","Duck too deep or Fall too short","Less depth; lengthen Fall"],["Two low layers fighting","Methods stacked below 100 Hz","One owner for the sub; high-pass the others"]],"header":true},{"type":"h4","text":"Build a rumble character page"},{"type":"p","indent":false,"html":"On a <strong>Remote Controls<\/strong> page for the RUMBLE track (or the outer container in Setup B), map:"},{"type":"ol","start":1,"items":["Reverb Decay","Reverb Size","Drive","Post-filter low-pass frequency","200 Hz dip gain","Audio Sidechain Fall (or the ADSR's Decay in Setup B)","Method 3 mid layer level","Rumble level"]},{"type":"p","indent":false,"html":"With those eight knobs, one rumble covers most of the characters above, and you can ride them live during an arrangement pass (Part 13.6)."}]}]},{"title":"Part 15: Hypnotic sound design theory","blocks":[{"type":"p","indent":false,"html":"From the Voltage Labs video (see Sources). Its argument: hypnotic techno is made from <strong>relationships, not parts<\/strong>. Pitches between the keys, loops that never line up with the bar, and one control source driving several sounds at once. The gear (a Buchla modular system) is beside the point; the video rebuilds the same sounds in software to show that the ideas carry the sound."},{"type":"p","indent":false,"html":"Read this after you've built the template. It's a source of ideas, not a set of steps you need."}],"subs":[{"title":"15.1 The spirit","blocks":[{"type":"p","indent":false,"html":"The video places the genre in a lineage: artists such as Donato Dozzy, Mike Parker, Rrose, Mod21, and Luigi Tozzi; labels such as Semantica, Prologue, Hypnus, Edit Select, and Northern Electronics. It's music built for long sets and patient crowds. The video argues the post-2020 shift to short sets and social media pushed techno toward \"harder, faster, louder,\" and that a new generation is coming back to depth."},{"type":"p","indent":false,"html":"Its closing point is the design brief for everything below: let repetition sink in, allow space, and surrender to the process."}]},{"title":"15.2 Six ideas and how to do them in Bitwig","blocks":[{"type":"p","indent":false,"html":"<strong>1. Unquantized pitch.<\/strong> There are infinitely many pitches between two piano keys, and hypnotic sequences live there. A pitch sequence no one has heard before, which you couldn't reproduce exactly, is a feature."},{"type":"p","indent":true,"html":"Route a <strong>Steps<\/strong> or <strong>Random<\/strong> modulator to an oscillator's pitch with a small, arbitrary amount. Modulator amounts are continuous, so the result lands between semitones."},{"type":"p","indent":true,"html":"Or draw per-note <strong>pitch expression<\/strong> curves (as in 14.8)."},{"type":"p","indent":true,"html":"In SuperCollider terms, it's the difference between <code>freq: 55 * 2.pow(n/12)<\/code> and an arbitrary <code>freq<\/code> argument."},{"type":"p","indent":false,"html":"<strong>2. Odd pattern lengths.<\/strong> A 5-step or 7-step sequence over a four-on-the-floor kick makes it hard to tell where \"one\" is, \"in a satisfyingly disorienting way.\" The template already does this with Perc A and Perc B. Apply the same move to pitch and timbre: set a <strong>Steps<\/strong> modulator to 5 or 7 steps, or a clip loop to 5 or 7 sixteenths."},{"type":"p","indent":false,"html":"<strong>3. Waveforms modulating waveforms.<\/strong> Complexity comes from interaction, not from more oscillators. The video's three moves:"},{"type":"p","indent":true,"html":"<strong>Wavefolding<\/strong> a sine to add overtones: in <strong>The Grid<\/strong>, put a shaper module after a <strong>Sine<\/strong> oscillator. Outside The Grid, push a sine hard through <strong>Saturator<\/strong> for a similar result."},{"type":"p","indent":true,"html":"<strong>FM:<\/strong> one oscillator modulating another's frequency. <strong>Phase-4<\/strong> is Bitwig's four-sine FM instrument and does this without patching."},{"type":"p","indent":true,"html":"<strong>AM:<\/strong> one oscillator modulating another's volume. In The Grid, a multiply module between two oscillators."},{"type":"p","indent":false,"html":"The video picks between AM and FM \"by ear, whatever sounds better in the moment.\""},{"type":"p","indent":false,"html":"<strong>4. One sequence, many destinations.<\/strong> Route the same sequence to several targets, so the sounds move together: when one sound's wavefold goes up, the other's pitch goes up too. Then invert one routing so they move in opposite directions."},{"type":"p","indent":true,"html":"In Bitwig, that's one <strong>Steps<\/strong> modulator with several routings (Drill 2 in Part 4). Drag <strong>down<\/strong> on one target to invert it."},{"type":"p","indent":false,"html":"<strong>5. Randomness on timbre and decay.<\/strong> The video uses a random, sample-and-hold style control on the timbre, then on envelope decay, so \"the notes have a different length.\""},{"type":"p","indent":true,"html":"<strong>Random<\/strong> modulator, synced to the note rate, routed to a timbre control and to the amp envelope's decay. Small amounts."},{"type":"p","indent":false,"html":"<strong>6. Filters as a chisel.<\/strong> A band-pass filter removes frequencies but adds complexity, \"like chiseling away at a block of marble.\" On a single repeated pitch, sweeping a band-pass reveals harmonics you didn't know were there. Then put an envelope on the filter as well."},{"type":"p","indent":true,"html":"<strong>Filter+<\/strong> in band-pass, Resonance moderate, swept by hand first. Then an <strong>ADSR<\/strong> modulator or the synth's own filter envelope on its Cutoff."}]},{"title":"15.3 The software patch, layer by layer","blocks":[{"type":"p","indent":false,"html":"The second half of the video builds a full loop in Serum and FilterFreak. In Bitwig:"},{"type":"p","indent":false,"html":"<strong>The main voice: a sine with a pitch envelope.<\/strong> Polymer on a sine, with an <strong>ADSR<\/strong> modulator routed up to pitch, so each note sweeps upward. One note only, played on its own pattern length (5 or 7 sixteenths), with <strong>note Chance<\/strong> (Part 13.5) for a loosely random pattern. A rising sub-sweep like this hits very hard in a club, so it counts as a sub owner (Part 14's one-owner rule)."},{"type":"p","indent":true,"html":"<strong>Equal-loudness EQ:<\/strong> our ears hear higher frequencies as louder, so the sweep gets louder as it rises. Add <strong>EQ+<\/strong> with a gentle cut on the upper part of the sweep so it stays even."},{"type":"p","indent":true,"html":"A free-running <strong>LFO<\/strong> (sync off) on the filter, so it moves even when you don't."},{"type":"p","indent":false,"html":"<strong>Two more copies, higher.<\/strong> Duplicate the track and move the note up. Use a different waveform and a <strong>band-pass<\/strong> filter on each copy, with its own slow free-running LFO. On the top copy, add a little width with Polymer's unison or <strong>Tool<\/strong> Width. Sidechain the lowest copy to the kick for some pump."},{"type":"p","indent":false,"html":"<strong>The psychedelic pads: beating sines.<\/strong> Two sine waves very close in pitch drift in and out of phase, which produces a slow, wobbly beating. The beat rate equals the difference between the two frequencies, so 220 Hz and 220.5 Hz beat once every 2 seconds."},{"type":"p","indent":true,"html":"Build it in an <strong>FX Grid<\/strong> on an effect or audio track: two <strong>Sine<\/strong> modules, nearly the same pitch, with a slow LFO on one's pitch. FX Grid oscillators run without notes, so like the video's self-oscillating filters, it drones until you stop it."},{"type":"p","indent":true,"html":"Do this at four points across the spectrum."},{"type":"p","indent":true,"html":"Add <strong>Tool<\/strong> Pan with an LFO, and a second, slower LFO on that LFO's Rate (Drill 3), so the panning speed itself drifts."},{"type":"p","indent":true,"html":"The same idea as a SuperCollider sketch (the <code>! 2<\/code> sends it to both speakers):"},{"type":"pre","text":"{ (SinOsc.ar(220) + SinOsc.ar(220 + LFNoise2.kr(0.05).range(0.2, 2))) * 0.1 ! 2 }.play;"},{"type":"p","indent":false,"html":"<strong>The console and the noise floor.<\/strong> The video puts a preamp emulation on every track for subtle analog-console distortion, plus a quiet channel of preamp and tape noise. In Bitwig: <strong>Saturator<\/strong> at very low drive on each channel, and a Polymer noise or noise sample track far down in the mix."},{"type":"p","indent":false,"html":"<strong>Hats that groove from the kick.<\/strong> A stock closed hat sent to its own reverb return, then an aggressive sidechain from the kick on that return. The duck's attack time controls the groove of the whole track. In Bitwig: a HAT VERB effect track with <strong>Reverb &gt; Tool<\/strong>, and an <strong>Audio Sidechain<\/strong> from KICK on Tool's Gain. Sweep the modulator's <strong>Rise<\/strong> the way the video sweeps attack."},{"type":"p","indent":false,"html":"<strong>The parallel crush return.<\/strong> One effect track that most tracks send to: <strong>Saturator<\/strong> or <strong>Distortion<\/strong> hard, then <strong>Compressor+<\/strong> on the <strong>Smash<\/strong> character, mixed in low. \"Everything sounds like it went through some sort of chain together.\""},{"type":"p","indent":false,"html":"<strong>Perform it.<\/strong> Map the filters, the sine volumes, the kick and hat volumes, and the cutoffs to a controller, then bring sounds in toward a climax and back out over a few minutes. That's the Part 13.6 workflow."}]},{"title":"15.4 A starter Grid patch","blocks":[{"type":"p","indent":false,"html":"A small patch that uses ideas 1 to 5 together. Grid module names below are approximate; browse The Grid's categories for the equivalents."},{"type":"ol","start":1,"items":["New instrument track, PATCH. Load <strong>Poly Grid<\/strong>.","Inside it: <strong>Sine<\/strong> oscillator A into a shaper (for wavefolding), and a <strong>Triangle<\/strong> oscillator B. Patch A's output into B's phase or FM input. Each into its own envelope and amplifier, then mixed to the output.","Write a one-note clip with a loop length of <strong>5 sixteenths<\/strong>, so the notes trigger the envelopes.","On the Poly Grid device, add a <strong>Steps<\/strong> modulator set to <strong>7 steps<\/strong> at 1/16. Route it up to the shaper amount, and up to oscillator B's pitch by a small, arbitrary amount. The 5-step notes and 7-step modulation now cycle against each other and the bar.","Add a <strong>Random<\/strong> modulator routed to the shaper amount and to one envelope's decay.","After Poly Grid: <strong>Filter+<\/strong> band-pass, then <strong>Saturator<\/strong> gentle, then a <strong>REVERB LONG<\/strong> send.","Add a kick, then \"slowly turn the knob for six minutes while meditating,\" as the video puts it."]}]}]},{"title":"Part 16: Pattern library (three TR-8S grooves)","blocks":[{"type":"p","indent":false,"html":"Three complete one-bar patterns from short Instagram reels by Placiid (@placiidfr), each programmed live on a Roland TR-8S. The step numbers come from the reels' on-screen captions; tempos are read off the machine's display. Where the TR-8S screen is legible, the instrument names are noted, but treat those as approximate."},{"type":"p","indent":false,"html":"Use this part alongside Part 3: it gives you notes to write into the template tracks. It is not a replacement for Part 3's odd loop lengths, and 16.6 explains why."}],"subs":[{"title":"16.1 Reading step numbers","blocks":[{"type":"p","indent":false,"html":"A TR-8S bar is 16 buttons, one per 16th note. Each group of four is one beat."},{"type":"table","rows":[["<strong>Steps<\/strong>","<strong>Beat<\/strong>","<strong>Count each step as<\/strong>"],["1, 2, 3, 4","Beat 1","1, e, &amp;, a"],["","",""],["","",""],["","",""],["5, 6, 7, 8","Beat 2","2, e, &amp;, a"],["9, 10, 11, 12","Beat 3","3, e, &amp;, a"],["13, 14, 15, 16","Beat 4","4, e, &amp;, a"]],"header":true},{"type":"p","indent":true,"html":"<strong>The beats:<\/strong> 1, 5, 9, 13. Where the kick goes."},{"type":"p","indent":true,"html":"<strong>The offbeats (\"&amp;\"):<\/strong> 3, 7, 11, 15. Halfway between kicks."},{"type":"p","indent":true,"html":"<strong>The in-betweens (\"e\" and \"a\"):<\/strong> the even steps. Where syncopation lives."},{"type":"p","indent":false,"html":"<strong>In Bitwig:<\/strong> set the clip editor's grid to <strong>1/16<\/strong> and count cells from the left; step N is the Nth cell. In Bitwig's bar.beat.sixteenth position display, step 7 reads <code>1.2.3<\/code> (bar 1, beat 2, third sixteenth)."},{"type":"p","indent":false,"html":"<strong>Grid notation below:<\/strong> <code>x<\/code> is a hit, <code>.<\/code> is a rest, grouped one beat per block."}]},{"title":"16.2 Pattern 1 (146 BPM)","blocks":[{"type":"pre","text":"              1 . . .  5 . . .  9 . . .  13. . .\nKick          x . . .  x . . .  x . . .  x . . .\nLow tom       . x . x  . . x .  . . x .  . . x .\nPerc bell     . . . x  . . x .  . . . x  . . x .\nWeird perc    . . . .  . . . .  . . . x  . . . .\nClap          . . . .  x . . .  . . . .  x . . .\nClosed hat    . . x .  . . x .  . . x .  . . x .\nRide          . . x .  . . x .  . . x .  . . x ."},{"type":"p","indent":true,"html":"Steps as written: kick 1-5-9-13; low tom 2-4-7-11-15; perc bell 4-7-12-15; weird perc 12; clap 5-13; closed hat 3-7-11-15; ride 3-7-11-15."},{"type":"p","indent":true,"html":"<strong>Moves in the reel:<\/strong> open the ride (longer decay), cut the kick for the buildup, add delay."},{"type":"p","indent":true,"html":"<strong>Character:<\/strong> the busiest of the three. The low tom fills almost every gap the kick leaves."}]},{"title":"16.3 Pattern 2 (143 BPM)","blocks":[{"type":"pre","text":"              1 . . .  5 . . .  9 . . .  13. . .\nKick          x . . .  x . . .  x . . .  x . . .\nLow tom       . . x .  . x . x  . . x .  . x . .\nSnare         . . . .  x . . .  . . . .  x . . .\nClap layer    . . . .  x . . .  . . . .  x . . .\nSynth         x . . .  . . . .  . . x .  . . . .\nPerc synth    . . . .  . . x .  . . . .  . . . .\nClosed hat    . . x .  . . x .  . . x .  . . x .\nOpen hat      x . . .  x . . .  x . . .  x . . .\nRide          . . x .  . . x .  . . x .  . . x ."},{"type":"p","indent":true,"html":"Steps as written: kick 1-5-9-13; low tom 3-6-8-11-14; snare 5-13; clap layer 5-13 (the reel stresses it's the same steps, layered); synth 1-11; perc synth 7; closed hat 3-7-11- 15; open hat 1-5-9-13; ride 3-7-11-15."},{"type":"p","indent":true,"html":"<strong>Moves in the reel:<\/strong> cut the kick for the buildup, reduce the ride decay, add delay on the whole group."},{"type":"p","indent":true,"html":"<strong>Character:<\/strong> the tom's spacing (3, then 2, then 3, then 3) gives it a lopsided, rolling feel. The synth on 1 and 11 is the only pitched part."}]},{"title":"16.4 Pattern 3 (141 BPM)","blocks":[{"type":"pre","text":"              1 . . .  5 . . .  9 . . .  13. . .\nKick          x . . .  x . . .  x . . .  x . . .\nSnare         . . . .  x . . .  . . . .  x . . .\nBass          . . . x  . . x .  . . . x  . . x .\n606 floor tom . . . .  . . . .  . . x .  . . x .\nClap          x . . .  x . . .  x . . .  x . . .\nClosed hat    . . x .  . . x .  . . x .  . . x .\nChord         . . . .  . . . .  . . . x  . . x .\nOpen hat      x . . .  x . . .  x . . .  x . x .\nRide          . . x .  . . x .  . . x .  . . x ."},{"type":"p","indent":true,"html":"Steps as written: kick 1-5-9-13; snare 5-13; bass 4-7-12-15; 606 floor tom 11-15; clap 1- 5-9-13; closed hat 3-7-11-15; chord 12-15; open hat 1-5-9-13-15; ride 3-7-11-15."},{"type":"p","indent":true,"html":"<strong>Sounds on screen (approximate):<\/strong> a white-noise snare, a distorted 808-style bass, a 606 floor tom, 909 clap, 909 closed and open hats, 909 ride, and a chord patch."},{"type":"p","indent":true,"html":"<strong>Moves in the reel:<\/strong> cut the kick for the buildup, add reverb."},{"type":"p","indent":true,"html":"<strong>Character:<\/strong> the bass carries the groove. The clap sits <em>on<\/em> every kick, so it thickens the kick's front edge rather than acting as a backbeat."}]},{"title":"16.5 What the three have in common","blocks":[{"type":"p","indent":false,"html":"This is the actual lesson, more than any single pattern."},{"type":"ol","start":1,"items":["<strong>A fixed skeleton.<\/strong> All three use kick on 1-5-9-13, closed hat on 3-7-11-15, and a ride doubling the hat. That skeleton never changes, and it's essentially the template's KICK and HATS.","<strong>Mid and low parts stay off the kick.<\/strong> Every tom, bell, bass, chord and perc hit in all three patterns lands <em>between<\/em> kicks. The one exception is Pattern 2's synth on step 1. Those in-between slots are also where the rumble blooms (Part 2), which matters in 16.7.","<strong>One cell keeps recurring: 4-7-12-15.<\/strong> It's the Pattern 1 bell and the Pattern 3 bass, and the Pattern 3 chord is its second half. It's a two-beat figure repeated: a pickup on the last 16th before beat 2 (step 4), then the \"&amp;\" of beat 2 (step 7). The pickup leans into the next kick; the second hit doubles the hat. If you take one thing from this part, take this cell.","<strong>The backbeat is a choice.<\/strong> Pattern 1 has a clap on 5-13, Pattern 2 stacks snare and clap there, and Pattern 3 has a snare there plus a clap on every beat.","<strong>Open hat on the beat, not off it<\/strong> (Patterns 2 and 3). My read, not stated in the reels: the TR-8S puts closed and open hat on one shared track (its screen reads CH/OH), so the closed hat on step 3 cuts off the open hat from step 1. You hear a short \"tss\" on each beat, choked at the \"&amp;\". Pattern 3's open hat on 15, the same step as the closed hat, would depend on how the machine resolves two hats on one step; I can't tell from the screenshots.","<strong>Arrangement moves are knob moves.<\/strong> None of the reels writes a new part to change the energy. They open or close the ride's decay, cut the kick, and add delay or reverb."]}]},{"title":"16.6 A skeptical read: these patterns against the template","blocks":[{"type":"p","indent":true,"html":"<strong>Tempo.<\/strong> 141 to 146 BPM is peak-time territory; the template sits at 132. Step positions transfer at any tempo, but the feel loosens as you slow down. Try them at 132 first. If they drag, shorten the hat and ride decays before reaching for the tempo."},{"type":"p","indent":true,"html":"<strong>Every part is one bar long.<\/strong> These patterns repeat identically every bar, which is the opposite of Part 3's engine (a 3-bar Perc A against 4-bar loops). That's fine for a one-minute reel. Over eight minutes it's the \"boring after two minutes\" failure in 13.10. Use them as the skeleton and let Perc A, Perc B, or the drifting cell in 16.8 do the drifting."},{"type":"p","indent":true,"html":"<strong>The backbeat pulls toward a different genre.<\/strong> A clap or snare on 5 and 13 reads as peak-time or Berlin warehouse. Most of the hypnotic references in Part 15 leave it out or bury it. Try each pattern with the backbeat muted and decide by ear against a reference."},{"type":"p","indent":true,"html":"<strong>No visible accents.<\/strong> The reels show the steps but not velocities. Apply Part 3's velocity rule (60 to 110, offbeats generally quieter) to everything except the kick."},{"type":"p","indent":true,"html":"<strong>These are reels, not records.<\/strong> They're built to sound finished in under a minute, which rewards density. The space you leave out matters as much as what you copy."}]},{"title":"16.7 Putting them in the template","blocks":[{"type":"table","rows":[["<strong>Part in the patterns<\/strong>","<strong>Template track<\/strong>","<strong>Notes<\/strong>"],["","",""],["Kick","KICK","Unchanged."],["Closed hat","HATS","Offbeats only (3-7-11-15) instead of Part 3's every-16th. To get motion back, add hits on the even steps at velocity 50 to 70 with <strong>Chance<\/strong> at 30 to 50 percent (13.5)."],["Ride, open hat","Extra pads on the HATS Drum Machine, or a new RIDE track","Low cut per 12.7. See the choke note below."],["Low tom, floor tom","PERC A","Tune in key (12.5). For a low-end version, Part 14.6."],["Perc bell, weird perc, perc synth","PERC B","Metallic recipes in 12.6."],["Clap, snare","Optional new CLAP track, inside the DRUMS group","Mute it first and only bring it in if the track misses it (16.6)."],["Bass","SPARE (or a BASS track, Part 14.8)","<strong>One owner for the sub.<\/strong> The bass on 4-7-12-15 sits exactly where the rumble blooms. Turn KICK's RUMBLE send down, or high-pass RUMBLE at 80 to 100 Hz."],["Chord, synth","CHORD","Chord on 12-15 gives two stabs a bar instead of Part 6's one per 8 bars. With CHORD's ping-pong delay, try muting step 12 and keeping 15 only."]],"header":true},{"type":"p","indent":false,"html":"<strong>Open hat choke.<\/strong> To reproduce the TR-8S behaviour, the open hat has to stop when the closed hat plays. Look for a choke group setting on the Drum Machine pads. If you can't find one, fake it: shorten the open hat Sampler's amp decay so it's gone before the next \"&amp;\". One 8th at 132 BPM is about 227 ms, so start the decay around <strong>150 to 200 ms<\/strong>."},{"type":"p","indent":false,"html":"<strong>Groove interacts with these patterns.<\/strong> Part 1's shuffle delays every second 16th, which means the even steps. The offbeat hats (3-7-11-15) stay straight; the toms on 2, 4, 6, 8, 14 and the bell and bass pickups on 4 and 12 get swung. That's usually what you want: a straight hat skeleton with swung syncopation around it."},{"type":"p","indent":false,"html":"<strong>Write them as clips, not one long pattern.<\/strong> One clip per track, one bar long, grid at 1/16."},{"type":"p","indent":false,"html":"Then each part can be launched, muted, or given a different loop length on its own."}]},{"title":"16.8 Making them hypnotic: the drifting cell","blocks":[{"type":"p","indent":false,"html":"My suggestion, not from the reels. It turns the 4-7-12-15 cell into a Perc-A-style drift."},{"type":"ol","start":1,"items":["On PERC B (or BASS), create a clip and write notes on steps <strong>4 and 7<\/strong> only. That's the cell's first half.","Set the clip's loop length to <strong>7 sixteenths<\/strong>, the same way as Part 3's Perc B. (Written at 8, it would repeat as 4-7-12-15 exactly.)","Play it against the kick. Each pass, the cell starts one 16th earlier relative to the beat, so the pickup slides in and out of leaning on the kick.","It realigns after 7 bars (7 × 16 steps = 112 steps = 7 bars). Against Perc A's 3-bar loop, the combined pattern takes 21 bars to repeat.","Keep the skeleton fixed: kick, hats, ride. One drifting cell plus Perc A is plenty. Two or more drifting parts on top of a busy tom line usually turns to mush."]},{"type":"p","indent":false,"html":"The same move works on Pattern 2's low tom: write it as is, then set the loop to 15 or 17 sixteenths. Or keep it at 16 and give two of its hits <strong>Recurrence<\/strong> so they only play every second or fourth pass (13.5)."},{"type":"p","indent":false,"html":"The 4-7 cell also works as the note pattern for the one-hit lead in 12.14: the resonators turn it into a melodic figure that drifts."},{"type":"p","indent":false,"html":"<em>You should hear:<\/em> a figure you recognize, that never quite sits in the same place twice."}]},{"title":"16.9 The reels' arrangement moves, in Bitwig","blocks":[{"type":"h4","text":"Opening and closing the ride."},{"type":"p","indent":true,"html":"Automate the ride Sampler's <strong>amp decay<\/strong> (or release) in the Arrangement."},{"type":"p","indent":true,"html":"Longer is more open and more energy; shorter tightens it. This is another dial for the 13.3 table."},{"type":"p","indent":true,"html":"Template use: open it toward the peak at bar 161, close it for the breakdown at bar 193."},{"type":"h4","text":"Cutting the kick for a buildup."},{"type":"p","indent":true,"html":"Automate the KICK track's fader down, or mute the KICK clip for the buildup bars."},{"type":"p","indent":true,"html":"If the RUMBLE send is post-fader (Part 2), the rumble drops out with it. Its tail rings for a moment, which is part of the effect."},{"type":"p","indent":true,"html":"Keep it short. The reels do it for a few bars; 13.7's limit of about 16 bars before you lose a dancefloor still applies."},{"type":"p","indent":true,"html":"The kick returning on a phrase boundary is the release."},{"type":"h4","text":"Adding delay on the group."},{"type":"ol","start":1,"items":["Put a <strong>Delay+<\/strong> on the DRUMS group track, after the group's Filter+.","Time <strong>3/16<\/strong>, Mode <strong>Ping<\/strong>, Feedback <strong>40 to 55 percent<\/strong>, EQ low cut around <strong>400 Hz<\/strong> so kick echoes don't muddy the low end.","Start with <strong>Mix at 0<\/strong>. Automate it up to around <strong>25 to 35 percent<\/strong> over the buildup, then snap it back to 0 when the kick returns.","This catches the kick as well. That's why the reels cut the kick first: with it gone, the delay washes the hats and percussion only."]},{"type":"h4","text":"Adding reverb."},{"type":"p","indent":true,"html":"Automate the HATS and PERC sends to <strong>REVERB LONG<\/strong> up over the buildup, and back down at the return."},{"type":"p","indent":true,"html":"Don't add reverb to the kick here. The rumble already is the kick's reverb."},{"type":"p","indent":false,"html":"Pattern 1's sequence (open the ride, cut the kick, add delay) works as a full template move: one dial up, one element out, one effect in, spread over 8 to 16 bars."}]}]},{"title":"Troubleshooting","blocks":[{"type":"p","indent":false,"html":"Things that actually went wrong, and why. Rumble-specific problems also have their own table in Part 14.9."},{"type":"p","indent":false,"html":"<strong>No send visible from a track to an effect track.<\/strong> Either the effect track is actually an Audio track (check that it's below the divider), or the mixer's sends section is toggled off."},{"type":"p","indent":false,"html":"<strong>Modulator does nothing.<\/strong> Three checks in order: was the routing button flashing when you dragged; for an Audio Sidechain, is the source set to the right track and does its display bounce; does the ring go the direction you meant (up to increase, down to decrease)."},{"type":"p","indent":false,"html":"<strong>The kick doesn't change when you adjust the rumble modulator.<\/strong> Correct. The modulator is on the RUMBLE track. Listen for the rumble swelling between kicks, not for the kick doing something."},{"type":"p","indent":false,"html":"<strong>Rumble ducks even when the kick is muted.<\/strong> Expected with a pre-fader trigger. Not broken."},{"type":"p","indent":false,"html":"<strong>Rumble isn't ducking, or stopped ducking.<\/strong> Solo RUMBLE first (the pre-fader trigger keeps ducking even with the kick muted). If it pumps in solo, it works and is just masked by the full mix: deepen the drag on Tool's Gain, or shorten the reverb decay. If it doesn't pump: check the Audio Sidechain source is still KICK with its display bouncing; check Tool's Gain still has a downward ring; check that LFO 4 is on the first EQ+, not routed to Tool's Gain; check the ducking is on the last device in the chain; and make sure Tool's Gain knob itself is at 0 dB. If Tool's Gain was turned down to lower the rumble's volume, the ducking has no room left to go down. Set the rumble's level with its fader or the KICK send instead."},{"type":"p","indent":false,"html":"<strong>Rumble sounds flat and static.<\/strong> Either you're running a compressor and the modulator together, or the modulation amount is near zero."},{"type":"p","indent":false,"html":"<strong>Rumble sounds fizzy or crowds the mids.<\/strong> The drive is creating harmonics above 200 Hz. Add or lower the post-filter EQ+ (Part 2, position 4)."},{"type":"p","indent":false,"html":"<strong>Rumble keeps going during the breakdown.<\/strong> The DRUMS group filter doesn't reach it, because KICK's send leaves before the group. Automate the RUMBLE fader as well (13.7)."},{"type":"p","indent":false,"html":"<strong>Low end is muddy or boomy after adding a bass or second rumble.<\/strong> Two layers are carrying the sub. Pick one owner and high-pass the rest (Part 14)."},{"type":"p","indent":false,"html":"<strong>A Part 16 pattern sounds stiff or mechanical.<\/strong> Flat velocities, or the parts are all one bar long and repeat identically. Vary velocities (Part 3), then make one cell drift (16.8)."},{"type":"p","indent":false,"html":"<strong>Open hat smears into the closed hat.<\/strong> Nothing is choking it. Find the Drum Machine's choke setting or shorten the open hat's decay (16.7)."},{"type":"p","indent":false,"html":"<strong>Resonators whistle, or one note jumps out (12.14).<\/strong> Resonant bands pile energy onto single frequencies. Lower that band's gain or Q in Resonator Bank, notch it narrowly with EQ+, or turn the click down going into the bank: resonant filters get much louder than their input and can clip. If the whole voice sounds like a bell tree, lower the comb or body's feedback."},{"type":"p","indent":false,"html":"<strong>Export is quieter than what you were hearing.<\/strong> Check the Pre-fader option in the export dialog is unticked. It ignores all mixer volume automation."},{"type":"p","indent":false,"html":"<strong>Export is quiet even though the master meter looked fine.<\/strong> The master meter shows peak, not loudness. See Part 11."},{"type":"p","indent":false,"html":"<strong>Can't find Character or Learn Make-up Gain on the compressor.<\/strong> Two causes. You may have loaded <strong>Compressor<\/strong> rather than <strong>Compressor+<\/strong>, which are separate devices; right-click the device header for the Upgrade to Compressor+ option. Or the Character chooser is there but shows its current value rather than the word \"Character,\" so look for a small dropdown reading <strong>Vanilla<\/strong>. Widening the device, or using the Inspector Panel, exposes controls hidden on a narrow device."},{"type":"p","indent":false,"html":"<strong>Whole mix pumps on every kick after adding the master chain.<\/strong> The limiter is doing too much, and its gain reduction is stacking on top of the rumble's sidechain. Reduce the limiter's input gain and take more off with Over instead."},{"type":"p","indent":false,"html":"<strong>Over's Threshold has no obvious right value.<\/strong> It's an absolute level, so it depends entirely on what's arriving at it. Gain stage first, then use the procedure in Part 11. A number from another project is meaningless here."},{"type":"p","indent":false,"html":"<strong>Effects inside a container get no signal; only the instrument is heard.<\/strong> The instrument and the effects ended up in <strong>separate parallel layers<\/strong> of the container, so the effects are processing silence. Layers in a layer container play side by side, not one after another. Drag the effects device into the <strong>same layer as the instrument, to its right<\/strong>, then delete the empty layer. Quick test: mute the instrument. If everything goes silent, the effects aren't being fed."},{"type":"p","indent":false,"html":"<strong>Saved preset is missing the effects.<\/strong> You saved from an inner device instead of the outer container, or the preset did save and its containers are just collapsed. Save from the outermost vertical name strip and check the highlight covers the whole device (Part 10). When testing, click into every container before concluding anything is missing."},{"type":"p","indent":false,"html":"<strong>Sound keeps playing after I stop.<\/strong> A feedback loop is regenerating faster than it decays, usually pushed over the edge by saturation inside or after the loop. Turn your monitoring down first. Then set delay Feedback to zero, one device at a time, then check Filter+ FB FX sections and Phaser+ FB, until the tail stops. Bring the culprit back up only until the sound dies on its own when you stop. (An FX Grid drone from Part 15.3 also keeps playing by design; mute or bypass it. So does the feedback looper in 12.13: drop its Feedback to zero to clear it. In 12.14, check the comb or short-delay body and Resonator Bank's Q as well.)"},{"type":"p","indent":false,"html":"<strong>Processed sound is muffled or \"underwater.\"<\/strong> See 12.2, \"When it sounds underwater.\" Bypass devices one at a time to find the culprit before reaching for EQ."},{"type":"p","indent":false,"html":"<strong>Turning the Filter+ knob raises the pitch but doesn't change the character.<\/strong> You're turning <strong>Cutoff<\/strong> (the big knob). Resonance is the smaller knob beside it, and that's the one that adds the vocal, liquid quality."},{"type":"p","indent":false,"html":"<strong>Arrangement events are one bar off from the guide.<\/strong> Older versions of Part 8 counted from bar 0. Bitwig starts at bar 1; the current table does too."}],"subs":[]},{"title":"Labels I'm not certain about in Bitwig 6","blocks":[{"type":"p","indent":false,"html":"Flagging these honestly rather than sending you hunting for names that may not exist. If something doesn't match your screen, the idea is right and the label or location may differ."},{"type":"h4","text":"Setup and editing"},{"type":"p","indent":true,"html":"Where the project-wide key signature is set (Part 1)"},{"type":"p","indent":true,"html":"The exact name of Sampler's playback mode chooser and its One-shot option"},{"type":"p","indent":true,"html":"Where the velocity lane lives in the clip editor, versus editing velocity in the Inspector"},{"type":"p","indent":true,"html":"Whether clip loop length lives in the Inspector or only on the clip editor's loop markers, and the exact
